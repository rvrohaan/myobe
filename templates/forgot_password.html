<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — MyOBE</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:      #6366f1;
      --primary-dark: #4f46e5;
      --text:         #f1f5f9;
      --muted:        rgba(255,255,255,.48);
      --border:       rgba(255,255,255,.1);
      --radius:       14px;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #080618 0%, #0d0b26 40%, #12103a 70%, #080618 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0;
    }
    .bg-orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(99,102,241,.2) 0%, transparent 70%); top: -120px; left: -120px; }
    .bg-orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(139,92,246,.15) 0%, transparent 70%); bottom: -80px; right: -80px; }

    /* ── Navbar ── */
    nav { position:sticky; top:0; z-index:100; background:rgba(8,6,24,.88); backdrop-filter:blur(18px); border-bottom:1px solid rgba(255,255,255,.07); padding:0 5%; display:flex; align-items:center; height:64px; }
    .nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font-size:1.15rem; font-weight:800; letter-spacing:-.4px; flex-shrink:0; }
    .nav-brand-icon { width:36px; height:36px; background:var(--primary); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; box-shadow:0 2px 8px rgba(99,102,241,.5); }
    .nav-links { display:flex; align-items:center; gap:4px; margin-left:36px; list-style:none; }
    .nav-links a { display:block; padding:7px 14px; text-decoration:none; font-size:.9rem; font-weight:500; color:rgba(255,255,255,.6); border-radius:8px; transition:color .15s,background .15s; }
    .nav-links a:hover { color:#fff; background:rgba(255,255,255,.08); }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .btn-nav-ghost { padding:8px 18px; background:transparent; border:1.5px solid rgba(255,255,255,.2); border-radius:8px; font-size:.88rem; font-weight:600; color:rgba(255,255,255,.8); text-decoration:none; transition:border-color .15s,color .15s; }
    .btn-nav-ghost:hover { border-color:var(--primary); color:#fff; }
    .btn-nav-primary { padding:8px 20px; background:var(--primary); border:none; border-radius:8px; font-size:.88rem; font-weight:700; color:#fff; text-decoration:none; transition:background .15s; }
    .btn-nav-primary:hover { background:var(--primary-dark); }
    .nav-plan-badge { font-size:.68rem; font-weight:700; padding:2px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
    .nav-plan-basic   { background:rgba(52,211,153,.12);  color:#6ee7b7; }
    .nav-plan-pro     { background:rgba(99,102,241,.12);  color:#a5b4fc; }
    .nav-plan-premium { background:rgba(196,181,253,.12); color:#c4b5fd; }
    @media (max-width:640px) { .nav-links { display:none; } }

    /* ── Page ── */
    .page-wrap { flex:1; position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; }
    .brand { display:flex; flex-direction:column; align-items:center; margin-bottom:24px; text-align:center; }
    .brand-icon { width:56px; height:56px; background:linear-gradient(135deg, var(--primary), #8b5cf6); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.75rem; margin-bottom:12px; box-shadow:0 8px 32px rgba(99,102,241,.4); }
    .brand h1 { font-size:1.28rem; font-weight:800; color:#fff; letter-spacing:-.3px; }
    .brand p  { font-size:.83rem; color:var(--muted); margin-top:3px; }

    .card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(24px);
      border-radius: 20px;
      width: 100%; max-width: 420px;
      padding: 32px 30px;
      box-shadow: 0 24px 64px rgba(0,0,0,.4);
    }
    .card h2 { font-size:1.05rem; font-weight:700; color:#fff; margin-bottom:6px; }
    .card .desc { font-size:.85rem; color:var(--muted); margin-bottom:24px; line-height:1.55; }

    .field { margin-bottom:15px; }
    .field label { display:block; font-size:.72rem; font-weight:700; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px; }
    .field input {
      width:100%; padding:11px 14px;
      background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.12);
      border-radius:10px; font-size:.92rem; outline:none; color:#fff;
      transition:border-color .15s,box-shadow .15s,background .15s;
    }
    .field input::placeholder { color:rgba(255,255,255,.22); }
    .field input:focus { border-color:rgba(99,102,241,.6); box-shadow:0 0 0 3px rgba(99,102,241,.15); background:rgba(255,255,255,.1); }

    .btn-submit {
      width:100%; padding:12px;
      background:linear-gradient(135deg, var(--primary), #8b5cf6);
      color:#fff; border:none; border-radius:10px;
      font-size:.95rem; font-weight:700; cursor:pointer;
      transition:opacity .15s,transform .15s;
      box-shadow:0 4px 20px rgba(99,102,241,.35);
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-submit:hover:not(:disabled) { opacity:.9; transform:translateY(-1px); }
    .btn-submit:disabled { opacity:.7; cursor:not-allowed; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner {
      width:15px; height:15px; flex-shrink:0;
      border:2px solid rgba(255,255,255,.35);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .65s linear infinite;
    }

    .alert-success {
      background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.25);
      color:#6ee7b7; padding:12px 16px; border-radius:10px;
      font-size:.87rem; margin-bottom:20px;
      display:flex; align-items:flex-start; gap:8px; line-height:1.5;
    }

    .back-link { display:block; text-align:center; margin-top:20px; font-size:.83rem; color:var(--muted); }
    .back-link a { color:#a5b4fc; font-weight:600; text-decoration:none; }
    .back-link a:hover { text-decoration:underline; }
    .theme-toggle-btn { width:36px; height:36px; border-radius:8px; border:1.5px solid rgba(255,255,255,.2); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem; transition:border-color .15s; flex-shrink:0; line-height:1; }
    html.light-theme { --primary: #2563eb; --primary-dark: #1d4ed8; --text: #1e293b; --muted: rgba(30,41,59,.55); }
    html.light-theme body { background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 40%, #eff6ff 70%, #dbeafe 100%); background-attachment: fixed; color: #1e293b; }
    html.light-theme nav { background: rgba(219,234,254,.92); border-bottom-color: rgba(37,99,235,.12); }
    html.light-theme .nav-brand { color: #1e293b; }
    html.light-theme .nav-links a { color: rgba(30,41,59,.65); }
    html.light-theme .btn-nav-ghost { border-color: rgba(37,99,235,.3); color: rgba(30,41,59,.8); }
    html.light-theme .btn-nav-ghost:hover { border-color: #2563eb; color: #1e293b; }
    html.light-theme .theme-toggle-btn { border-color: rgba(37,99,235,.3); }
    html.light-theme .brand h1 { color: #1e293b; }
    html.light-theme .card { background: rgba(255,255,255,.85); border-color: rgba(37,99,235,.12); box-shadow: 0 12px 48px rgba(37,99,235,.12); }
    html.light-theme .card h2 { color: #1e293b; }
    html.light-theme .card .desc { color: rgba(30,41,59,.55); }
    html.light-theme .field label { color: rgba(30,41,59,.5); }
    html.light-theme .field input { background: rgba(255,255,255,.85); border-color: rgba(37,99,235,.2); color: #1e293b; }
    html.light-theme .field input::placeholder { color: rgba(30,41,59,.3); }
    html.light-theme .field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); background: #fff; }
    html.light-theme .back-link { color: rgba(30,41,59,.5); }
    html.light-theme .back-link a { color: #2563eb; }
    html.light-theme .alert-success { background: rgba(5,150,105,.1); border-color: rgba(5,150,105,.25); color: #065f46; }
  </style>
  <script>(function(){ if(localStorage.getItem('myobe-theme')==='light') document.documentElement.classList.add('light-theme'); })();</script>
  <link rel="stylesheet" href="/static/a11y.css">
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

{% include 'partials/_navbar.html' %}

<div class="page-wrap">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></div>
    <h1>MyOBE</h1>
    <p>Academic Content Generator</p>
  </div>

  <div class="card">
    <h2>Forgot your password?</h2>
    <p class="desc">Enter the email address on your account and we'll send you a reset link.</p>

    {% if message %}
    <div class="alert-success">
      <span>✓</span><span>{{ message }}</span>
    </div>
    {% else %}
    <form method="POST" id="fp-form">
      <div class="field">
        <label for="fp-email">Email address</label>
        <input id="fp-email" name="email" type="email" autocomplete="email" autofocus required
               placeholder="you@example.com">
      </div>
      <button class="btn-submit" type="submit" id="fp-btn">Send reset link</button>
    </form>
    <script>
      document.getElementById('fp-form').addEventListener('submit', function() {
        var btn = document.getElementById('fp-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Sending…';
      });
    </script>
    {% endif %}

    <p class="back-link">
      Remember your password? <a href="/login">Sign In</a>
    </p>
  </div>
</div>

</body>
</html>
