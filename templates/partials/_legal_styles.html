<!-- Shared styles for the legal / compliance pages (privacy, terms, refund,
     contact). Includes the nav styling the shared navbar partial depends on,
     plus the readable document layout, with light-theme support. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:      #6366f1;
    --primary-dark: #4f46e5;
    --text:         #f1f5f9;
    --muted:        rgba(255,255,255,.66);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #080618 0%, #0d0b26 40%, #12103a 70%, #080618 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
  }

  /* -- Navbar (the shared _navbar.html partial relies on these) -- */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,6,24,.88); backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.07);
    padding: 0 5%;
    display: flex; align-items: center; height: 64px;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: #fff;
    font-size: 1.15rem; font-weight: 800; letter-spacing: -.4px; flex-shrink: 0;
  }
  .nav-brand-icon {
    width: 36px; height: 36px; background: var(--primary); border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; box-shadow: 0 2px 8px rgba(99,102,241,.5);
  }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-username { font-size: .8rem; color: rgba(255,255,255,.5); }
  .nav-token-badge { font-size: .68rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(99,102,241,.18); color: #a5b4fc; letter-spacing: .02em; }
  .btn-nav-ghost {
    padding: 8px 18px; background: transparent;
    border: 1.5px solid rgba(255,255,255,.2); border-radius: 8px;
    font-size: .88rem; font-weight: 600; color: rgba(255,255,255,.8);
    text-decoration: none; transition: border-color .15s, color .15s;
  }
  .btn-nav-ghost:hover { border-color: var(--primary); color: #fff; }
  .btn-nav-primary {
    padding: 8px 20px; background: var(--primary); border: none;
    border-radius: 8px; font-size: .88rem; font-weight: 700;
    color: #fff; text-decoration: none; transition: background .15s;
  }
  .btn-nav-primary:hover { background: var(--primary-dark); }
  .theme-toggle-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,.2);
    background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: border-color .15s, background .15s;
    flex-shrink: 0; line-height: 1;
  }
  .theme-toggle-btn:hover { border-color: var(--primary); }

  /* -- Document layout -- */
  .legal-wrap {
    flex: 1; width: 100%; max-width: 820px;
    margin: 0 auto; padding: 56px 24px 72px;
  }
  .legal-wrap h1 {
    font-size: clamp(1.7rem, 4vw, 2.2rem); font-weight: 900;
    letter-spacing: -.4px; color: #fff; margin-bottom: 10px;
  }
  .legal-eff {
    font-size: .85rem; color: var(--muted); margin-bottom: 28px;
  }
  .legal-wrap h2 {
    font-size: 1.05rem; font-weight: 700; color: #fff;
    margin: 28px 0 8px;
  }
  .legal-wrap p {
    font-size: .95rem; line-height: 1.7; color: rgba(255,255,255,.72);
    margin-bottom: 14px;
  }
  .legal-wrap a { color: #a5b4fc; text-decoration: none; }
  .legal-wrap a:hover { text-decoration: underline; }
  .legal-wrap strong { color: #fff; font-weight: 700; }
  .legal-contact {
    margin-top: 32px; padding: 18px 20px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; font-size: .92rem; line-height: 1.7;
    color: rgba(255,255,255,.78);
  }
  .legal-contact strong { color: #fff; }

  /* -- Light theme -- */
  html.light-theme { --primary: #2563eb; --primary-dark: #1d4ed8; --text: #1e293b; --muted: rgba(30,41,59,.66); }
  html.light-theme body { background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 40%, #eff6ff 70%, #dbeafe 100%); background-attachment: fixed; color: #1e293b; }
  html.light-theme nav { background: rgba(219,234,254,.92); border-bottom-color: rgba(37,99,235,.12); }
  html.light-theme .nav-brand { color: #1e293b; }
  html.light-theme .nav-username { color: rgba(30,41,59,.5); }
  html.light-theme .nav-token-badge { background: rgba(37,99,235,.12); color: #2563eb; }
  html.light-theme .btn-nav-ghost { border-color: rgba(37,99,235,.3); color: rgba(30,41,59,.8); }
  html.light-theme .btn-nav-ghost:hover { border-color: #2563eb; color: #1e293b; }
  html.light-theme .theme-toggle-btn { border-color: rgba(37,99,235,.3); }
  html.light-theme .legal-wrap h1, html.light-theme .legal-wrap h2 { color: #1e293b; }
  html.light-theme .legal-wrap p { color: rgba(30,41,59,.78); }
  html.light-theme .legal-wrap a { color: #2563eb; }
  html.light-theme .legal-wrap strong { color: #1e293b; }
  html.light-theme .legal-contact { background: rgba(255,255,255,.7); border-color: rgba(37,99,235,.15); color: rgba(30,41,59,.8); }
  html.light-theme .legal-contact strong { color: #1e293b; }
</style>
