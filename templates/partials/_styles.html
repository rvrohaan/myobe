  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #6366f1;
      --primary-dark:  #4f46e5;
      --primary-light: rgba(99,102,241,.18);
      --bg:            #080618;
      --card:          rgba(255,255,255,.06);
      --text:          #f1f5f9;
      --muted:         rgba(255,255,255,.66);
      --border:        rgba(255,255,255,.1);
      --success:       #10b981;
      --error:         #ef4444;
      --radius:        12px;
      --shadow:        0 8px 32px rgba(0,0,0,.35);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #080618 0%, #0d0b26 40%, #12103a 70%, #080618 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      padding-bottom: 60px;
    }

    /* ── Navbar ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,6,24,.88); backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 5%;
      display: flex; align-items: center; height: 64px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: #fff;
      font-size: 1.15rem; font-weight: 800; letter-spacing: -.4px; flex-shrink: 0;
    }
    .nav-brand-icon {
      width: 36px; height: 36px; background: var(--primary); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 2px 8px rgba(79,70,229,.4);
    }
    .nav-links { display: flex; align-items: center; gap: 4px; margin-left: 36px; list-style: none; }
    .nav-links a {
      display: block; padding: 7px 14px; text-decoration: none;
      font-size: .9rem; font-weight: 500; color: rgba(255,255,255,.6);
      border-radius: 8px; transition: color .15s, background .15s;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255,255,255,.08); }
    .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .nav-username { font-size: .8rem; color: rgba(255,255,255,.5); }
    .btn-nav-ghost {
      padding: 8px 18px; background: transparent;
      border: 1.5px solid rgba(255,255,255,.2); border-radius: 8px;
      font-size: .88rem; font-weight: 600; color: rgba(255,255,255,.8);
      text-decoration: none; transition: border-color .15s, color .15s;
    }
    .btn-nav-ghost:hover { border-color: var(--primary); color: #fff; }
    .btn-nav-primary {
      padding: 8px 20px; background: var(--primary); border: none;
      border-radius: 8px; font-size: .88rem; font-weight: 700;
      color: #fff; text-decoration: none; transition: background .15s;
    }
    .btn-nav-primary:hover { background: var(--primary-dark); }
    @media (max-width: 640px) { .nav-links { display: none; } }
    .nav-username { font-size: .8rem; color: rgba(255,255,255,.5); }
    .nav-token-badge { font-size: .68rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(99,102,241,.18); color: #a5b4fc; letter-spacing: .02em; }

    .container { max-width: 860px; margin: 0 auto; padding: 28px 16px; transition: max-width .25s ease; }
    .container.wide { max-width: min(1440px, 96vw); }
    .app-footer { max-width: 860px; margin: 8px auto 32px; padding: 18px 16px 0; text-align: center; border-top: 1px solid rgba(148,163,184,.18); }
    .app-footer p { font-size: .85rem; color: var(--muted, #94a3b8); margin: 0; }
    .app-footer a { color: var(--primary, #6366f1); text-decoration: none; }
    .app-footer a:hover { text-decoration: underline; }

    /* ── Step indicator ── */
    .steps {
      display: flex; align-items: center;
      background: var(--card); border-radius: var(--radius);
      padding: 14px 20px; box-shadow: var(--shadow);
      margin-bottom: 24px; overflow-x: auto;
    }
    /* Each step pill shrinks to content — connectors carry all the flex growth */
    .step { display: flex; align-items: center; flex: 0 0 auto; }
    /* Connector sits between step pills as a real flex item */
    .step-connector {
      flex: 1; height: 2px; min-width: 16px;
      background: var(--border); margin: 0 4px;
      transition: background .25s;
    }
    .step-connector.done   { background: var(--success); }
    .step-connector.active { background: var(--primary-light); }
    .step-dot {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--border); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; flex-shrink: 0;
      transition: background .25s, color .25s;
    }
    .step.active .step-dot { background: var(--primary); color: #fff; }
    .step.done   .step-dot { background: var(--success); color: #fff; }
    .step-label {
      font-size: .68rem; color: var(--muted); margin-left: 5px;
      white-space: nowrap;
    }
    .step.active .step-label { color: var(--primary); font-weight: 600; }
    .step.done   .step-label { color: var(--success); }

    /* Compact step bar: centre steps when there are only 2–3 */
    .steps-compact { justify-content: center; }
    .steps-compact .step-connector { flex: 0 0 72px; }

    /* ── Card ── */
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 28px; box-shadow: var(--shadow); margin-bottom: 20px;
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .card h2   { font-size: 1.1rem; margin-bottom: 4px; }
    .card .sub { color: var(--muted); font-size: .875rem; margin-bottom: 20px; line-height: 1.4; }

    /* ── Mode selection (layout only; visual styles in _section_mode_select.html) ── */
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 700px) { .mode-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 440px) { .mode-grid { grid-template-columns: 1fr; } }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 52px 24px; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover,
    .upload-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
    .upload-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .upload-zone h3 { font-size: 1rem; margin-bottom: 6px; }
    .upload-zone p  { font-size: .8rem; color: var(--muted); }
    .upload-zone input { display: none; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 20px; border-radius: 8px; border: none;
      cursor: pointer; font-size: .875rem; font-weight: 600;
      transition: background .15s, opacity .15s;
    }
    .btn-primary  { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Spinner ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: spin .75s linear infinite; flex-shrink: 0;
    }
    .spinner.dark { border-color: rgba(79,70,229,.25); border-top-color: var(--primary); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress bar ── */
    .progress-bar { height: 3px; background: var(--primary-light); border-radius: 4px; overflow: hidden; margin-top: 14px; }
    .progress-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
    .progress-fill.pulse { animation: progress-pulse 1.4s ease-in-out infinite; }
    @keyframes progress-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Course list ── */
    .search-box {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .875rem; outline: none; margin-bottom: 12px;
      background: rgba(255,255,255,.06); color: var(--text);
      transition: border-color .15s;
    }
    .search-box:focus { border-color: var(--primary); }
    .course-list { display: grid; gap: 8px; max-height: 340px; overflow-y: auto; padding-right: 2px; }
    .course-item {
      border: 2px solid var(--border); border-radius: 8px; padding: 12px 16px;
      cursor: pointer; display: flex; align-items: center; gap: 12px;
      transition: border-color .15s, background .15s;
    }
    .course-item:hover    { border-color: var(--primary); background: rgba(99,102,241,.07); }
    .course-item.selected { border-color: var(--primary); background: var(--primary-light); }
    .course-code  { font-family: monospace; font-size: .875rem; font-weight: 700; color: var(--primary); min-width: 110px; }
    .course-title { font-size: .85rem; flex: 1; line-height: 1.3; }
    .sem-badge {
      font-size: .7rem; font-weight: 600;
      background: var(--primary-light); color: var(--primary);
      padding: 2px 8px; border-radius: 12px; white-space: nowrap;
    }

    /* ── Slider ── */
    .slider-row { margin-top: 18px; }
    .slider-row label { font-size: .8rem; color: var(--muted); display: block; margin-bottom: 6px; }
    .slider-row input[type=range] { width: 100%; accent-color: var(--primary); }
    .slider-ticks { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .slider-val { font-weight: 700; color: var(--primary); }

    /* ── Number inputs row (QB config) ── */
    .num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .num-field label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .num-field input[type=number] {
      width: 100%; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .95rem; font-weight: 600; color: var(--primary); outline: none;
      background: rgba(255,255,255,.06);
      transition: border-color .15s;
    }
    .num-field input[type=number]:focus { border-color: var(--primary); }
    .num-field .hint { font-size: .68rem; color: var(--muted); margin-top: 2px; }

    /* ── Stream output (hidden, kept for JS compatibility) ── */
    .stream-output { display: none; }
    .hl-co   { color: #e2e8f0; font-weight: 700; }
    .hl-pipe { color: #475569; }
    .log-ok   { color: #4ade80; }
    .log-info { color: #60a5fa; }
    .log-warn { color: #facc15; }

    /* ── Loading spinner ── */
    .loading-spinner-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 0 32px;
      gap: 24px;
    }
    .loading-spinner {
      width: 56px; height: 56px;
      border: 5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
.gen-error {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      background: rgba(239,68,68,.1); color: #fca5a5; border: 1px solid rgba(239,68,68,.25);
      font-size: .875rem; display: none;
    }

    /* ── CO cards ── */
    .select-controls { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .select-controls .label { font-size: .78rem; color: var(--muted); }
    .ctrl-btn {
      background: none; border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 6px;
      cursor: pointer; font-size: .75rem; color: var(--muted);
      transition: border-color .15s, color .15s;
    }
    .ctrl-btn:hover { border-color: var(--primary); color: var(--primary); }
    .sel-count { font-size: .78rem; color: var(--muted); margin-left: auto; }
    .co-cards { display: grid; gap: 8px; }
    .co-card {
      border: 2px solid var(--border); border-radius: 8px; padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .co-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .co-card.co-card-disabled { opacity: .38; cursor: not-allowed; pointer-events: none; }
    .co-card input[type=checkbox] { width: 15px; height: 15px; margin-top: 2px; flex-shrink: 0; accent-color: var(--primary); cursor: pointer; }
    .co-num  { font-weight: 700; color: var(--primary); min-width: 34px; font-size: .875rem; }
    .co-text { font-size: .85rem; line-height: 1.5; }

    /* ── CO table ── */
    .co-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: 16px; }
    .co-table th { background: rgba(99,102,241,.15); padding: 8px 12px; text-align: left; font-weight: 600; border: 1px solid var(--border); color: #c7d2fe; }
    .co-table td { padding: 7px 12px; border: 1px solid var(--border); vertical-align: middle; }
    .co-table tr:nth-child(even) td { background: rgba(255,255,255,.03); }
    .bloom { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .L1 { background: rgba(14,165,233,.15);  color: #7dd3fc; }
    .L2 { background: rgba(34,197,94,.12);   color: #86efac; }
    .L3 { background: rgba(234,179,8,.12);   color: #fde68a; }
    .L4 { background: rgba(249,115,22,.12);  color: #fed7aa; }
    .L5 { background: rgba(167,139,250,.15); color: #c4b5fd; }
    .L6 { background: rgba(244,63,94,.12);   color: #fda4af; }

    /* ── Format picker ── */
    .format-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .fmt-card {
      border: 2px solid var(--border); border-radius: 8px; padding: 14px 22px;
      cursor: pointer; text-align: center; min-width: 90px;
      transition: border-color .15s, background .15s;
    }
    .fmt-card:hover    { border-color: var(--primary); }
    .fmt-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .fmt-icon  { font-size: 1.6rem; margin-bottom: 4px; }
    .fmt-label { font-size: .8rem; font-weight: 600; }

    /* ── QB preview ── */
    .qb-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
    .qb-stat {
      background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; text-align: center;
    }
    .qb-stat .val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .qb-stat .lbl { font-size: .72rem; color: var(--muted); margin-top: 2px; }

    /* ── Paper type selector ── */
    .ptype-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .ptype-card {
      border: 2px solid var(--border); border-radius: 8px; padding: 14px;
      cursor: pointer; text-align: center;
      transition: border-color .15s, background .15s;
    }
    .ptype-card:hover    { border-color: var(--primary); }
    .ptype-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .ptype-icon  { font-size: 1.6rem; margin-bottom: 6px; }
    .ptype-label { font-size: .85rem; font-weight: 700; }
    .ptype-desc  { font-size: .72rem; color: var(--muted); margin-top: 3px; }

    /* ── Generic input helpers (lesson plan config, etc.) ── */
    .input-label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
    .text-input {
      width: 100%; padding: 8px 10px; box-sizing: border-box;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .9rem; outline: none; transition: border-color .15s;
      background: rgba(255,255,255,.06); color: var(--text);
    }
    .text-input:focus { border-color: var(--primary); }

    /* ── Form fields ── */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field-row.solo { grid-template-columns: 1fr; }
    .field label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .field input[type=text], .field input[type=number] {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .9rem; outline: none; transition: border-color .15s;
      background: rgba(255,255,255,.06); color: var(--text);
    }
    .field input:focus { border-color: var(--primary); }

    /* ── Part config (Internal/Final) ── */
    .parts-section { margin-top: 18px; }
    .parts-section h3 { font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .part-row {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px;
      margin-bottom: 8px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: start;
    }
    .part-row .part-hdr { grid-column: 1 / -1; font-size: .8rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .part-row .avail-hint { font-size: .7rem; color: var(--muted); margin-top: 3px; min-height: 1em; }

    /* ── Paper template selector ── */
    .tpl-sel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 4px; }
    .tpl-sel-card {
      border: 2px solid var(--border); border-radius: 8px; padding: 12px 10px;
      cursor: pointer; text-align: center;
      transition: border-color .15s, background .15s;
    }
    .tpl-sel-card:hover    { border-color: var(--primary); }
    .tpl-sel-card.selected { border-color: var(--primary); background: var(--primary-light); }
    .tpl-sel-icon  { font-size: 1.4rem; margin-bottom: 5px; }
    .tpl-sel-name  { font-size: .82rem; font-weight: 700; margin-bottom: 2px; }
    .tpl-sel-desc  { font-size: .7rem; color: var(--muted); margin-bottom: 8px; }
    .tpl-sel-counts { display: flex; flex-direction: column; gap: 2px; }
    .tpl-sel-counts span { font-size: .72rem; color: var(--primary); font-weight: 600; }

    /* ── Template fill slot grid ── */
    .tpl-unit-hdr { background:var(--primary);color:#fff;font-size:.78rem;font-weight:700;padding:6px 12px;letter-spacing:.4px; }
    .tpl-or-row   { background:rgba(255,255,255,.04);text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);padding:4px;border-top:1px solid var(--border);border-bottom:1px solid var(--border); }
    .tpl-slot-row { display:grid;grid-template-columns:52px 44px 1fr auto;gap:0;border-bottom:1px solid var(--border);align-items:stretch; }
    .tpl-slot-row:last-child { border-bottom:none; }
    .tpl-slot-cell { padding:6px 8px;font-size:.78rem;border-right:1px solid var(--border);display:flex;align-items:center; }
    .tpl-slot-cell:last-child { border-right:none; }
    .tpl-slot-qnum { justify-content:center;font-weight:700;color:var(--primary);flex-direction:column;gap:1px; }
    .tpl-slot-text { flex-direction:column;align-items:flex-start;gap:3px; }
    .tpl-slot-orig { color:var(--muted);font-style:italic;font-size:.72rem; }
    .tpl-slot-repl { color:#86efac;font-weight:500; }
    .tpl-slot-action { flex-direction:column;gap:4px;justify-content:center;align-items:flex-start;min-width:130px;padding:6px 10px; }
    .tpl-pick-btn { font-size:.72rem;padding:3px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--primary);background:none;color:var(--primary);white-space:nowrap; }
    .tpl-pick-btn:hover { background:var(--primary);color:#fff; }
    .tpl-clear-btn { font-size:.7rem;padding:2px 8px;border-radius:5px;cursor:pointer;border:1px solid #ccc;background:none;color:var(--muted); }
    .tpl-picker-panel { grid-column:1/-1;border-top:1px solid var(--border);background:rgba(255,255,255,.04);padding:8px;max-height:200px;overflow-y:auto; }
    .tpl-picker-item { padding:5px 8px;border-radius:5px;cursor:pointer;font-size:.75rem;border:1px solid transparent;margin-bottom:3px;line-height:1.35; }
    .tpl-picker-item:hover { background:var(--primary);color:#fff; }
    .tpl-picker-item .qm { font-size:.65rem;color:var(--muted);display:block;margin-bottom:1px; }
    .tpl-picker-item:hover .qm { color:rgba(255,255,255,.75); }

    .picker-toggle { grid-column: 1 / -1; margin-top: 6px; }
    .picker-toggle button { font-size: .75rem; color: var(--primary); background: none; border: none; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
    .picker-toggle button:hover { text-decoration: underline; }
    .picker-sel-count { font-size: .7rem; color: var(--muted); margin-left: 8px; }
    .picker-panel { grid-column: 1 / -1; margin-top: 8px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    .picker-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .picker-item:last-child { border-bottom: none; }
    .picker-item input[type=checkbox] { margin-top: 2px; flex-shrink: 0; accent-color: var(--primary); }
    .picker-item label { font-size: .75rem; line-height: 1.35; cursor: pointer; }
    .picker-item .q-meta { font-size: .65rem; color: var(--muted); display: block; margin-bottom: 1px; }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 10px 14px; background: rgba(255,255,255,.04);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: .78rem; color: var(--muted); margin-bottom: 16px;
    }
    .summary-bar strong { color: var(--text); }

    /* ── Alert ── */
    .alert { padding: 11px 14px; border-radius: 8px; font-size: .85rem; margin-top: 10px; }
    .alert-error { background: rgba(239,68,68,.1); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); }

    /* ── Upload loading (legacy — kept for backward compat) ── */
    .upload-loading {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      margin-top: 16px; color: var(--muted); font-size: .875rem;
    }

    /* ── Unified progress bar ── */
    .uni-progress { margin: 10px 0; }
    .uni-progress-label { font-size: .76rem; color: var(--muted); display: block; margin-bottom: 6px; }
    .uni-progress-track { position: relative; height: 7px; background: rgba(99,102,241,.18); border-radius: 99px; overflow: hidden; }
    .uni-progress-fill  { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); width: 0%; border-radius: 99px; transition: width .25s ease; }
    .uni-progress-fill.is-indeterminate { position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; border-radius: 99px; transition: none; animation: uni-slide 1.6s ease-in-out infinite; }
    @keyframes uni-slide { 0%{left:-40%} 100%{left:100%} }
    .uni-progress-fill.is-forward { width: 0%; transition: none; animation: uni-fill-fwd 120s cubic-bezier(.15,.5,.4,1) forwards; }
    @keyframes uni-fill-fwd { 0%{width:0%} 40%{width:55%} 70%{width:72%} 90%{width:82%} 100%{width:88%} }

    /* ── Branded confirm modal + busy overlay (replaces native confirm/alert) ── */
    .ui-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(8,6,24,.66); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .18s ease;
    }
    .ui-overlay.show { opacity: 1; }
    .ui-modal {
      width: 100%; max-width: 440px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.55);
      padding: 22px 22px 18px;
      transform: scale(.94) translateY(8px); opacity: 0;
      transition: transform .2s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
    }
    .ui-overlay.show .ui-modal { transform: none; opacity: 1; }
    .ui-modal-icon {
      width: 42px; height: 42px; border-radius: 11px; margin-bottom: 13px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(99,102,241,.14); color: var(--primary);
    }
    .ui-modal-icon svg { width: 22px; height: 22px; }
    .ui-modal-title { font-size: 1.06rem; font-weight: 700; margin: 0 0 7px; }
    .ui-modal-body  { font-size: .86rem; line-height: 1.6; color: var(--text); opacity: .9; margin: 0 0 13px; }
    .ui-modal-note  {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: .76rem; line-height: 1.5; color: var(--muted);
      background: rgba(99,102,241,.08); border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px; margin: 0 0 18px;
    }
    .ui-modal-note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; color: var(--primary); }
    .ui-modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .ui-modal-actions .btn { min-height: 44px; padding: 10px 18px; justify-content: center; }

    /* busy / regenerating overlay */
    .ui-busy-card {
      width: 100%; max-width: 384px; text-align: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.55);
      padding: 28px 26px 24px;
    }
    .ui-busy-card .spinner { width: 38px; height: 38px; border-width: 3px; margin: 0 auto 16px; }
    .ui-busy-title  { font-size: 1.02rem; font-weight: 700; margin: 0 0 5px; }
    .ui-busy-status { font-size: .84rem; color: var(--muted); margin: 0 0 16px; min-height: 1.25em; transition: opacity .25s ease; }
    .ui-busy-hint   { font-size: .72rem; color: var(--muted); opacity: .75; margin: 13px 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .ui-overlay, .ui-modal, .ui-busy-status { transition: none; }
      .ui-modal { transform: none; }
      .ui-busy-card .spinner, .uni-progress-fill.is-indeterminate { animation-duration: 0s; }
    }

    /* ── Toggle ── */
    .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .toggle-row label { font-size: .85rem; cursor: pointer; }
    input[type=checkbox].toggle { accent-color: var(--primary); width: 15px; height: 15px; }

    /* ── Actions ── */
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
    .actions .spacer { flex: 1; }

    .hidden { display: none !important; }

    /* ── Paper preview + AI panel layout ── */
    .preview-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .preview-layout #paper-preview-div,
    .preview-layout #m1-report-preview-div {
      flex: 1;
      min-width: 0;
    }

    /* ── AI Suggestions Panel ── */
    .ai-panel {
      width: 270px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: sticky;
      top: 20px;
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      transition: width .2s ease;
    }
    .ai-panel.collapsed { width: 44px; }
    .ai-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--primary-light);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: .82rem;
      color: #a5b4fc;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .ai-panel-title { flex: 1; overflow: hidden; }
    .ai-panel.collapsed .ai-panel-title { display: none; }
    .ai-panel-toggle { font-size: .9rem; flex-shrink: 0; }
    .ai-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      min-height: 0;
    }
    .ai-panel.collapsed .ai-panel-body { display: none; }
    .ai-status-msg {
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      padding: 8px 0;
    }
    .ai-card {
      border-radius: 6px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: .78rem;
      line-height: 1.5;
      border-left: 3px solid transparent;
    }
    .ai-card.ok      { background: rgba(34,197,94,.08);  border-color: rgba(34,197,94,.5); }
    .ai-card.tip     { background: rgba(234,179,8,.08);  border-color: rgba(234,179,8,.5); }
    .ai-card.warning { background: rgba(239,68,68,.08);  border-color: rgba(239,68,68,.5); }
    .ai-card-label {
      font-weight: 700;
      font-size: .68rem;
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .ai-card.ok      .ai-card-label { color: #86efac; }
    .ai-card.tip     .ai-card-label { color: #fde68a; }
    .ai-card.warning .ai-card-label { color: #fca5a5; }
    .ai-card[data-clickable] { cursor: pointer; }
    .ai-card[data-clickable]:hover { filter: brightness(.96); box-shadow: 0 1px 6px rgba(0,0,0,.12); }
    .ai-card[data-clickable]:active { filter: brightness(.92); }
    .ai-card .ai-apply-hint { font-size:.68rem; color:#9ca3af; margin-top:4px; }
    .ai-card.applying { opacity:.6; pointer-events:none; }
    @keyframes ai-spin { to { transform: rotate(360deg); } }
    .ai-spin { display: inline-block; animation: ai-spin .8s linear infinite; }
    .ai-rephrase-box {
      width: 100%; box-sizing: border-box;
      font-size: .75rem; font-family: inherit;
      border: 1px solid #d1d5db; border-radius: 4px;
      padding: 6px; resize: vertical; background: #f9fafb;
      color: #111827; cursor: text;
    }

    /* ── LP preview clickable rows ── */
    .lp-ai-row { user-select: none; }
    .lp-ai-row:hover { background: rgba(99,102,241,.07) !important; }
    .lp-ai-row.lp-selected { outline: 2px solid rgba(99,102,241,.45); }

    /* ── Word-style paper preview ── */
    #paper-preview-div {
      background: #fff;
      padding: 48px 64px;
      min-height: 560px;
      max-height: 72vh;
      overflow-y: auto;
      border: 1px solid #c9d0d8;
      border-radius: 4px;
      box-shadow: 0 3px 18px rgba(0,0,0,.13);
      outline: none;
      line-height: 1.6;
      font-size: 11pt;
      font-family: 'Calibri', 'Segoe UI', sans-serif;
      color: #111;
      caret-color: var(--primary);
      cursor: text;
    }
    #paper-preview-div:focus { box-shadow: 0 0 0 2px rgba(79,70,229,.18), 0 3px 18px rgba(0,0,0,.13); }
    #paper-preview-div table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #paper-preview-div td, #paper-preview-div th { border: 1px solid #aaa; padding: 4px 8px; vertical-align: top; font-size: 10.5pt; }
    #paper-preview-div th { background: #f0f0f0; font-weight: 600; }
    #paper-preview-div h1 { font-size: 15pt; margin: 10px 0 4px; }
    #paper-preview-div h2 { font-size: 12.5pt; margin: 8px 0 3px; }
    #paper-preview-div h3 { font-size: 11pt; margin: 6px 0 3px; }
    #paper-preview-div p  { margin: 3px 0; }
    #paper-preview-div strong { font-weight: 700; }

    /* ── Module 1 Report preview div (same styling as paper preview) ── */
    #m1-report-preview-div {
      background: #fff;
      padding: 48px 64px;
      min-height: 560px;
      max-height: 72vh;
      overflow-y: auto;
      border: 1px solid #c9d0d8;
      border-radius: 4px;
      box-shadow: 0 3px 18px rgba(0,0,0,.13);
      outline: none;
      line-height: 1.6;
      font-size: 11pt;
      font-family: 'Calibri', 'Segoe UI', sans-serif;
      color: #111;
      caret-color: var(--primary);
      cursor: text;
    }
    #m1-report-preview-div:focus { box-shadow: 0 0 0 2px rgba(79,70,229,.18), 0 3px 18px rgba(0,0,0,.13); }
    #m1-report-preview-div table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #m1-report-preview-div td, #m1-report-preview-div th { border: 1px solid #aaa; padding: 4px 8px; vertical-align: top; font-size: 10.5pt; }
    #m1-report-preview-div th { background: #f0f0f0; font-weight: 600; }
    #m1-report-preview-div h1 { font-size: 15pt; margin: 10px 0 4px; }
    #m1-report-preview-div h2 { font-size: 12.5pt; margin: 8px 0 3px; }
    #m1-report-preview-div h3 { font-size: 11pt; margin: 6px 0 3px; }
    #m1-report-preview-div p  { margin: 3px 0; }
    #m1-report-preview-div strong { font-weight: 700; }

    /* ── Module 3 Report preview div ── */
    #m3-report-preview-div {
      background: #fff;
      padding: 48px 64px;
      min-height: 560px;
      max-height: 72vh;
      overflow-y: auto;
      border: 1px solid #c9d0d8;
      border-radius: 4px;
      box-shadow: 0 3px 18px rgba(0,0,0,.13);
      outline: none;
      line-height: 1.6;
      font-size: 11pt;
      font-family: 'Calibri', 'Segoe UI', sans-serif;
      color: #111;
      caret-color: #e11d48;
      cursor: text;
    }
    #m3-report-preview-div:focus { box-shadow: 0 0 0 2px rgba(225,29,72,.18), 0 3px 18px rgba(0,0,0,.13); }
    #m3-report-preview-div table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #m3-report-preview-div td, #m3-report-preview-div th { border: 1px solid #aaa; padding: 4px 8px; vertical-align: top; font-size: 10.5pt; }
    #m3-report-preview-div th { background: #fff0f2; font-weight: 600; }
    #m3-report-preview-div h1 { font-size: 15pt; margin: 10px 0 4px; }
    #m3-report-preview-div h2 { font-size: 12.5pt; margin: 8px 0 3px; }
    #m3-report-preview-div h3 { font-size: 11pt; margin: 6px 0 3px; }
    #m3-report-preview-div p  { margin: 3px 0; }
    #m3-report-preview-div strong { font-weight: 700; }
    .preview-layout #m3-report-preview-div { flex: 1; min-width: 0; }

    /* ── Module 4 Report preview div ── */
    #m4-report-preview-div {
      background: #fff;
      padding: 48px 64px;
      min-height: 560px;
      max-height: 72vh;
      overflow-y: auto;
      border-radius: 10px;
      box-shadow: 0 3px 18px rgba(0,0,0,.1);
      font-size: 10.5pt;
      font-family: 'Times New Roman', serif;
      line-height: 1.6;
      outline: none;
      color: #111;
      caret-color: #059669;
      cursor: text;
    }
    #m4-report-preview-div:focus { box-shadow: 0 0 0 2px rgba(5,150,105,.18), 0 3px 18px rgba(0,0,0,.13); }
    #m4-report-preview-div table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #m4-report-preview-div td, #m4-report-preview-div th { border: 1px solid #aaa; padding: 4px 8px; vertical-align: top; font-size: 10.5pt; }
    #m4-report-preview-div th { background: #ecfdf5; font-weight: 600; }
    #m4-report-preview-div h1 { font-size: 15pt; margin: 10px 0 4px; }
    #m4-report-preview-div h2 { font-size: 12.5pt; margin: 8px 0 3px; }
    #m4-report-preview-div h3 { font-size: 11pt; margin: 6px 0 3px; }
    #m4-report-preview-div p  { margin: 3px 0; }
    #m4-report-preview-div strong { font-weight: 700; }
    .preview-layout #m4-report-preview-div { flex: 1; min-width: 0; }

    /* ── CO–PO Mapping table ── */
    .po-map-wrap { overflow-x: auto; margin-top: 16px; background: #fff; border-radius: 8px; padding: 4px; }
    .po-map-table { width: 100%; border-collapse: collapse; font-size: .82rem; color: #1e293b; }
    .po-map-table th { background: #b4c6e7; color: #1e293b; padding: 7px 10px; text-align: center; font-weight: 700; border: 1px solid #c8d8e8; white-space: nowrap; }
    .po-map-table th.co-hdr { text-align: left; }
    .po-map-table td { padding: 6px 10px; border: 1px solid #e2e8f0; text-align: center; background: #fff; color: #1e293b; }
    .po-map-table tr:nth-child(even) td { background: #f8fafc; }
    .po-map-table .co-label { text-align: left; font-weight: 700; background: #f0f4f8 !important; color: #1e293b; }
    .score-3 { background: #c6e0b4 !important; font-weight: 700; color: #1a5c1a; }
    .score-2 { background: #fff2cc !important; color: #7a5800; }
    .score-1 { background: #ddeef7 !important; color: #1a4d7a; }
    .score-0 { background: #fff !important; color: #94a3b8; }

    /* ── PO config checklist ── */
    .po-check-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: background .1s;
    }
    .po-check-row:hover { background: #fafbff; }
    .po-check-row input[type=checkbox] {
      margin-top: 3px; flex-shrink: 0;
      accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer;
    }
    .po-key-badge { font-weight: 700; color: var(--primary); font-size: .82rem; min-width: 38px; margin-top: 1px; flex-shrink: 0; }
    .po-check-info { flex: 1; min-width: 0; }
    .po-check-name { font-size: .85rem; font-weight: 600; }
    .po-check-desc { font-size: .73rem; color: var(--muted); line-height: 1.3; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Custom PO rows ── */
    .po-custom-row {
      display: grid; grid-template-columns: 90px 1fr 1.6fr auto;
      gap: 8px; align-items: center; margin-bottom: 8px;
    }
    @media (max-width: 600px) { .po-custom-row { grid-template-columns: 80px 1fr; } }
    .po-custom-row input[type=text] {
      width: 100%; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: .84rem; outline: none; transition: border-color .15s;
    }
    .po-custom-row input:focus { border-color: var(--primary); }
    .po-custom-del {
      background: none; border: 1px solid #fca5a5; color: #ef4444;
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: .85rem; line-height: 1;
    }
    .po-custom-del:hover { background: #fef2f2; }
    .po-input-hint { font-size: .7rem; color: var(--muted); margin-bottom: 3px; display: block; }

    /* ── Animation keyframes ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutRight {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(60px); }
    }

    /* ── Section entry animation ── */
    .animate-in { animation: fadeInUp .28s cubic-bezier(.2,.8,.4,1) both; }

    /* ── Toast notifications ── */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px;
      z-index: 9999; display: flex; flex-direction: column-reverse;
      gap: 10px; pointer-events: none; max-width: 360px;
    }
    .toast {
      background: #1e293b; color: #f1f5f9;
      padding: 12px 16px; border-radius: 10px;
      font-size: .84rem; font-weight: 500;
      box-shadow: 0 6px 24px rgba(0,0,0,.3);
      display: flex; align-items: center; gap: 10px;
      animation: slideInRight .28s cubic-bezier(.2,.8,.4,1);
      pointer-events: all; border-left: 4px solid transparent;
      min-width: 250px; line-height: 1.4;
    }
    .toast-success { border-color: #10b981; }
    .toast-info    { border-color: #4f46e5; }
    .toast-warning { border-color: #f59e0b; }
    .toast-out { animation: slideOutRight .25s ease forwards; }
    .toast-body { flex: 1; }
    .toast-close-btn {
      background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: 1.1rem; padding: 0; flex-shrink: 0; line-height: 1;
    }
    .toast-close-btn:hover { color: #f1f5f9; }

    /* ── Agentic next-step banner ── */
    .next-step-banner {
      background: linear-gradient(135deg, #4338ca 0%, #7c3aed 100%);
      color: #fff; border-radius: 12px; padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      margin-top: 20px;
      animation: fadeInUp .4s cubic-bezier(.2,.8,.4,1);
      box-shadow: 0 6px 28px rgba(99,60,180,.28);
    }
    .nxt-icon { font-size: 2rem; flex-shrink: 0; }
    .nxt-body { flex: 1; }
    .nxt-title { font-weight: 700; font-size: .95rem; margin-bottom: 3px; }
    .nxt-sub { font-size: .78rem; opacity: .85; line-height: 1.4; }
    .nxt-action {
      flex-shrink: 0; white-space: nowrap;
      background: rgba(255,255,255,.18);
      border: 1.5px solid rgba(255,255,255,.4);
      color: #fff; border-radius: 8px;
      padding: 9px 18px; font-size: .84rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .nxt-action:hover { background: rgba(255,255,255,.32); }
    .nxt-dismiss {
      flex-shrink: 0; background: none; border: none;
      color: rgba(255,255,255,.55); cursor: pointer;
      font-size: 1.2rem; padding: 0 2px; line-height: 1;
    }
    .nxt-dismiss:hover { color: #fff; }
    @media (max-width: 540px) {
      .next-step-banner { flex-wrap: wrap; }
      .nxt-action { width: 100%; text-align: center; margin-top: 4px; }
    }

    /* ── Rotating status messages during generation ── */
    .gen-status-cycle {
      font-size: .8rem; color: var(--muted); text-align: center;
      min-height: 1.2em; transition: opacity .3s;
    }

    /* ── Theme toggle button ── */
    .theme-toggle-btn {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,.2);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: border-color .15s, background .15s;
      flex-shrink: 0; line-height: 1;
    }
    .theme-toggle-btn:hover { border-color: var(--primary); background: var(--primary-light); }

    /* ── Light Theme ── */
    html.light-theme {
      --primary:       #2563eb;
      --primary-dark:  #1d4ed8;
      --primary-light: rgba(37,99,235,.12);
      --card:          rgba(255,255,255,.85);
      --text:          #1e293b;
      --muted:         rgba(30,41,59,.66);
      --border:        rgba(37,99,235,.2);
      --success:       #059669;
      --error:         #dc2626;
      --shadow:        0 8px 32px rgba(37,99,235,.1);
    }
    html.light-theme body {
      background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 40%, #eff6ff 70%, #dbeafe 100%);
      color: var(--text);
    }
    html.light-theme nav {
      background: rgba(219,234,254,.92);
      border-bottom-color: rgba(37,99,235,.12);
    }
    html.light-theme .nav-brand { color: #1e293b; }
    html.light-theme .nav-links a { color: rgba(30,41,59,.65); }
    html.light-theme .nav-links a:hover,
