  <!-- ── MODE 1: Generating COs ────────────────────────────────────────── -->
  <div id="sec-generating" class="card hidden">
    <h2 id="gen-title">Generating Course Outcomes…</h2>
    <p class="sub" id="gen-sub"></p>
    <div class="uni-progress hidden" id="gen-spinner">
      <span class="uni-progress-label gen-status-cycle" id="gen-status-msg">Analysing syllabus structure…</span>
      <div class="uni-progress-track"><div class="uni-progress-fill is-indeterminate"></div></div>
    </div>
    <div class="gen-error" id="gen-error"></div>
    <div class="stream-output" id="stream-out"></div>
  </div>

  <!-- ── MODE 1: Review COs ─────────────────────────────────────────────── -->
  <div id="sec-review" class="card hidden">
    <h2>Select Your Course Outcomes</h2>
    <p class="sub">15 COs generated — select up to <strong>7</strong> to include in your export.</p>
    <div class="select-controls">
      <span class="label">Select:</span>
      <button class="ctrl-btn" onclick="selectAll(false)">None</button>
      <button class="ctrl-btn" onclick="invertSel()">Invert</button>
      <span class="sel-count" id="sel-count"></span>
    </div>
    <div class="co-cards" id="co-cards"></div>
    <div id="co-tbl-wrap"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goBack('review')">← Regenerate</button>
      <button class="btn btn-primary" onclick="goToExport()">Continue to Export →</button>
    </div>
  </div>

  <!-- ── MODE 1: Export COs ─────────────────────────────────────────────── -->
  <div id="sec-export" class="card hidden">
    <h2>Export Course Outcomes</h2>
    <p class="sub" id="exp-sub"></p>
    <div class="summary-bar hidden" id="exp-summary"></div>
    <p style="font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:10px;">Output format</p>
    <div class="format-grid">
      <div class="fmt-card selected" data-fmt="txt"  onclick="pickFmt('txt')">
        <div class="fmt-icon">📝</div><div class="fmt-label">Text</div>
      </div>
      <div class="fmt-card" data-fmt="docx" onclick="pickFmt('docx')">
        <div class="fmt-icon">📘</div><div class="fmt-label">Word</div>
      </div>
      <div class="fmt-card" data-fmt="pdf"  onclick="pickFmt('pdf')">
        <div class="fmt-icon">📕</div><div class="fmt-label">PDF</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goBack('export')">← Back</button>
      <button class="btn btn-primary" id="btn-dl" onclick="doDownload()">⬇ Download</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" onclick="startOver()">Start Over</button>
    </div>
    <div class="uni-progress hidden" id="dl-cos-progress">
      <span class="uni-progress-label">Generating document…</span>
      <div class="uni-progress-track"><div class="uni-progress-fill"></div></div>
    </div>
    <div class="alert alert-error hidden" id="exp-err"></div>
  </div>
