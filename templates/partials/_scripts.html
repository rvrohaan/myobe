/* ── Mode step definitions ──────────────────────────────────────────────── */
const STEP_DEFS = {
  qpaper: ['Upload QB', 'Preview', 'Configure Paper', 'Export'],
};

/* ── Section → step mapping ──────────────────────────────────────────────── */
const STEP_MAP = {
  qpaper: { 'upload-qb':1, 'preview-qb':2, 'configure-paper':3, 'paper-preview':4 },
};

function setStepBar(n) {
  S.step = n;
  const defs = STEP_DEFS[S.mode];
  const bar  = document.getElementById('steps-bar');
  bar.classList.toggle('steps-compact', defs.length <= 3);
  bar.innerHTML = defs.map((label, i) => {
    const idx       = i + 1;
    const cls       = idx < n ? 'done' : idx === n ? 'active' : '';
    const dot       = idx < n ? '✓' : idx;
    const isLast    = i === defs.length - 1;
    // Connector state mirrors the step it follows (done if the step after it is active or done)
    const connCls   = idx < n ? 'done' : idx === n ? 'active' : '';
    const connector = isLast ? '' : `<div class="step-connector ${connCls}"></div>`;
    return `<div class="step ${cls}"><div class="step-dot">${dot}</div><span class="step-label">${label}</span></div>${connector}`;
  }).join('');
}

function setStepQP(n) { setStepBar(n); }

/* ── Section helpers ─────────────────────────────────────────────────────── */
const ALL_SECS = [
  'upload','courses',
  'upload-qb','preview-qb','configure-paper','template-fill','paper-preview',
];
function showSection(name) {
  ALL_SECS.forEach(s => document.getElementById(`sec-${s}`)?.classList.add('hidden'));
  // A wizard section is mutually exclusive with the home grid and module sub-screens.
  // Clear them too, otherwise a section opened from inside a module flow (e.g. composing
  // a paper from cache) can stay stacked behind the home view after navigating Back.
  document.getElementById('sec-mode-select')?.classList.add('hidden');
  _hideModuleSubs();
  const el = document.getElementById(`sec-${name}`);
  el.classList.remove('hidden');
  el.classList.remove('animate-in');
  void el.offsetWidth;
  el.classList.add('animate-in');
  document.querySelector('.container').classList.toggle('wide', name === 'paper-preview' || name === 'm1-preview');
}

function goBack(fromSec) {
  if (fromSec === 'aio-co-upload')        { showSection('courses');           setStepBar(2); }
  else if (fromSec === 'aio-po-upload')   { showSection(_m4OptionD ? 'aio-co-upload' : 'courses'); setStepBar(2); }
  else if (fromSec === 'courses')         { showSection('upload');            setStepBar(1); }
  else if (fromSec === 'preview-qb')      { showSection('upload-qb');         setStepBar(1); }
  else if (fromSec === 'configure-paper') { showSection('preview-qb');        setStepBar(2); }
  else if (fromSec === 'paper-preview')   { showSection(S.paperPreviewOrigin || 'configure-paper'); setStepBar(3); }
}

/* ── Token badge helpers ─────────────────────────────────────────────────── */
function updateTokenBadge(n) {
  document.querySelectorAll('.nav-token-badge').forEach(el => {
    el.textContent = '⦿ ' + n + ' tokens';
  });
  const gc = document.getElementById('greeting-token-count');
  if (gc) gc.textContent = n;
}
async function refreshTokenBadge() {
  try {
    const r = await fetch('/api/token_balance');
    if (r.ok) { const d = await r.json(); updateTokenBadge(d.tokens); }
  } catch(_) {}
}

/* Intercept fetch — auto-update badge whenever X-Tokens-Remaining header appears */
(function() {
  const _orig = window.fetch;
  window.fetch = async function(...args) {
    const resp = await _orig.apply(this, args);
    const remaining = resp.headers.get('X-Tokens-Remaining');
    if (remaining !== null) updateTokenBadge(parseInt(remaining, 10));
    return resp;
  };
})();

/* ── Upload syllabus (Mode 1 & 2) ────────────────────────────────────────── */
const zone      = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');

zone.addEventListener('click', () => fileInput.click());
zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['pdf','docx','doc','txt'].includes(ext)) {
    showErr('upload-err', `Unsupported file type ".${ext}". Use PDF, DOCX, or TXT.`); return;
  }
  document.getElementById('upload-err').classList.add('hidden');
  zone.style.pointerEvents = 'none';
  const fd = new FormData();
  fd.append('file', file);
  _xhrUpload('/upload', fd, {
    progressId: 'upload-loading', uploadLabel: 'Uploading syllabus…',
    processMs: 10000, processLabels: ['Extracting text…', 'Parsing document structure…', 'Detecting courses…', 'Almost ready…'],
    onSuccess:  d => { zone.style.pointerEvents = ''; S.courses = d.courses; _setSyllabusReuseBanner(false); renderCourses(); showSection('courses'); setStepBar(2); },
    onErrorRaw: (d, finish) => { if (d.ai_fallback) { handleAiExtract(); } else { finish(); zone.style.pointerEvents = ''; showErr('upload-err', d.error || 'Upload failed. Please try again.'); } },
    onError:    m => { zone.style.pointerEvents = ''; showErr('upload-err', m); },
  });
}

function handleAiExtract() {
  document.getElementById('upload-err').classList.add('hidden');
  zone.style.pointerEvents = 'none';
  _xhrUpload('/upload_ai_extract', new FormData(), {
    progressId: 'upload-loading', uploadLabel: 'Asking AI to read syllabus…', resume: true,
    processMs: 15000, processLabels: ['Analysing document structure…', 'Identifying courses…', 'Building course list…', 'Almost ready…'],
    onSuccess: d => { zone.style.pointerEvents = ''; S.courses = d.courses; _setSyllabusReuseBanner(false); renderCourses(); showSection('courses'); setStepBar(2); },
    onError:   m => { zone.style.pointerEvents = ''; showErr('upload-err', m); },
  });
}

/* ── Course list ─────────────────────────────────────────────────────────── */
function renderCourses(q = '') {
  document.getElementById('course-count').textContent = S.courses.length;
  const q2      = q.toLowerCase();
  const visible = q2
    ? S.courses.filter(c => c.code.toLowerCase().includes(q2) || c.title.toLowerCase().includes(q2))
    : S.courses;
  document.getElementById('course-list').innerHTML = visible.map(c => `
    <div class="course-item ${S.selected === c.code ? 'selected' : ''}"
         onclick="pickCourse('${esc(c.code)}')">
      <span class="course-code">${esc(c.code)}</span>
      <span class="course-title">${esc(c.title)}</span>
      ${c.semester ? `<span class="sem-badge">Sem ${c.semester}</span>` : ''}
      ${detectLabCourse(c.code, c.title, c.has_lab) ? `<span class="sem-badge" style="background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.35);">${svgIcon('microscope')} Lab</span>` : ''}
    </div>`).join('');
}

document.getElementById('course-search').addEventListener('input', function() { renderCourses(this.value); });

function pickCourse(code) {
  S.selected = code;
  renderCourses(document.getElementById('course-search').value);
  document.getElementById('btn-course-next').disabled = false;
}

/* Mirror of is_lab_course() from generate_qbank.py */
function detectLabCourse(code, title, hasLab) {
  if (hasLab) return true;
  const titleRe = /\b(lab(oratory)?|practicals?|workshops?)\b/i;
  const codeRe  = /(LAB|PRAC|PRACT)(\d|$)|[A-Z]\d*L$/i;
  return titleRe.test(title) || codeRe.test(code);
}

function courseNext() {
  if (!S.selected) return;
}

/* ── SSE timeout guard ───────────────────────────────────────────────────── */
// Wraps an EventSource so that if no message arrives within `ms` milliseconds
// the stream is closed and `onTimeout()` is called.  Returns a cleanup fn.
function _addSSETimeout(es, ms, onTimeout) {
  let timer = setTimeout(() => { es.close(); onTimeout(); }, ms);
  es.addEventListener('message', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { es.close(); onTimeout(); }, ms);
  });
  return () => clearTimeout(timer);
}

  const t = d.totals;

    ].map(s => `<div class="qb-stat"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');

/* ── MODE 3: Configure Paper ─────────────────────────────────────────────── */
function pickPtype(ptype) {
  S.paperPtype = ptype;
  document.querySelectorAll('[data-ptype]').forEach(el =>
    el.classList.toggle('selected', el.dataset.ptype === ptype));

  // Set sensible defaults
  const defaults = {
    assign:    { title: 'Assignment 1',                   duration: '',           marks: '' },
    quiz:      { title: 'Quiz 1',                         duration: '20 minutes', marks: '' },
    internal:  { title: 'Internal Assessment Test — I',   duration: '1.5 Hours',  marks: '30' },
    final:     { title: 'Semester End Examination',       duration: '3 Hours',    marks: '100' },
    practical: { title: 'Practical Examination',          duration: '3 Hours',    marks: '30' },
    viva:      { title: 'Viva Voce Examination',          duration: '30 Minutes', marks: '10' },
  }[ptype];
  document.getElementById('paper-title').value    = defaults.title;
  document.getElementById('paper-duration').value = defaults.duration;
  document.getElementById('paper-marks').value    = defaults.marks;

  // Quiz-specific marks-per-question input
  document.getElementById('quiz-marks-row').style.display = ptype === 'quiz' ? '' : 'none';

  // Parts config for internal / final
  const partsSection = document.getElementById('parts-section');
  if (ptype === 'internal' || ptype === 'final') {
    partsSection.classList.remove('hidden');
    renderPartsConfig();
  } else {
    partsSection.classList.add('hidden');
  }

  // Assign / Quiz / Lab picker section
  const aqSection = document.getElementById('assign-quiz-picker-section');
  const labType = ptype === 'practical' || ptype === 'viva';
  if (ptype === 'assign' || ptype === 'quiz' || labType) {
    aqSection.classList.remove('hidden');
    const hdg = {
      assign: 'Assignment questions', quiz: 'Quiz questions',
      practical: 'Select experiments to include', viva: 'Select experiments for viva',
    }[ptype] || 'Pick questions';
    document.getElementById('assign-quiz-picker-heading').textContent = hdg;
    if (labType) {
      renderLabTemplates(ptype);
    } else {
      document.getElementById('lab-tpl-section').classList.add('hidden');
    }
    S.assignSelection = null;

async function applyLabTemplate(templateId) {
  if (!S.qbData) return;

  document.querySelectorAll('.lab-tpl-card').forEach(el =>
    el.classList.toggle('selected', el.dataset.tpl === templateId));

  if (!S.qListCache) {
    try {
      const r = await fetch('/get_question_list');
      if (!r.ok) throw new Error('Failed');
      S.qListCache = await r.json();
    } catch(e) {
      showToast('Could not load experiments.', 'error');
      return;
    }
  }

  const exps = S.qListCache.experiments || [];
  if (!exps.length) return;

  let sel;
  switch (templateId) {
    case 'lab-all':
      sel = exps.map(e => e.idx);
      break;

    case 'lab-per-unit': {
      const seen = new Set();
      sel = [];
      for (const e of exps) if (!seen.has(e.unit)) { seen.add(e.unit); sel.push(e.idx); }
      break;
    }

    case 'lab-spot-5':
      sel = exps.slice(0, 5).map(e => e.idx);
      break;

    case 'viva-all':
      sel = exps.filter(e => e.has_viva).map(e => e.idx);
      if (!sel.length) sel = exps.map(e => e.idx);
      break;

    case 'viva-per-unit': {
      const seen = new Set();
      sel = [];
      for (const e of exps) if (!seen.has(e.unit) && e.has_viva) { seen.add(e.unit); sel.push(e.idx); }
      if (!sel.length) {
        const seen2 = new Set();
        for (const e of exps) if (!seen2.has(e.unit)) { seen2.add(e.unit); sel.push(e.idx); }
      }
      break;
    }

    case 'viva-quick': {
      const withViva = exps.filter(e => e.has_viva);
      sel = (withViva.length ? withViva : exps).slice(0, 4).map(e => e.idx);
      break;
    }

    default:
      sel = exps.map(e => e.idx);
  }

  S.labSelection = sel;

  // Refresh picker if already open; always update the count badge
  const panel = document.getElementById('aq-picker-panel');
  if (!panel.classList.contains('hidden')) renderAssignQuizPicker();
  updateAQPickerSelCount();
}

function _buildSlotsForTemplate(tplId) {
  const allQs = [
    ...(S.qListCache['10'] || []),
    ...(S.qListCache['5']  || []),
    ...(S.qListCache['2']  || []),
  ];
  const units = [...new Set(allQs.map(q => q.unit))].sort((a, b) => {
    const na = parseInt(a.replace(/\D+/g, ''), 10);
    const nb = parseInt(b.replace(/\D+/g, ''), 10);
    return (!isNaN(na) && !isNaN(nb)) ? na - nb : a.localeCompare(b);
  });

  const CONFIGS = {
    'be-standard': { parts: [{sub:'a',marks:10},{sub:'b',marks:10}],                                  withOr: true  },
    'pg-mixed':    { parts: [{sub:'a',marks:10},{sub:'b',marks:5},{sub:'c',marks:5}],                  withOr: false },
    'pg-short':    { parts: [{sub:'a',marks:5},{sub:'b',marks:5},{sub:'c',marks:5},{sub:'d',marks:5}], withOr: false },
  };
  const cfg = CONFIGS[tplId];
  if (!cfg) return [];

  const slots = [];
  let qnum = 1;
  for (const unit of units) {
    for (const part of cfg.parts)
      slots.push({ unit, qnum, sub: part.sub, marks: part.marks, is_or: false, picked: null });
    if (cfg.withOr) {
      slots.push({ unit, qnum: '', sub: '', marks: 0, is_or: true, picked: null });
      qnum++;
      for (const part of cfg.parts)
        slots.push({ unit, qnum, sub: part.sub, marks: part.marks, is_or: false, picked: null });
    }
    qnum++;
  }
  return slots;
}

function _renderPartSlotGrid() {
  const area   = document.getElementById('parts-slot-area');
  const slots  = S.partSlots;
  if (!slots || !slots.length) {
    area.innerHTML = '<div style="font-size:.8rem;color:var(--muted);padding:8px;">No units found in question bank.</div>';
    return;
  }
  const total   = slots.filter(s => !s.is_or).length;
  const npicked = slots.filter(s => !s.is_or && s.picked).length;

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px;">
      <span style="font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Question Slots</span>
      <span id="part-slot-summary" style="font-size:.72rem;color:var(--muted);">${total} slots — ${npicked} picked, ${total-npicked} auto</span>
    </div>
    <p style="font-size:.75rem;color:var(--muted);margin-bottom:8px;">Click <strong>Pick</strong> to assign a specific question, or leave blank to auto-select.</p>
    <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">`;

  let currentUnit = null;
  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    if (slot.is_or) { html += `<div class="tpl-or-row">— OR —</div>`; continue; }
    if (slot.unit !== currentUnit) {
      html += `<div class="tpl-unit-hdr">${esc(slot.unit)}</div>`;
      currentUnit = slot.unit;
    }
    const p = slot.picked;
    html += `
      <div class="tpl-slot-row" id="part-slot-row-${i}">
        <div class="tpl-slot-cell tpl-slot-qnum">
          <span>${slot.qnum}</span>
          <span style="font-size:.65rem;font-weight:400;">${slot.sub})</span>
          <span style="font-size:.65rem;color:var(--muted);">${slot.marks}M</span>
        </div>
        <div class="tpl-slot-cell tpl-slot-text" style="grid-column:2/4;">
          ${p
            ? `<span class="tpl-slot-repl">&#10003; ${esc(p.text.slice(0,120))}${p.text.length>120?'&#8230;':''}</span>
               <span style="font-size:.65rem;color:var(--muted);">${esc(p.unit||'')}${p.co?' · '+esc(p.co):''}</span>`
            : `<span class="tpl-slot-orig">Auto-selected from question bank</span>`
          }
        </div>
        <div class="tpl-slot-cell tpl-slot-action">
          <button class="tpl-pick-btn" onclick="openPartSlotPicker(${i})">${p ? '&#8634; Change' : 'Pick &#9660;'}</button>
          ${p ? `<button class="tpl-clear-btn" onclick="clearPartSlot(${i})">&#10005; Clear</button>` : ''}
        </div>
      </div>
      <div class="tpl-picker-panel hidden" id="part-picker-${i}"></div>`;
  }
  html += '</div>';
  area.innerHTML = html;
}

async function openPartSlotPicker(idx) {
  if (S.partSlotOpenPicker !== -1 && S.partSlotOpenPicker !== idx)
    document.getElementById(`part-picker-${S.partSlotOpenPicker}`)?.classList.add('hidden');
  const panel = document.getElementById(`part-picker-${idx}`);
  if (!panel) return;
  if (S.partSlotOpenPicker === idx) {
    panel.classList.add('hidden'); S.partSlotOpenPicker = -1; return;
  }
  S.partSlotOpenPicker = idx;
  panel.classList.remove('hidden');

  const slot  = S.partSlots[idx];
  const tiers = [2, 5, 10];
  const tier  = tiers.reduce((p, c) => Math.abs(c-slot.marks) < Math.abs(p-slot.marks) ? c : p);
  const qs    = (S.qListCache||{})[String(tier)] || [];
  const used  = new Set((S.partSlots||[]).filter((s,i) => i!==idx && s.picked && s.picked.qb_tier===tier).map(s=>s.picked.qb_idx));
  const avail = qs.filter(q => !used.has(q.idx));

  if (!avail.length) {
    panel.innerHTML = `<div style="padding:8px;font-size:.75rem;color:var(--muted);">No ${tier}-mark questions available.</div>`;
    return;
  }
  panel.innerHTML = avail.map(q => `
    <div class="tpl-picker-item" onclick="pickPartSlotQ(${idx},${q.idx},${tier})">
      <span class="qm">${esc(q.unit)}${q.co?' · '+esc(q.co):''}</span>
      ${esc(q.preview)}${q.more?'&#8230;':''}
    </div>`).join('');
}

function pickPartSlotQ(slotIdx, qbIdx, tier) {
  const q = ((S.qListCache||{})[String(tier)]||[]).find(q => q.idx===qbIdx);
  if (!q) return;
  S.partSlots[slotIdx].picked = { text: q.preview+(q.more?'…':''), co: q.co, unit: q.unit, qb_idx: qbIdx, qb_tier: tier };
  document.getElementById(`part-picker-${slotIdx}`)?.classList.add('hidden');
  S.partSlotOpenPicker = -1;
  _renderPartSlotGrid();
}

function clearPartSlot(slotIdx) {
  if (S.partSlots) S.partSlots[slotIdx].picked = null;
  _renderPartSlotGrid();
}

async function toggleQPicker(marks) {
  const panel = document.getElementById(`picker-panel-${marks}`);
  const icon  = document.getElementById(`picker-icon-${marks}`);
  const isOpen = !panel.classList.contains('hidden');
  if (isOpen) {
    panel.classList.add('hidden');
    icon.textContent = '▶';
    return;
  }
  panel.classList.remove('hidden');
  icon.textContent = '▼';
  if (!S.qListCache) {
    document.getElementById(`picker-list-${marks}`).textContent = 'Loading…';
    try {
      const r = await fetch('/get_question_list');
      if (!r.ok) throw new Error('Failed');
      S.qListCache = await r.json();
    } catch(e) {
      document.getElementById(`picker-list-${marks}`).textContent = 'Could not load questions.';
      return;
    }
  }
  renderQPicker(marks);
}

function renderQPicker(marks) {
  const qs  = (S.qListCache || {})[String(marks)] || [];
  if (!qs.length) {
    document.getElementById(`picker-list-${marks}`).textContent = 'No questions available.';
    return;
  }
  const sel = S.partSelections[marks];
  const n   = +(document.getElementById(`part-n-${marks}`)?.value || 0);
  const checked = sel ? new Set(sel) : new Set(qs.slice(0, n).map(q => q.idx));
  if (!sel) S.partSelections[marks] = Array.from(checked);

  document.getElementById(`picker-list-${marks}`).innerHTML = qs.map(q => `
    <div class="picker-item">
      <input type="checkbox" id="pq-${marks}-${q.idx}" ${checked.has(q.idx) ? 'checked' : ''}
             onchange="onPickerCheck(${marks})">
      <label for="pq-${marks}-${q.idx}">
        <span class="q-meta">${esc(q.unit)}${q.co ? ' · ' + q.co : ''}</span>
        ${esc(q.preview)}${q.more ? '…' : ''}
      </label>
    </div>`).join('');
  updatePickerSelCount(marks);
}

function onPickerCheck(marks) {
  const qs = (S.qListCache || {})[String(marks)] || [];
  const checked = qs.map(q => q.idx).filter(idx => {
    const el = document.getElementById(`pq-${marks}-${idx}`);
    return el && el.checked;
  });
  S.partSelections[marks] = checked.length > 0 ? checked : null;
  const nEl = document.getElementById(`part-n-${marks}`);
  if (nEl) nEl.value = checked.length > 0 ? checked.length : nEl.value;
  updatePickerSelCount(marks);
}

function onPartCountChange(marks) {
  // If picker is open, reset selection and re-render with first N checked
  const panel = document.getElementById(`picker-panel-${marks}`);
  if (panel && !panel.classList.contains('hidden') && S.qListCache) {
    S.partSelections[marks] = null;
    renderQPicker(marks);
  }
}

function updatePickerSelCount(marks) {
  const el  = document.getElementById(`picker-count-${marks}`);
  if (!el) return;
  const sel = S.partSelections[marks];
  el.textContent = (sel && sel.length > 0) ? `${sel.length} selected` : '';
}

function renderAssignQuizPicker() {
  const section = S.paperPtype;
  const isLab   = section === 'practical' || section === 'viva';
  const qs = isLab
    ? ((S.qListCache || {}).experiments || [])
    : ((S.qListCache || {})[section] || []);

    document.getElementById('aq-picker-list').textContent = isLab ? 'No experiments available.' : 'No questions available.';
    return;
  }
  const sel = isLab ? S.labSelection : (section === 'assign' ? S.assignSelection : S.quizSelection);
  const checked = sel ? new Set(sel) : new Set(qs.map(q => q.idx));
  if (!sel) {
    if (isLab)                     S.labSelection    = Array.from(checked);
    else if (section === 'assign') S.assignSelection = Array.from(checked);
    else                           S.quizSelection   = Array.from(checked);
  }
  document.getElementById('aq-picker-list').innerHTML = qs.map(q => `
    <div class="picker-item">
      <input type="checkbox" id="aq-pq-${q.idx}" ${checked.has(q.idx) ? 'checked' : ''}
             onchange="onAQPickerCheck()">
      <label for="aq-pq-${q.idx}">
        <span class="q-meta">${esc(q.unit)}${q.co ? ' · ' + q.co : ''}</span>
        ${esc(q.preview)}${q.more ? '…' : ''}
      </label>
    </div>`).join('');
  updateAQPickerSelCount();
}

function onAQPickerCheck() {
  const section = S.paperPtype;
  const isLab   = section === 'practical' || section === 'viva';
  const qs = isLab
    ? ((S.qListCache || {}).experiments || [])
    : ((S.qListCache || {})[section] || []);
  const checked = qs.map(q => q.idx).filter(idx => {
    const el = document.getElementById(`aq-pq-${idx}`);
    return el && el.checked;
  });
  const selection = checked.length > 0 ? checked : null;
  if (isLab)                     S.labSelection    = selection;
  else if (section === 'assign') S.assignSelection = selection;
  else                           S.quizSelection   = selection;
  updateAQPickerSelCount();
}

function updateAQPickerSelCount() {
  const el  = document.getElementById('aq-picker-count');
  if (!el) return;
  const isLab = S.paperPtype === 'practical' || S.paperPtype === 'viva';
  const sel   = isLab ? S.labSelection : (S.paperPtype === 'assign' ? S.assignSelection : S.quizSelection);
  const total = isLab
    ? ((S.qListCache || {}).experiments || []).length
    : ((S.qListCache || {})[S.paperPtype] || []).length;
  if (sel && sel.length > 0 && sel.length < total) {
    el.textContent = `${sel.length} of ${total} selected`;
  } else {
    el.textContent = '';
  }
}

function pickPaperFmt(fmt) {
  S.paperFmt = fmt;

    el.classList.toggle('selected', el.dataset.paperfmt === fmt));

async function _docxBlobToHtml(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const result = await mammoth.convertToHtml({ arrayBuffer });
  return result.value || '<p>(Empty document)</p>';
}

function _buildPaperBody() {
  const body = {
    ptype:     S.paperPtype,
    fmt:       S.paperFmt,
    show_co:   document.getElementById('show-co-toggle').checked,
    title:     document.getElementById('paper-title').value.trim(),
    date:      document.getElementById('paper-date').value.trim(),
    duration:  document.getElementById('paper-duration').value.trim(),
    max_marks: document.getElementById('paper-marks').value.trim(),
  };
  if (S.paperPtype === 'quiz') {
    body.marks_each = +document.getElementById('quiz-marks-each').value || 1;
    if (S.quizSelection && S.quizSelection.length > 0) body.selected_indices = S.quizSelection;
  }
  if (S.paperPtype === 'assign') {
    if (S.assignSelection && S.assignSelection.length > 0) body.selected_indices = S.assignSelection;
  }
  if (S.paperPtype === 'practical' || S.paperPtype === 'viva') {
    if (S.labSelection && S.labSelection.length > 0) body.selected_indices = S.labSelection;
  }
  if (S.paperPtype === 'internal' || S.paperPtype === 'final') {
    body.parts = {};
    if (S.partSlots && S.partSlots.length) {
      // Slot-based mode (preset templates)
      const byTier = {};
      for (const slot of S.partSlots) {
        if (slot.is_or) continue;
        const tier = slot.marks;
        if (!byTier[tier]) byTier[tier] = { n: 0, indices: [] };
        byTier[tier].n++;
        if (slot.picked) byTier[tier].indices.push(slot.picked.qb_idx);
      }
      const PART_LABELS = { 2: 'PART A', 5: 'PART B', 10: 'PART C' };
      for (const [tier, data] of Object.entries(byTier)) {
        const cfg = { n: data.n, answer_any: data.n, label: PART_LABELS[+tier] || 'PART' };
        if (data.indices.length) cfg.selected_indices = data.indices;
        body.parts[+tier] = cfg;
      }
    } else {
      // Count-based mode (custom template)
      for (const marks of [2, 5, 10]) {
        const nEl   = document.getElementById(`part-n-${marks}`);
        const anyEl = document.getElementById(`part-any-${marks}`);
        const lblEl = document.getElementById(`part-lbl-${marks}`);
        if (!nEl) continue;
        const n = +nEl.value || 0;
        if (n <= 0) continue;
        const partCfg = {
          n,
          answer_any: +anyEl.value || n,
          label:      lblEl.value.trim() || `PART ${['A','B','C'][[2,5,10].indexOf(marks)]}`,
        };
        const sel = S.partSelections[marks];
        if (sel && sel.length > 0) partCfg.selected_indices = sel;
        body.parts[marks] = partCfg;
      }
    }
  }
  return body;
}

function generatePaper() {
  const btn    = document.getElementById('btn-gen-paper');
  const errDiv = document.getElementById('paper-err');
  errDiv.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  _startFakeProgress('gen-paper-progress', 8000, ['Composing paper…', 'Selecting questions…', 'Formatting…', 'Almost ready…']);

  const body = _buildPaperBody();
  body.fmt = 'docx'; // always fetch docx for mammoth preview

  const labelMap = { assign: 'Assignment', quiz: 'Quiz', internal: 'Internal', final: 'Final', practical: 'Practical', viva: 'Viva' };
  S.paperPreviewLabel    = labelMap[S.paperPtype] || 'Paper';
  S.paperPreviewFilename = (document.getElementById('paper-title').value.trim() || S.paperPtype).replace(/\s+/g, '_');
  S.paperPreviewOrigin   = 'configure-paper';

  fetch('/export_qpaper', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(body),
  })
  .then(r => {
    if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Generation failed'); });
    return r.blob();
  })
  .then(blob => _docxBlobToHtml(blob))
  .then(html => {
    document.getElementById('paper-preview-div').innerHTML = html;
    pickPreviewFmt(S.paperFmt);
    _resetAiPanel(); _initAiAgent();
    saveHistory('qpaper');
    _stopFakeProgress('gen-paper-progress', () => {
      btn.disabled = false; btn.textContent = 'Preview Paper →';
      showSection('paper-preview'); setStepBar(4);
    });
  })
  .catch(e => {
    _stopFakeProgress('gen-paper-progress');
    showErr('paper-err', e.message);
    btn.disabled = false; btn.textContent = 'Preview Paper →';
  });
}

function pickPreviewFmt(fmt) {

function downloadEditedPaper() {
  const btn    = document.getElementById('btn-dl-edited-paper');
  const errDiv = document.getElementById('paper-preview-err');
  errDiv.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Downloading…';
  _startFakeProgress('dl-paper-progress', 5000, ['Generating document…', 'Formatting…', 'Almost ready…']);

  const div    = document.getElementById('paper-preview-div');
  const fmt    = S.paperPreviewFmt;
  const label  = S.paperPreviewLabel    || 'Paper';
  const fname  = S.paperPreviewFilename || 'paper';

  // TXT: plain text is fine; DOCX/PDF: send HTML so tables are preserved
  const url     = fmt === 'txt' ? '/download_paper_from_text' : '/download_paper_from_html';
  const payload = fmt === 'txt'
    ? { text: div.innerText, fmt, label, filename: fname }
    : { html: div.innerHTML, fmt, label, filename: fname };

  fetch(url, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload),
  })
  .then(r => {
    if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Download failed'); });
    return r.blob();
  })
  .then(blob => {
    const objUrl = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href = objUrl; a.download = `${fname}_${label}.${fmt}`; a.click();
    URL.revokeObjectURL(objUrl);
  })
  .catch(e => showErr('paper-preview-err', e.message))
  .finally(() => {
    _stopFakeProgress('dl-paper-progress');
    btn.disabled = false; btn.textContent = '⬇ Download Paper';
  });
}

/* ── Fake progress helpers ───────────────────────────────────────────────── */
const _fakeProgressTimers = {};

function _startFakeProgress(id, estimatedMs, labels) {
  const el   = document.getElementById(id);
  if (!el) return;
  el.classList.remove('hidden');
  const fill = el.querySelector('.uni-progress-fill');
  const lbl  = el.querySelector('.uni-progress-label');
  if (!fill) return;
  fill.classList.remove('is-indeterminate', 'is-forward');   // kill CSS animation so JS owns width
  fill.style.position = ''; fill.style.left = '';
  fill.style.transition = 'width .25s ease';
  fill.style.width = '3%';
  const steps    = Array.isArray(labels) ? labels : [];
  const start    = Date.now();
  let   stepIdx  = 0;
  if (lbl && steps.length) lbl.textContent = steps[0];
  _fakeProgressTimers[id] = setInterval(() => {
    const t   = (Date.now() - start) / estimatedMs;
    const pct = Math.min(88, 88 * (1 - Math.pow(Math.max(0, 1 - t), 2.2)));
    fill.style.width = pct + '%';
    if (lbl && steps.length) {
      const idx = Math.min(steps.length - 1, Math.floor(t * steps.length));
      if (idx !== stepIdx) { stepIdx = idx; lbl.textContent = steps[idx]; }
    }
    if (pct >= 88) clearInterval(_fakeProgressTimers[id]);
  }, 80);
}

// then: optional callback invoked after the bar reaches 100 % and hides.
// Pass it for success paths that navigate away — omit for error paths.
function _stopFakeProgress(id, then) {
  clearInterval(_fakeProgressTimers[id]);
  delete _fakeProgressTimers[id];
  const el = document.getElementById(id);
  if (!el) { if (then) then(); return; }
  const fill = el.querySelector('.uni-progress-fill');
  const lbl  = el.querySelector('.uni-progress-label');
  if (fill) {
    fill.classList.remove('is-forward', 'is-indeterminate');  // ensure CSS animation is gone
    fill.style.transition = 'width .25s ease';
    fill.style.width = '100%';
  }
  if (lbl)  lbl.textContent = 'Done!';
  setTimeout(() => {
    el.classList.add('hidden');
    if (fill) { fill.style.width = '0%'; fill.style.transition = ''; }
    if (then) then();
  }, 650);
}

/* ── XHR upload with real byte progress + timed processing phase ─────────── */
function _xhrUpload(url, formData, opts) {
  const { progressId, uploadLabel, processMs, processLabels, onSuccess, onError } = opts;
  const el   = document.getElementById(progressId);
  const fill = el && el.querySelector('.uni-progress-fill');
  const lbl  = el && el.querySelector('.uni-progress-label');
  // Tag this invocation so a stale _finish() from a superseded call (e.g. the
  // first /upload that hands off to /upload_ai_extract on ai_fallback) can't
  // hide the loader that a newer call has just re-shown.
  const token  = (el ? (el._uploadToken = (el._uploadToken || 0) + 1) : 0);
  // resume: continue the bar where the previous stage left it (handoff) instead
  // of snapping back to 0% — keeps the loader holding near 90% and climbing.
  const resume = !!opts.resume;
  if (el)   { el.classList.remove('hidden'); }
  if (fill) { fill.classList.remove('is-indeterminate', 'is-forward'); fill.style.position = ''; fill.style.left = ''; fill.style.transition = 'width .2s ease'; if (!resume) fill.style.width = '0%'; }
  if (lbl)  { lbl.textContent = uploadLabel || 'Uploading…'; }

  let processTimer = null;

  const xhr = new XMLHttpRequest();

  // Phase 1 — real upload bytes (0 → 50%)
  xhr.upload.onprogress = e => {
    if (resume || !fill || !e.lengthComputable) return;
    const pct = (e.loaded / e.total) * 50;
    fill.style.width = pct + '%';
    if (lbl) lbl.textContent = `${uploadLabel || 'Uploading…'} (${Math.round(e.loaded / e.total * 100)}%)`;
  };

  // Phase 2 — timed server processing (50 → 90%)
  xhr.upload.onload = () => {
    // Phase-2 climbs from `base` toward ~90%. On a resume handoff we carry over
    // the width the previous stage left, so the bar keeps rising smoothly
    // instead of snapping back to 50%.
    const base = resume ? (parseFloat(fill && fill.style.width) || 50) : 50;
    const span = Math.max(0, 90 - base);
    if (!resume && fill) fill.style.width = '50%';
    const steps = processLabels || [];
    if (lbl && steps.length) lbl.textContent = steps[0];
    const start = Date.now();
    let stepIdx = 0;
    processTimer = setInterval(() => {
      const t   = (Date.now() - start) / processMs;
      const pct = base + Math.min(span, span * (1 - Math.pow(Math.max(0, 1 - t), 2.2)));
      if (fill) fill.style.width = pct + '%';
      if (lbl && steps.length) {
        const idx = Math.min(steps.length - 1, Math.floor(t * steps.length));
        if (idx !== stepIdx) { stepIdx = idx; lbl.textContent = steps[idx]; }
      }
      if (pct >= 90) clearInterval(processTimer);
    }, 80);
  };

  const _finish = (cb) => {
    clearInterval(processTimer);
    if (fill) { fill.style.transition = 'width .25s ease'; fill.style.width = '100%'; }
    if (lbl)  lbl.textContent = 'Done!';
    setTimeout(() => {
      // Skip hiding if a newer _xhrUpload (sharing this progress element) has
      // taken over — otherwise we'd blank the loader it just re-displayed.
      if (el && el._uploadToken !== token) { if (cb) cb(); return; }
      if (el)   el.classList.add('hidden');
      if (fill) fill.style.width = '0%';
      if (cb)   cb();
    }, 500);
  };

  xhr.onload = () => {
    clearInterval(processTimer);   // stop this call's fake progress before deciding what's next
    try {
      const data = JSON.parse(xhr.responseText);
      if (xhr.status >= 400 || data.error) {
        // Hand _finish to the caller: a handoff (ai_fallback) leaves the bar
        // running for the next stage, while genuine errors still clean up.
        if (opts.onErrorRaw) opts.onErrorRaw(data, _finish);
        else { _finish(); onError(data.error || 'Server error'); }
      } else _finish(() => onSuccess(data, xhr.status));
    } catch(e) { _finish(); onError('Invalid server response'); }
  };
  xhr.onerror = () => { _finish(); onError('Network error. Please try again.'); };

  xhr.open('POST', url);
  xhr.send(formData);
}

// Wire up template upload zone
(function() {
  const zone  = document.getElementById('tpl-zone');
  const input = document.getElementById('tpl-file-input');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleTplFile(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => { if (input.files[0]) handleTplFile(input.files[0]); });
})();

function handleTplFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['pdf','docx','doc'].includes(ext)) {
    showErr('tpl-upload-err', `Unsupported type ".${ext}". Use PDF or DOCX.`); return;
  }
  document.getElementById('tpl-upload-err').classList.add('hidden');
  document.getElementById('tpl-zone').style.pointerEvents = 'none';
  const fd = new FormData();
  fd.append('file', file);
  _xhrUpload('/upload_template_paper', fd, {
    progressId: 'tpl-upload-loading', uploadLabel: 'Uploading template…',
    processMs: 5000, processLabels: ['Parsing template…', 'Detecting question slots…', 'Almost done…'],
    onSuccess: (d, status) => {
      document.getElementById('tpl-zone').style.pointerEvents = '';
      if (status >= 400) { showErr('tpl-upload-err', d.error || 'Parse failed'); return; }
      populateTplHeader(d.header);
      S.templateSlots = d.slots.map(s => ({ ...s, replacement: null }));
      renderTplSlotGrid(); renderProfileBadge(d.profile_id, d.confidence);
      document.getElementById('tpl-phase-upload').classList.add('hidden');
      document.getElementById('tpl-phase-slots').classList.remove('hidden');
    },
    onError: m => { document.getElementById('tpl-zone').style.pointerEvents = ''; showErr('tpl-upload-err', m || 'Upload failed. Please try again.'); },
  });
}

function populateTplHeader(h) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  set('tpl-college',    h.college);
  set('tpl-subtitle',   h.sub_title);
  set('tpl-examname',   h.exam_name);
  set('tpl-programme',  h.programme);
  set('tpl-branch',     h.branch);
  set('tpl-semester',   h.semester);
  set('tpl-coursecode', h.course_code);
  set('tpl-course',     h.course);
  set('tpl-duration',   h.duration);
  set('tpl-maxmarks',   h.max_marks);
}

function renderTplSlotGrid() {
  const slots = S.templateSlots;
  updateTplSummary();

  let html = '';
  let currentUnit = null;

  for (let i = 0; i < slots.length; i++) {
    const slot = slots[i];
    if (slot.is_or) {
      html += `<div class="tpl-or-row">— OR —</div>`;
      continue;
    }
    if (slot.unit !== currentUnit) {
      html += `<div class="tpl-unit-hdr">${esc(slot.unit)}</div>`;
      currentUnit = slot.unit;
    }
    const repl = slot.replacement;
    html += `
      <div class="tpl-slot-row" id="tpl-row-${i}">
        <div class="tpl-slot-cell tpl-slot-qnum">
          <span>${esc(slot.qnum)}</span>
          <span style="font-size:.65rem;font-weight:400;">${esc(slot.sub)}</span>
          <span style="font-size:.65rem;color:var(--muted);">${slot.marks}M</span>
        </div>
        <div class="tpl-slot-cell tpl-slot-text" style="grid-column:2/4;">
          ${repl
            ? `<span class="tpl-slot-repl">✓ ${esc(repl.text.slice(0,120))}${repl.text.length>120?'…':''}</span>
               <span style="font-size:.65rem;color:#1a6632;">${esc(repl.co||'')}</span>`
            : `<span class="tpl-slot-orig">${esc(slot.original_text.slice(0,120))}${slot.original_text.length>120?'…':''}</span>`
          }
        </div>
        <div class="tpl-slot-cell tpl-slot-action">
          <button class="tpl-pick-btn" onclick="openTplPicker(${i})">${repl ? '↺ Change' : 'Pick ▾'}</button>
          ${repl ? `<button class="tpl-clear-btn" onclick="clearTplSlot(${i})">✕ Clear</button>` : ''}
        </div>
      </div>
      <div class="tpl-picker-panel hidden" id="tpl-picker-${i}"></div>`;
  }
  document.getElementById('tpl-slot-grid').innerHTML = html;
}

async function openTplPicker(idx) {
  // Close previously open picker
  if (S.tplOpenPicker !== -1 && S.tplOpenPicker !== idx) {
    document.getElementById(`tpl-picker-${S.tplOpenPicker}`)?.classList.add('hidden');
  }
  const panel = document.getElementById(`tpl-picker-${idx}`);
  if (!panel) return;

  if (S.tplOpenPicker === idx) {
    panel.classList.add('hidden');
    S.tplOpenPicker = -1;
    return;
  }

  S.tplOpenPicker = idx;
  panel.classList.remove('hidden');

  if (!S.qListCache) {
    panel.innerHTML = '<div style="padding:8px;font-size:.75rem;color:var(--muted)">Loading…</div>';
    try {
      const r = await fetch('/get_question_list');
      S.qListCache = await r.json();
    } catch(e) {
      panel.innerHTML = '<div style="padding:8px;font-size:.75rem;color:red">Failed to load QB questions.</div>';
      return;
    }
  }

  const slot  = S.templateSlots[idx];
  const marks = slot.marks;
  // Find closest available marks tier: exact match first, then adjacent
  const tiers = [2, 5, 10];
  const tier  = tiers.reduce((prev, curr) =>
    Math.abs(curr - marks) < Math.abs(prev - marks) ? curr : prev
  );
  const qs = (S.qListCache[String(tier)] || []);

  if (!qs.length) {
    panel.innerHTML = `<div style="padding:8px;font-size:.75rem;color:var(--muted)">No ${tier}-mark questions in the question bank.</div>`;
    return;
  }

  // Exclude questions already picked in other slots at the same tier
  const usedIdxs = new Set(
    S.templateSlots
      .filter((s, i) => i !== idx && s.replacement && s.replacement.qb_tier === tier)
      .map(s => s.replacement.qb_idx)
  );
  const availableQs = qs.filter(q => !usedIdxs.has(q.idx));

  if (!availableQs.length) {
    panel.innerHTML = `<div style="padding:8px;font-size:.75rem;color:var(--muted)">No ${tier}-mark questions available — all have been picked by other slots.</div>`;
    return;
  }

  panel.innerHTML = `
    <div style="font-size:.7rem;color:var(--muted);margin-bottom:6px;padding:0 4px;">
      Showing ${tier}-mark QB questions (template slot is ${marks} marks).
      Click a question to select it.
    </div>` +
    availableQs.map(q => `
      <div class="tpl-picker-item" onclick="selectTplReplacement(${idx}, ${q.idx}, ${tier})">
        <span class="qm">${esc(q.unit)}${q.co ? ' · ' + q.co : ''}</span>
        ${esc(q.preview)}${q.more ? '…' : ''}
      </div>`).join('');
}

async function selectTplReplacement(slotIdx, qbIdx, tier) {
  // Fetch the full question text if needed
  if (!S.qListCache) return;
  const qMeta = (S.qListCache[String(tier)] || []).find(q => q.idx === qbIdx);
  if (!qMeta) return;

  S.templateSlots[slotIdx].replacement = {
    text: qMeta.text || qMeta.preview,
    co:   qMeta.co || '',
    qb_tier: tier,
    qb_idx:  qbIdx,
  };

  // Close picker
  document.getElementById(`tpl-picker-${slotIdx}`)?.classList.add('hidden');
  S.tplOpenPicker = -1;

  // Re-render just that row
  renderTplSlotGrid();
}

function clearTplSlot(idx) {
  S.templateSlots[idx].replacement = null;
  if (S.tplOpenPicker === idx) {
    document.getElementById(`tpl-picker-${idx}`)?.classList.add('hidden');
    S.tplOpenPicker = -1;
  }
  renderTplSlotGrid();
}

/* ── Toast notification system ──────────────────────────────────────────── */
function showToast(msg, type = 'info', duration = 4000) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span class="toast-body">${esc(msg)}</span><button class="toast-close-btn" onclick="dismissToast(this.parentElement)" aria-label="Close">&times;</button>`;
  container.appendChild(t);
  if (duration > 0) setTimeout(() => dismissToast(t), duration);
  return t;
}
function dismissToast(el) {
  if (!el || el.classList.contains('toast-out')) return;
  el.classList.add('toast-out');
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

  btn.textContent = 'Generating…';

  const slots = S.templateSlots.map(slot => {
    if (slot.is_or) return { is_or: true };
    const r = slot.replacement;
    return {
      is_or:            false,
      unit:             slot.unit,
      qnum:             slot.qnum,
      sub:              slot.sub,
      marks:            slot.marks,
      co:               slot.co,
      po:               slot.po,

  .then(html => {

  });
}

// ── AI Review Agent ───────────────────────────────────────────────────────────
// API is called ONLY when the user explicitly clicks "Analyse Question".
// Clicking inside the preview just caches the detected question cheaply.
let _aiPanelOpen    = true;
let _aiCachedQ      = null;   // question data cached from last click in preview
let _aiCachedNode   = null;   // DOM node of the question cell, for direct apply
let _aiAnalysing    = false;  // guard against double-clicks
let _aiUndoText     = null;   // text before last AI apply (for undo)
let _aiUndoNode     = null;   // DOM node before last AI apply

function _resetAiPanel() {
  _aiCachedQ    = null;
  _aiCachedNode = null;
  _aiAnalysing  = false;
  _aiUndoText   = null;
  _aiUndoNode   = null;
  const statusEl   = document.getElementById('ai-status');
  const listEl     = document.getElementById('ai-suggestions-list');
  const rephraseEl = document.getElementById('ai-rephrase-output');
  const undoBar    = document.getElementById('ai-undo-bar');
  const btn        = document.getElementById('ai-analyse-btn');
  const rBtn       = document.getElementById('ai-rephrase-btn');
  if (statusEl)   statusEl.innerHTML   = 'Click inside a question row, then press a button.';
  if (listEl)     listEl.innerHTML     = '';
  if (rephraseEl) rephraseEl.innerHTML = '';
  if (undoBar)    undoBar.style.display = 'none';
  if (btn)        btn.disabled         = false;
  if (rBtn)       rBtn.disabled        = false;
}

function _initAiAgent() {
  const div = document.getElementById('paper-preview-div');
  if (!div || div._aiInited) return;
  div._aiInited = true;

  // On click: detect + cache the question and its DOM node (no API call).
  div.addEventListener('click', () => {
    const q    = _getActiveQuestion();
    const node = _findQuestionNode();
    if (q) {
      _aiCachedQ    = q;
      _aiCachedNode = node;
      const preview = q.question_text.length > 55
        ? q.question_text.slice(0, 55) + '…'
        : q.question_text;
      _setAiStatus(`Selected: "${preview}"`);
      document.getElementById('ai-suggestions-list').innerHTML = '';
      document.getElementById('ai-rephrase-output').innerHTML  = '';
    }
  });
}

function _findQuestionNode() {
  const sel = window.getSelection();
  if (!sel || !sel.anchorNode) return null;
  let node = sel.anchorNode;
  const previewDiv = document.getElementById('paper-preview-div');
  while (node && node !== previewDiv) {
    if (node.nodeName === 'TR') {
      const cells = Array.from(node.querySelectorAll('td, th'));
      if (cells.length >= 4) return cells[2] || null;
    }
    if (/^(P|H[1-6])$/.test(node.nodeName)) {
      const text = (node.innerText || '').trim();
      if (text.length > 15) return node;
    }
    node = node.parentElement;
  }
  return null;
}

function _getActiveQuestion() {
  const sel = window.getSelection();
  if (!sel || !sel.anchorNode) return null;

  let node = sel.anchorNode;
  const previewDiv = document.getElementById('paper-preview-div');

  while (node && node !== previewDiv) {
    if (node.nodeName === 'TR') {
      const cells = Array.from(node.querySelectorAll('td, th'));
      if (cells.length >= 4) {
        // Template table format: [qnum, sub, question, co, po?, marks]
        const questionText = (cells[2]?.innerText || '').trim();
        const co           = (cells[3]?.innerText || '').trim();
        const marks        = (cells[cells.length - 1]?.innerText || '').trim();
        if (questionText.length > 8) return { question_text: questionText, co, marks };
      } else if (cells.length === 3) {
        return null; // CO coverage table — skip
      }
    }
    if (/^(P|H[1-6])$/.test(node.nodeName)) {
      const text = (node.innerText || '').trim();
      if (text.length > 15) return { question_text: text, co: '', marks: '' };
    }
    node = node.parentElement;
  }
  return null;
}

async function _runAiReview() {
  if (_aiAnalysing) return;

  // Re-detect from selection in case user re-clicked after panel closed
  const q = _aiCachedQ || _getActiveQuestion();
  if (!q || !q.question_text || q.question_text.length < 10) {
    _setAiStatus('Click on a question row first, then press "Analyse".');
    return;
  }

  _aiAnalysing = true;
  const btn = document.getElementById('ai-analyse-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Analysing…'; }
  _setAiStatus('<span class="ai-spin">↻</span> Analysing…');
  document.getElementById('ai-suggestions-list').innerHTML = '';

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 20000);

  try {
    const r = await fetch('/ai_review_edit', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(q),
      signal:  controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();
    if (data.error === 'timeout' || r.status === 504) {
      _setAiStatusWithRetry('Request timed out — check your connection.');
    } else if (data.error === 'connection' || r.status === 503) {
      _setAiStatusWithRetry('Could not reach the server — check your connection.');
    } else if (data.error && !data.suggestions?.length) {
      _setAiStatusWithRetry('Error: ' + data.error);
    } else {
      _setAiStatus('');
      _renderAiSuggestions(data.suggestions || []);
    }
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      _setAiStatusWithRetry('Timed out after 20 s — check your connection.');
    } else {
      _setAiStatusWithRetry('Network error — could not reach the server.');
    }
  } finally {
    _aiAnalysing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Analyse'; }
  }
}

async function _runRephrase() {
  const q = _aiCachedQ || _getActiveQuestion();
  if (!q || !q.question_text || q.question_text.length < 10) {
    _showRephrasedText(null, 'Click on a question row first, then press "Rephrase".');
    return;
  }

  const btn = document.getElementById('ai-rephrase-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Rephrasing…'; }
  document.getElementById('ai-rephrase-output').innerHTML =
    '<div class="ai-status-msg"><span class="ai-spin">↻</span> Rephrasing…</div>';

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 22000);

  try {
    const r = await fetch('/ai_rephrase', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(q),
      signal:  controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();
    if (r.status === 504) {
      _showRephrasedText(null, 'Request timed out — check your connection.');
    } else if (r.status === 503) {
      _showRephrasedText(null, 'Could not reach the server.');
    } else if (data.error) {
      _showRephrasedText(null, 'Error: ' + data.error);
    } else {
      _showRephrasedText(data.rephrased, null);
    }
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') {
      _showRephrasedText(null, 'Timed out — check your connection.');
    } else {
      _showRephrasedText(null, 'Network error — could not reach the server.');
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Rephrase'; }
  }
}

function _showRephrasedText(text, error) {
  const outDiv = document.getElementById('ai-rephrase-output');
  if (!outDiv) return;

  if (error) {
    outDiv.innerHTML = `<div class="ai-status-msg" style="color:#ef4444">${esc(error)}</div>`;
    return;
  }

  if (_aiCachedNode && text) {
    _aiCachedNode.innerText = text;
    if (_aiCachedQ) _aiCachedQ.question_text = text;
    outDiv.innerHTML = '<div class="ai-status-msg" style="color:#15803d">✓ Applied directly to the question.</div>';
    return;
  }

  // Fallback: show selectable text box the user can copy from
  outDiv.innerHTML =
    '<div style="font-size:.75rem;color:#6b7280;margin-bottom:4px;">Rephrased — click to select &amp; copy:</div>' +
    `<textarea class="ai-rephrase-box" rows="4" readonly onclick="this.select()">${esc(text)}</textarea>`;
}

function _setAiStatusWithRetry(msg) {
  const statusEl = document.getElementById('ai-status');
  if (statusEl) {
    statusEl.innerHTML =
      `<span style="color:#ef4444">${msg}</span>` +
      `<br><button class="btn btn-ghost" style="margin-top:6px;font-size:.75rem;padding:3px 10px;"` +
      ` onclick="_runAiReview()">↻ Retry</button>`;
  }
}

function _setAiStatus(html) {
  const el = document.getElementById('ai-status');
  if (el) el.innerHTML = html;
}

function _renderAiSuggestions(suggestions) {
  _setAiStatus('');
  const list = document.getElementById('ai-suggestions-list');
  if (!list) return;

  const LABELS = {
    clarity:      `${svgIcon('pencil')} Clarity`,
    co_alignment: `${svgIcon('target')} CO Alignment`,
    blooms:       `${svgIcon('bar-chart')} Bloom's Taxonomy`,
  };

  if (!suggestions.length) {
    list.innerHTML = '<div class="ai-status-msg">No issues found.</div>';
    return;
  }

  list.innerHTML = suggestions.map((s, i) => {
    const safeType = esc(s.type);
    const safeMsg  = esc(s.message);
    return `<div class="ai-card ${s.level || 'ok'}" data-clickable
                 data-type="${safeType}" data-msg="${safeMsg}"
                 onclick="_applyAiSuggestion(this)">
      <div class="ai-card-label">${LABELS[s.type] || s.type}</div>
      <div class="ai-card-body">${safeMsg}</div>
      <div class="ai-apply-hint">Click to apply this fix</div>
    </div>`;
  }).join('');
}

async function _applyAiSuggestion(cardEl) {
  const type    = cardEl.dataset.type;
  const message = cardEl.dataset.msg;
  const q       = _aiCachedQ;

  if (!q || !q.question_text) {
    _setAiStatus('No question selected — click a question row first.');
    return;
  }

  // Show spinner inside the card
  const hintEl = cardEl.querySelector('.ai-apply-hint');
  hintEl.innerHTML = '<span class="ai-spin" style="margin-right:4px;">↻</span>Applying…';
  cardEl.classList.add('applying');

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 22000);

  try {
    const r = await fetch('/ai_apply_suggestion', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ question_text: q.question_text, co: q.co, marks: q.marks, suggestion_message: message }),
      signal:  controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();

    if (data.error) {
      hintEl.textContent = '✗ ' + data.error;
      return;
    }

    const node = _aiCachedNode;
    if (node) {
      _aiUndoText = q.question_text;
      _aiUndoNode = node;
      node.innerText = data.improved;
      q.question_text = data.improved;
      const undoBar = document.getElementById('ai-undo-bar');
      if (undoBar) undoBar.style.display = 'block';
      hintEl.textContent = '✓ Applied';
    } else {
      const outDiv = document.getElementById('ai-rephrase-output');
      if (outDiv) outDiv.innerHTML =
        '<div style="font-size:.75rem;color:#6b7280;margin-bottom:4px;">Improved (copy manually):</div>' +
        `<textarea class="ai-rephrase-box" rows="4" readonly onclick="this.select()">${esc(data.improved)}</textarea>`;
      hintEl.textContent = '↑ See above';
    }
  } catch (e) {
    clearTimeout(timeoutId);
    hintEl.textContent = e.name === 'AbortError' ? '✗ Timed out' : '✗ Network error';
  } finally {
    cardEl.classList.remove('applying');
  }
}

function _undoAiApply() {
  if (!_aiUndoNode || _aiUndoText === null) return;
  _aiUndoNode.innerText = _aiUndoText;
  if (_aiCachedQ) _aiCachedQ.question_text = _aiUndoText;
  _aiUndoText = null;
  _aiUndoNode = null;
  const undoBar = document.getElementById('ai-undo-bar');
  if (undoBar) undoBar.style.display = 'none';
  // Reset any "✓ Applied" hints on cards
  document.querySelectorAll('#ai-suggestions-list .ai-apply-hint').forEach(el => {
    el.textContent = 'Click to apply this fix';
  });
}

function toggleAiPanel() {
  const panel   = document.getElementById('ai-panel');
  const icon    = document.getElementById('ai-panel-toggle-icon');
  if (!panel) return;
  _aiPanelOpen = !_aiPanelOpen;
  panel.classList.toggle('collapsed', !_aiPanelOpen);
  if (icon) icon.textContent = _aiPanelOpen ? '◀' : '▶';
}

function _hideModuleSubs() {
  ['module1', 'module2', 'module3', 'module4'].forEach(id => {

  });

function showModuleSub(moduleId) {
  document.getElementById('sec-mode-select').classList.add('hidden');
  document.getElementById('steps-bar').classList.add('hidden');
  _hideModuleSubs();
  const el = document.getElementById('sec-' + moduleId);
  if (!el) return;
  el.classList.remove('hidden');
  el.classList.remove('animate-in');
  void el.offsetWidth;
  el.classList.add('animate-in');
  // Populate accurate token cost from AIO_TOOLS definitions
  _updateModuleTokenCost(moduleId);
}

function _updateModuleTokenCost(moduleId) {
  const tokens = MODULE_COSTS[moduleId] !== undefined
    ? MODULE_COSTS[moduleId]
    : AIO_TOOLS.filter(t => (MODULE_TOOLS[moduleId] || []).includes(t.id)).reduce((s, t) => s + t.tokens, 0);
  const el = document.getElementById('mod-token-cost-' + moduleId);
  if (el) el.textContent = tokens + ' token' + (tokens !== 1 ? 's' : '');
}

async function moduleGenerateAll(moduleId) {
  const tools = MODULE_TOOLS[moduleId] || [];
  if (!tools.length) return;

  // Upfront token check
  const required = MODULE_COSTS[moduleId] !== undefined
    ? MODULE_COSTS[moduleId]
    : AIO_TOOLS.filter(t => tools.includes(t.id)).reduce((s, t) => s + t.tokens, 0);

  const errEl = document.getElementById(`mod${moduleId.replace('module','')}-token-err`);
  if (required > 0) {
    try {
      const r = await fetch('/api/token_balance');
      if (r.ok) {
        const d = await r.json();
        updateTokenBadge(d.tokens);
        if (d.tokens < required) {
          if (errEl) {
            errEl.textContent =
              `Not enough tokens — this requires ${required} tokens but your balance is ${d.tokens}. ` +
              `Please top up in Settings.`;
            errEl.classList.remove('hidden');
          }
          return;
        }
      }
    } catch(_) {}
  }
  if (errEl) errEl.classList.add('hidden');

  _aioFromModule = moduleId;   // remember so Back from upload returns here
  _hideModuleSubs();
  S.mode = 'allinone';
  _aioModulePreselect = tools;
  _aio = { selected: new Set(tools), queue: [], queueStep: 0, cos: _aioInitialCos || [], results: {}, previews: {}, expanded: false };
  _aioInitialCos = null;

  document.getElementById('sec-mode-select').classList.add('hidden');
  document.getElementById('steps-bar').classList.remove('hidden');
  document.getElementById('cos-slider-row').classList.add('hidden');
  document.getElementById('btn-course-next-label').textContent = 'Next →';

  // Reuse a syllabus uploaded earlier this session (same course list, user re-picks
  // the course) instead of forcing another upload. The banner offers an override.
  if (S.courses && S.courses.length) {
    const search = document.getElementById('course-search'); if (search) search.value = '';
    renderCourses();
    const nextBtn = document.getElementById('btn-course-next'); if (nextBtn) nextBtn.disabled = !S.selected;
    _setSyllabusReuseBanner(true);
    showSection('courses'); setStepBar(2);
  } else {
    _setSyllabusReuseBanner(false);
    showSection('upload'); setStepBar(1);
  }
}

// Toggle the "using the syllabus from earlier" banner on the course-selection screen.
function _setSyllabusReuseBanner(show) {
  document.getElementById('syllabus-reuse-banner')?.classList.toggle('hidden', !show);
}

// Override: user wants to upload a different syllabus than the cached one.
function aioUploadDifferentSyllabus() {
  _setSyllabusReuseBanner(false);
  showSection('upload'); setStepBar(1);
}

// Cache the current COs (generated, edited or uploaded) for reuse in later modules,
// tied to the selected course since COs are course-specific.
function _cacheCos() {
  if (_aio.cos && _aio.cos.length && S.selected) {
    _cachedCo = { code: S.selected, cos: _aio.cos.map(c => ({ num: c.num, statement: c.statement })) };
  }
}

// Jump from a finished flow into another module while keeping the uploaded syllabus
// and CO file, so the user isn't asked to upload them again. Resets everything else.
function aioSwitchModule(moduleId) {
  const keepCourses  = S.courses;
  const keepSelected = S.selected;
  const keepCachedCo = _cachedCo;
  startOver();
  S.courses  = keepCourses  || [];
  S.selected = keepSelected || null;
  _cachedCo  = keepCachedCo || { code: null, cos: [] };
  selectMode(moduleId);
}

async function module2ComposePaper() {
  const errEl   = document.getElementById('mod2-token-err');
  const required = 2;
  try {
    const r = await fetch('/api/token_balance');
    if (r.ok) {
      const d = await r.json();
      updateTokenBadge(d.tokens);
      if (d.tokens < required) {
        if (errEl) {
          errEl.textContent =
            `Not enough tokens — composing a paper requires ${required} tokens but your balance is ${d.tokens}. ` +
            `Please top up in Settings.`;
          errEl.classList.remove('hidden');
        }
        return;
      }
    }
  } catch(_) {}
  if (errEl) errEl.classList.add('hidden');

  // Try to use the QB that was just generated (skip the upload step)
  try {
    const r = await fetch('/parse_generated_qbank', { method: 'POST' });
    if (r.ok) {
      const d = await r.json();
      if (!d.error) {
        S.mode = 'qpaper';
        S.qbData = d;
        renderQBPreview(d);
        openConfigurePaper();
        return;
      }
    }
  } catch(_) {}

  // Fallback: go to upload step if session QB is unavailable
  selectMode('qpaper');
}

// ── courseNext patch ──────────────────────────────────────────────────────────
(function() {
  const _orig = courseNext;
  courseNext = function() {
    if (S.mode === 'allinone') {
      if (!S.selected) return;
      if (_aioModulePreselect) {
        // Module "Generate All" — pre-selected tools, skip tool-selection screen
        _aio.selected = new Set(_aioModulePreselect);
        _aioModulePreselect = null;
      }
      if (_m4OptionC) {
        // Option C: COs auto-generated, but ask user to upload their PO file first.
        _aioShowPoUpload();
        return;
      }
      if (_m3OptionA || _m4OptionA || _m4OptionD) {
        // Option A / D: ask user to upload CO file before generation.
        // (Option D then asks for a PO file too — handled in aioCoNext.)
        // Re-entrant: works on first Next AND after pressing Back from CO upload screen
        const statusEl = document.getElementById('aio-co-upload-status');
        const nextBtn  = document.getElementById('btn-aio-co-next');
        // Option D continues to a PO-upload step, so this button isn't the final action
        if (nextBtn) nextBtn.textContent = _m4OptionD ? 'Next →' : 'Generate →';
        // COs are course-specific. Re-derive from the cache for the *currently*
        // selected course every time: reuse when it matches, otherwise clear any
        // stale COs (e.g. from a different course picked earlier) and ask for an
        // upload. The Choose File button always allows an override.
        if (_cachedCo.cos.length && _cachedCo.code === S.selected) {
          _aio.cos = _cachedCo.cos.map(c => ({ num: c.num, statement: c.statement }));
        } else {
          _aio.cos = [];
        }
        if (_aio.cos.length) {
          if (statusEl) statusEl.innerHTML =
            `<span style="color:#10b981;font-weight:700;">&#10003; Reusing ${_aio.cos.length} COs from earlier this session.</span>` +
            ` <span style="color:var(--muted);">Choose a file to replace them.</span>`;
          if (nextBtn) nextBtn.disabled = false;
        } else if (statusEl) {
          statusEl.textContent = 'No file selected — choose a TXT, DOCX, or PDF file.';
          if (nextBtn) nextBtn.disabled = true;
          const inp = document.getElementById('aio-co-file-input');
          if (inp) inp.value = '';
        }
        document.getElementById('aio-co-upload-err').classList.add('hidden');
        showSection('aio-co-upload'); setStepBar(2);
        return;
      }
      if (!_aio.selected.size) { _aioShowSelectScreen(); return; }
      aioStart();
      return;
    }
    _orig();
  };
})();

function _aioToolToggle(cb) {
  const id = cb.dataset.id;
  if (cb.checked) {
    _aio.selected.add(id);
    const lbl = document.getElementById(`aio-label-${id}`);
    if (lbl) lbl.style.borderColor = 'var(--primary)';
  } else {
    _aio.selected.delete(id);
    const lbl = document.getElementById(`aio-label-${id}`);
    if (lbl) lbl.style.borderColor = 'var(--border)';
  }
  _aioUpdateStartBtn();
}

function _aioUpdateStartBtn() {
  const selected = [..._aio.selected];
  const toolTokens = AIO_TOOLS.filter(t => selected.includes(t.id)).reduce((s, t) => s + t.tokens, 0);
  // CO generation is auto-added (1 token) if CO-dependent tools are selected but cos is not and no COs pre-loaded
  const autoAddCos = _aio.cos.length === 0 && selected.some(id => _AIO_CO_DEPS.has(id)) && !selected.includes('cos');
  const est = toolTokens + (autoAddCos ? 1 : 0);
  document.getElementById('aio-est-tokens').textContent = est;
  document.getElementById('btn-aio-start').disabled = _aio.selected.size === 0;
}

// ── Pipeline start ────────────────────────────────────────────────────────────
function aioStart() {
  if (_aio.selected.size === 0) return;

  // Build ordered queue: cos first if needed, then the rest in AIO_TOOLS order
  const toolOrder       = AIO_TOOLS.map(t => t.id);
  const hasCosPreloaded = _aio.cos.length > 0;  // Option A: COs uploaded by user
  const needsCos        = !hasCosPreloaded && [..._aio.selected].some(id => _AIO_CO_DEPS.has(id));
  const queue           = [];

  // CO always first if selected or required (but not if COs are already loaded)
  if (_aio.selected.has('cos') || needsCos) {
    queue.push('cos');
  }
  for (const id of toolOrder) {
    if (id !== 'cos' && _aio.selected.has(id)) queue.push(id);
  }

  _aio.queue     = queue;
  _aio.queueStep = 0;
  if (!hasCosPreloaded) _aio.cos = [];  // preserve pre-loaded COs
  _aio.results   = {};
  _aio.previews  = {};

  showSection('aio-run'); setStepBar(3);
  _aioRunStep();
}

// ── Run current pipeline step ─────────────────────────────────────────────────
function _aioRunStep() {
  if (_aio.queueStep >= _aio.queue.length) {
    _aioShowDone();
    return;
  }

  const toolId = _aio.queue[_aio.queueStep];
  const tool   = AIO_TOOLS.find(t => t.id === toolId);

  // Update header
  document.getElementById('aio-run-icon').innerHTML    = svgIcon(tool.icon);
  document.getElementById('aio-run-title').textContent = `Generating ${tool.label}…`;
  document.getElementById('aio-run-sub').textContent   = `Step ${_aio.queueStep + 1} of ${_aio.queue.length}`;

  // Reset UI state
  document.getElementById('aio-preview-wrap').classList.add('hidden');
  const _progEl   = document.getElementById('aio-run-progress');
  const _progFill = _progEl.querySelector('.uni-progress-fill');
  const _progLbl  = _progEl.querySelector('.uni-progress-label');
  if (_progLbl)  _progLbl.textContent = 'Generating…';
  if (_progFill) {
    _progFill.classList.remove('is-indeterminate', 'is-forward');
    _progFill.style.width      = '';
    _progFill.style.transition = '';
    _progFill.style.position   = '';
    _progFill.style.left       = '';
    _progFill.style.background = '';
    // Force reflow so the animation restarts fresh
    void _progFill.offsetWidth;
    _progFill.classList.add('is-forward');
  }
  _progEl.classList.remove('hidden');
  document.getElementById('aio-run-stream').classList.add('hidden');
  document.getElementById('aio-run-stream').innerHTML = '';
  document.getElementById('aio-run-loading').classList.add('hidden');
  document.getElementById('aio-run-err').classList.add('hidden');
  document.getElementById('aio-edit-wrap').classList.add('hidden');
  _aio.expanded = false;
  document.getElementById('btn-aio-expand').textContent = 'Expand';

  // Dispatch to per-tool generator
  switch (toolId) {
    case 'cos':           _aioRunCos();   break;
    case 'qbank':         _aioRunQbank(); break;
    case 'pomap':         _aioRunPomap(); break;
    case 'lessonplan':    _aioRunLp();    break;
    case 'teachingdiary': _aioRunTd();    break;
    case 'sdgco':         _aioRunSdgCo(); break;
    case 'sdgpo':         _aioRunSdgPo(); break;
    case 'coatt':         _aioRunCoAtt(); break;
    case 'poatt':         _aioRunPoAtt(); break;
  }
}

// ── Called when a tool finishes ───────────────────────────────────────────────
function _aioOnDone(toolId, previewText, resultData) {
  _aio.previews[toolId] = previewText;
  if (resultData !== undefined) _aio.results[toolId] = resultData;

  // Show preview
  document.getElementById('aio-run-progress').classList.add('hidden');
  document.getElementById('aio-run-loading').classList.add('hidden');
  document.getElementById('aio-run-stream').classList.add('hidden');

  const box         = document.getElementById('aio-preview-box');
  const tableWrap   = document.getElementById('aio-pomap-table-wrap');
  const pomapAdjust = document.getElementById('aio-pomap-adjust');
  const richEl      = document.getElementById('aio-rich-preview');
  const toolAdjust  = document.getElementById('aio-tool-adjust');
  const isPomap     = toolId === 'pomap';
  const isRich      = ['sdgco', 'sdgpo', 'coatt', 'poatt'].includes(toolId);

  // Reset all specialised containers, then show the right one
  box.style.display = 'none';
  tableWrap.classList.add('hidden');
  pomapAdjust.classList.add('hidden');
  richEl.classList.add('hidden');
  toolAdjust.classList.add('hidden');

  if (isPomap) {
    tableWrap.style.maxHeight = '280px';
    tableWrap.classList.remove('hidden');
    _renderAioPomapTable(resultData || []);
    pomapAdjust.classList.remove('hidden');
    _aioInitPomapChecklist(resultData || []);
  } else if (isRich) {
    richEl.style.maxHeight = '280px';
    richEl.classList.remove('hidden');
    richEl.innerHTML = _aioRenderRichTool(toolId, resultData || {});
    if (toolId !== 'sdgpo') {
      toolAdjust.classList.remove('hidden');
      _aioCurrentRichTool = toolId;
      _aioSetupToolAdjust(toolId, resultData || {});
    }
  } else {
    box.textContent     = previewText;
    box.style.maxHeight = '200px';
    box.style.display   = '';
  }

  document.getElementById('btn-aio-expand').style.display = '';
  document.getElementById('aio-preview-actions').style.display = '';
  document.getElementById('aio-preview-wrap').classList.remove('hidden');
  document.getElementById('aio-edit-wrap').classList.add('hidden');

  const tool = AIO_TOOLS.find(t => t.id === toolId);
  document.getElementById('aio-run-title').textContent = `${tool.label} — Done`;

  // For CO step: replace plain-text preview with inline selection UI
  if (toolId === 'cos') {
    box.style.whiteSpace = 'normal';
    box.style.maxHeight  = '520px';
    box.style.overflow   = 'auto';
    box.innerHTML        = _aioCoSelectionHtml();
    document.getElementById('btn-aio-expand').style.display = 'none';
    document.getElementById('btn-aio-edit').style.display   = 'none';
    document.getElementById('btn-aio-regen').style.display  = '';
    document.getElementById('btn-aio-next').textContent     = 'Use Selected COs →';
    document.getElementById('btn-aio-next').onclick         = _aioCoUseSelected;
    return;
  }

  // Show/hide Edit and Regenerate based on tool capability
  document.getElementById('btn-aio-edit').style.display  = tool.canEdit  ? '' : 'none';
  document.getElementById('btn-aio-regen').style.display = tool.canRegen ? '' : 'none';

  const isLast = _aio.queueStep >= _aio.queue.length - 1;
  document.getElementById('btn-aio-next').textContent = isLast ? 'Finish →' : 'Next →';

  refreshTokenBadge();
  // Only count as history generation if user explicitly selected this tool
  if (_aio.selected.has(toolId)) saveHistory(toolId);
}

// ── Edit workflow ─────────────────────────────────────────────────────────────
function aioStartEdit() {
  const toolId   = _aio.queue[_aio.queueStep];
  const isCo     = toolId === 'cos';
  const coPanel  = document.getElementById('aio-co-edit-panel');
  const txtPanel = document.getElementById('aio-text-edit-panel');

function aioCancelEdit() {
  document.getElementById('aio-edit-wrap').classList.add('hidden');
  document.getElementById('aio-co-edit-panel').classList.add('hidden');
  document.getElementById('aio-text-edit-panel').classList.add('hidden');

  document.getElementById('btn-aio-expand').style.display      = '';
  document.getElementById('aio-preview-actions').style.display = '';
}

function aioSaveEdit() {
  const toolId = _aio.queue[_aio.queueStep];

  if (toolId === 'cos') {
    const included = new Set(
      [...document.querySelectorAll('.aio-co-include-check:checked')].map(cb => parseInt(cb.dataset.num))
    );
    if (included.size === 0) { alert('Please include at least one CO.'); return; }
    const items = document.querySelectorAll('#aio-co-edit-list .aio-co-edit-ta');
    _aio.cos = [...items]
      .filter(ta => included.has(parseInt(ta.dataset.num)))
      .map(ta => ({ num: parseInt(ta.dataset.num, 10), statement: ta.value.trim() }))
      .filter(c => c.statement);
    const newText = _aio.cos.map(c => `CO${c.num}: ${c.statement}`).join('\n');
    _aio.previews[toolId] = newText;
    document.getElementById('aio-preview-box').textContent = newText;
  } else {
    const newText = document.getElementById('aio-edit-area').value;
    _aio.previews[toolId] = newText;
    document.getElementById('aio-preview-box').textContent = newText;
  }

  aioCancelEdit();
}

      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;

function _aioToggleInclude(cb) {
  const num     = parseInt(cb.dataset.num);
  const checked = [...document.querySelectorAll('.aio-co-include-check:checked')];
  if (cb.checked && checked.length > CO_MAX_SELECT) {
    cb.checked = false;
    return;
  }
  const card = document.getElementById(`aio-co-card-${num}`);
  if (card) {
    card.style.opacity     = cb.checked ? '1' : '.5';
    card.style.borderColor = cb.checked ? 'var(--primary)' : 'var(--border)';
    card.style.background  = cb.checked ? 'rgba(99,102,241,.08)' : 'transparent';
  }
  const total   = document.querySelectorAll('.aio-co-include-check:checked').length;
  const countEl = document.getElementById('aio-include-count');
  if (countEl) {
    countEl.textContent = `${total} / ${CO_MAX_SELECT}`;
    countEl.style.color = total >= CO_MAX_SELECT ? 'var(--success, #4ade80)' : 'var(--primary)';
  }
}

// ── AI Improve for CO step ────────────────────────────────────────────────────
async function _aioAiImproveSelected() {
  const checks = [...document.querySelectorAll('.aio-co-improve-check:checked')];
  const statusEl = document.getElementById('aio-ai-status');
  const outputEl = document.getElementById('aio-ai-output');
  const btn      = document.getElementById('btn-aio-ai-improve');

  if (!checks.length) {
    statusEl.textContent = 'Check at least one CO to improve.';
    return;
  }

  const toReplace = checks.map(cb => parseInt(cb.dataset.num, 10));
  const existingCos = _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement }));

  statusEl.innerHTML = '<span class="ai-spin">↻</span> Improving…';
  outputEl.innerHTML = '';
  btn.disabled = true;

  try {
    const r = await fetch('/regenerate_selected_cos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.selected || '', to_replace: toReplace, existing_cos: existingCos }),
    });
    const d = await r.json();
    btn.disabled = false;

    if (d.error) { statusEl.textContent = d.error; return; }

    statusEl.textContent = `${d.cos.length} CO(s) improved. Review and apply below.`;

    outputEl.innerHTML = d.cos.map(nc => `
      <div style="margin-bottom:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(99,102,241,.04);">
        <div style="font-size:.72rem;font-weight:700;color:var(--primary);margin-bottom:4px;">CO${nc.num} — suggestion</div>
        <div style="font-size:.78rem;line-height:1.5;color:var(--text);margin-bottom:8px;">${esc(nc.statement)}</div>
        <button class="ctrl-btn" onclick="_aioApplyCo(${nc.num}, this)" data-stmt="${esc(nc.statement)}"
          style="font-size:.72rem;padding:3px 10px;">Apply</button>
      </div>
    `).join('');

    refreshTokenBadge();
  } catch(e) {
    btn.disabled = false;
    statusEl.textContent = 'Failed: ' + e.message;
  }
}

function _aioApplyCo(num, btn) {
  const stmt = btn.dataset.stmt;
  // Update the textarea in the edit list
  const ta = document.querySelector(`.aio-co-edit-ta[data-num="${num}"]`);
  if (ta) { ta.value = stmt; ta.style.background = 'rgba(16,185,129,.08)'; }
  btn.textContent = '✓ Applied';
  btn.disabled = true;
}

function _aioCoCardClick(num) {
