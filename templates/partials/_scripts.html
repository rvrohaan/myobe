function _aioCoUseSelected() {
  const included = new Set(
    [...document.querySelectorAll('.aio-co-include-check:checked')].map(cb => parseInt(cb.dataset.num))
  );
  if (included.size === 0) { alert('Please select at least one CO.'); return; }
  _aio.cos = _aio.cos.filter(c => included.has(c.num));
  _cacheCos();   // remember the chosen COs so later modules can reuse them
  _aio.previews['cos'] = _aio.cos.map(c => `CO${c.num}: ${c.statement}`).join('\n');
  // Restore Next button for subsequent steps
  const nextBtn = document.getElementById('btn-aio-next');
  nextBtn.textContent = 'Next →';
  nextBtn.onclick     = aioNext;
  aioNext();
}

function aioNext() {
  _aio.queueStep++;
  if (_aio.queueStep >= _aio.queue.length) { _aioShowDone(); return; }
  _aioRunStep();
}

function aioSkip() {
  _aio.queueStep++;
  if (_aio.queueStep >= _aio.queue.length) { _aioShowDone(); return; }
  _aioRunStep();
}

function aioRegen() {
  // Reset Next button in case we were on the CO step
  const nextBtn = document.getElementById('btn-aio-next');
  if (nextBtn) { nextBtn.textContent = 'Next →'; nextBtn.onclick = aioNext; }
  _aioRunStep();
}

// Show a step error with a Retry button (queueStep is not advanced on failure,
// so re-running the current step retries it without losing earlier results).
function _aioStepErr(msg) {
  document.getElementById('aio-run-err-msg').textContent = msg;
  document.getElementById('aio-run-err').classList.remove('hidden');
}

// Retry the current (failed) pipeline step — same target as Regenerate.
function aioRetryStep() {
  const nextBtn = document.getElementById('btn-aio-next');
  if (nextBtn) { nextBtn.textContent = 'Next →'; nextBtn.onclick = aioNext; }
  _aioRunStep();
}


// ── CO parser helper ──────────────────────────────────────────────────────────
function _parseAioCos(text) {
  const seen  = new Set();
  const cos   = [];
  const lines = text.replace(/\r\n/g, '\n').replace(/\*\*/g, '').split('\n');

  for (let i = 0; i < lines.length; i++) {
    // Strip leading/trailing pipe and surrounding whitespace (handles table rows)
    const raw = lines[i].replace(/^\s*\|?\s*/, '').replace(/\s*\|.*$/, '').trim();

    // Match CO heading: CO1: / CO1. / CO1 - / CO1 – / CO1<space>text
    const m = raw.match(/^CO(\d+)\s*[:\.\-–]?\s*(.+)/i);
    if (!m || !m[2].trim()) continue;

    const num = parseInt(m[1], 10);
    if (seen.has(num)) continue;

    let stmt = m[2].trim();

    // Collect continuation lines until blank, new CO heading, table separator, or metadata
    while (i + 1 < lines.length) {
      const nxt = lines[i + 1].replace(/^\s*\|?\s*/, '').replace(/\s*\|.*$/, '').trim();
      if (!nxt ||
          /^CO\d+\s*[:\.\-–]/i.test(nxt) ||
          /^[-|=\s]+$/.test(nxt) ||
          /^(Unit|Bloom|BT\s*Level|Knowledge|PO|SDG|Mapping|Sl\.?\s*No)/i.test(nxt)) break;
      stmt += ' ' + nxt;
      i++;
    }

    stmt = stmt.replace(/-\s+/g, '-').replace(/\s+/g, ' ').trim();
    if (stmt.length > 15) {
      seen.add(num);
      cos.push({ num, statement: stmt });
    }
  }
  return cos;
}

// ── Prepare session helper (calls /aio_prepare) ───────────────────────────────
async function _aioPrepare() {
  const body = {
    code: S.selected || '',
    cos:  _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement })),
  };
  const r = await fetch('/aio_prepare', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('Session setup failed');
  const d = await r.json();
  // Sync _aio.cos to the server-renumbered COs (CO1, CO2, CO3…) so downloads
  // use the same numbers as the stored co_taxonomy
  if (d.cos && d.cos.length) {
    _aio.cos = d.cos.map(c => ({ num: c.num, statement: c.statement }));
  }
  _cacheCos();   // cache finalised COs for reuse in later modules
  return d;
}

// CO Generation
function _aioRunCos() {
  const streamEl = document.getElementById('aio-run-stream');
  streamEl.classList.remove('hidden');
  _startFakeProgress('aio-run-progress', 25000, [
    'Generating Course Outcomes…', 'Mapping to Bloom\'s taxonomy…', 'Crafting CO statements…', 'Finalising outcomes…'
  ]);
  let chunks = [];

  const es = new EventSource(`/generate?code=${encodeURIComponent(S.selected || '')}&num_cos=15`);
  const _coTimeout = _addSSETimeout(es, 100000, () => {
    _aioStepErr('CO generation timed out. Try regenerating.');
  });

  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.error) {
      es.close(); _coTimeout(); _stopFakeProgress('aio-run-progress');
      _aioStepErr(d.error);
      return;
    }
    if (d.chunk) {
      chunks.push(d.chunk);
      streamEl.textContent = chunks.join('');
      streamEl.scrollTop = streamEl.scrollHeight;
    }
    if (d.done) {
      es.close(); _coTimeout();
      const raw = chunks.join('');
      _aio.cos  = (d.cos && d.cos.length) ? d.cos : _parseAioCos(raw);
      const preview = _aio.cos.length
        ? _aio.cos.map(c => `CO${c.num}: ${c.statement}`).join('\n')
        : raw.trim();
      // Pass _aioOnDone as callback so "Done!" animation (650ms) completes before
      // the progress bar is hidden by _aioOnDone
      _stopFakeProgress('aio-run-progress', () => _aioOnDone('cos', preview));
    }
  };
  es.onerror = () => {
    es.close(); _coTimeout(); _stopFakeProgress('aio-run-progress');
    _aioStepErr('Connection error generating COs. Try regenerating.');
  };
}

// Question Bank
async function _aioRunQbank() {
  // Use the same growing-fill progress bar style as CO generation
  const progEl   = document.getElementById('aio-run-progress');
  const progFill = progEl.querySelector('.uni-progress-fill');
  const progLbl  = progEl.querySelector('.uni-progress-label');

  // Switch from indeterminate to real-fill mode
  if (progFill) {
    progFill.classList.remove('is-indeterminate', 'is-forward');
    progFill.style.position   = '';
    progFill.style.left       = '';
    progFill.style.transition = 'width .5s ease';
    progFill.style.width      = '5%';
  }
  if (progLbl) progLbl.textContent = 'Preparing Question Bank…';

  // Keep stream hidden — progress label carries status instead
  document.getElementById('aio-run-stream').classList.add('hidden');

  // Helper to update fill and label without animation jank
  let _numUnits = 0;
  function _setProgress(pct, label) {
    if (progFill) progFill.style.width = Math.min(pct, 92) + '%';
    if (progLbl && label) progLbl.textContent = label;
  }

  // Sync session so QBank can use AIO-generated COs via current_result
  if (_aio.cos.length) {
    try { await _aioPrepare(); } catch(e) {
      _aioStepErr('Session setup failed: ' + e.message); return;
    }
  }
  _setProgress(8, 'Building unit plan…');

  const params = new URLSearchParams({
    code: S.selected || '', n2: 4, n5: 4, n10: 4, n_assign: 2, n_quiz: 5, n_exp: 3,
  });
  // Pass CO numbers so QBank uses the pre-generated COs instead of auto-generating
  if (_aio.cos.length) {
    params.set('selected_cos', _aio.cos.map(c => c.num).join(','));
  }

  const es = new EventSource(`/generate_qbank?${params}`);
  const _qbTimeout = _addSSETimeout(es, 600000, () => {
    _aioStepErr('Question Bank generation timed out. Try regenerating.');
  });

  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'error') {
      es.close(); _qbTimeout();
      progEl.classList.add('hidden');
      _aioStepErr(d.message);
      return;
    }
    if (d.type === 'status') {
      if (d.stage === 'cos')        _setProgress(10, d.message);
      else if (d.stage === 'cos_done') _setProgress(15, d.message);
      else if (d.stage === 'units')    _setProgress(18, d.message);
      else if (d.stage === 'units_done') {
        _numUnits = d.num_units || 1;
        _setProgress(20, d.message);
      } else if (d.stage === 'unit' && _numUnits > 0) {
        // Spread remaining 72% across units (20% → 92%)
        const pct = 20 + ((d.unit_idx - 1) / _numUnits) * 72;
        _setProgress(pct, d.message);
      }
    }
    if (d.type === 'unit_done' && _numUnits > 0) {
      const pct = 20 + (d.unit_idx / _numUnits) * 72;
      _setProgress(pct, `Unit ${d.unit_idx} of ${_numUnits} complete`);
    }
    if (d.type === 'done') {
      es.close(); _qbTimeout();
      // Animate to 100% then hide, matching _stopFakeProgress behaviour
      if (progFill) {
        progFill.classList.remove('is-forward', 'is-indeterminate');
        progFill.style.transition = 'width .25s ease';
        progFill.style.width = '100%';
      }
      if (progLbl)  progLbl.textContent = 'Done!';
      setTimeout(() => {
        progEl.classList.add('hidden');
        if (progFill) { progFill.style.width = '0%'; progFill.style.transition = ''; }
        const summary = `Question Bank generated successfully.\n${d.num_units || 0} unit(s) processed.\n\nDownload from the Done screen at the end of the pipeline.`;
        _aioOnDone('qbank', summary);
      }, 650);
    }
  };
  es.onerror = () => {
    es.close(); _qbTimeout();
    progEl.classList.add('hidden');
    _aioStepErr('Connection error generating Question Bank. Try regenerating.');
  };
}

// ── AIO CO-PO Mapping helpers ─────────────────────────────────────────────────

// Stores PO selection applied via the AIO adjust panel (null = use all default POs)
let _aioPomapConfiguredPos = null;
// Tracks custom PO entries for the AIO adjust panel
let _aioPomapCustomPos = [];

function _activeAioPomapKeys(rows) {
  const STD = {'PO1':0,'PO2':1,'PO3':2,'PO4':3,'PO5':4,'PO6':5,
               'PO7':6,'PO8':7,'PO9':8,'PO10':9,'PO11':10,'PO12':11};
  const _sort = keys => [...keys].sort((a, b) => {
    const oa = STD[a] ?? 999, ob = STD[b] ?? 999;
    return oa !== ob ? oa - ob : a.localeCompare(b);
  });
  if (_aioPomapConfiguredPos) {
    const keys = [
      ...(_aioPomapConfiguredPos.selected_standard || []),
      ...(_aioPomapConfiguredPos.custom_pos || []).map(cp => cp.key).filter(Boolean),
    ];
    if (keys.length) return _sort(keys);
  }
  // Auto: show only POs with at least one non-zero score
  const seen = new Set(), all = [];
  rows.forEach(r => Object.keys(r.scores || {}).forEach(k => { if (!seen.has(k)) { seen.add(k); all.push(k); } }));
  const active = _sort(all).filter(k => rows.some(r => (r.scores[k] || 0) > 0));
  return active.length ? active : _sort(all);
}

function _renderAioPomapTable(rows) {
  const pos = _activeAioPomapKeys(rows);
  const hdrCells = pos.map(k => `<th>${k}</th>`).join('');
  const dataRows = rows.map(r => {
    const cells = pos.map(k => {
      const v = r.scores[k] || 0;
      const cls = v === 3 ? 'score-3' : v === 2 ? 'score-2' : v === 1 ? 'score-1' : 'score-0';
      return `<td class="${cls}">${v || '–'}</td>`;
    }).join('');
    return `<tr><td class="co-label">${esc(r.co || '')}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('aio-pomap-inline-map').innerHTML =
    `<table class="po-map-table">
       <thead><tr><th class="co-hdr">CO \\ PO</th>${hdrCells}</tr></thead>
       <tbody>${dataRows}</tbody>
     </table>`;

  // Summary bar
  let m3=0, m2=0, m1=0, m0=0;
  rows.forEach(r => pos.forEach(k => {
    const v = r.scores[k] || 0;
    if (v===3) m3++; else if (v===2) m2++; else if (v===1) m1++; else m0++;
  }));
  const parts = [];
  if (m3) parts.push(`<strong>Strong (3):</strong> ${m3}`);
  if (m2) parts.push(`<strong>Moderate (2):</strong> ${m2}`);
  if (m1) parts.push(`<strong>Minor (1):</strong> ${m1}`);
  parts.push(`None: ${m0}`);
  const sumEl = document.getElementById('aio-pomap-summary');
  sumEl.innerHTML = parts.join(' &nbsp;·&nbsp; ');
  sumEl.classList.remove('hidden');
}

function _aioInitPomapChecklist(rows) {
  // Determine which keys are currently active to pre-check them
  const activeKeys = new Set(_activeAioPomapKeys(rows));
  document.getElementById('aio-po-checklist').innerHTML =

      <label class="po-check-row">
        <input type="checkbox" id="aio-pochk-${po.key}" ${activeKeys.has(po.key) ? 'checked' : ''}>
        <span class="po-key-badge">${po.key}</span>
        <div class="po-check-info">
          <div class="po-check-name">${po.name}</div>

  const list = document.getElementById('aio-po-custom-list');

function _renderAioCustomPoRow(idx) {
  const cp  = _aioPomapCustomPos[idx];

async function _aioApplyPoConfig(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }
  document.getElementById('aio-po-err').classList.add('hidden');

  const selected_standard = STANDARD_POS
    .filter(po => { const el = document.getElementById(`aio-pochk-${po.key}`); return el && el.checked; })
    .map(po => po.key);
  const custom_pos = (_aioPomapCustomPos || [])
    .filter(cp => cp && cp.key && cp.name)
    .map(cp => ({ key: cp.key, name: cp.name, desc: cp.desc || '' }));

  if (selected_standard.length + custom_pos.length === 0) {
    showErr('aio-po-err', 'Select at least one Programme Outcome.');
    if (btn) { btn.disabled = false; btn.textContent = '↺ Apply & Regenerate'; }
    return;
  }

  _aioPomapConfiguredPos = { selected_standard, custom_pos };

  try {
    const r = await fetch('/configure_po_mapping', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selected_standard, custom_pos }),
    });
    const d = await r.json();
    if (d.error) {
      showErr('aio-po-err', d.error);
      if (btn) { btn.disabled = false; btn.textContent = '↺ Apply & Regenerate'; }
      return;
    }
  } catch(e) {
    showErr('aio-po-err', 'Failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '↺ Apply & Regenerate'; }
    return;
  }

  if (btn) { btn.disabled = false; btn.textContent = '↺ Apply & Regenerate'; }
  // Close the details and regenerate
  document.getElementById('aio-po-details').removeAttribute('open');
  document.getElementById('aio-po-arrow').textContent = '▶';
  aioRegen();
}

function _buildPomapPreview(rows) {
  if (!rows.length) return 'CO–PO Mapping generated (no rows).';
  const poKeys = Object.keys(rows[0].scores || {});
  let txt = 'CO–PO Mapping  (3 = Strong · 2 = Moderate · 1 = Low · 0 = None)\n\n';
  txt += 'CO      ' + poKeys.map(k => k.padStart(4)).join(' ') + '\n';
  txt += '─'.repeat(8 + poKeys.length * 5) + '\n';
  for (const row of rows) {
    const scores = poKeys.map(k => String(row.scores[k] ?? 0).padStart(4));
    txt += (row.co || '').padEnd(8) + scores.join(' ') + '\n';
  }
  return txt;
}

    case 'sdgpo':  return _aioHtmlSdgPo(d);
    case 'coatt':  return _aioHtmlCoAtt(d);
    case 'poatt':  return _aioHtmlPoAtt(d);
    default:       return '';
  }
}

function _aioHtmlSdgCo(d) {
  // Matrix format (all SDGs)
  if (d.matrix) {
    const sdgs     = d.sdgs || [];
    const cos      = d.cos  || [];
    const matrix   = d.matrix;
    const top      = d.top_sdgs || [];
    const shortLbl = s => s.replace(/ — .*/,'');   // "SDG 1 — No Poverty" → "SDG 1"

    let h = `<div style="padding:14px 16px;">`;

    // Top SDGs summary chips
    if (top.length) {
      h += `<div style="margin-bottom:10px;font-size:.75rem;">
        <span style="font-weight:700;color:var(--muted);">Top SDGs: </span>`;
      h += top.slice(0, 6).map(s => `<span style="display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;background:rgba(16,185,129,.12);color:#059669;border-radius:999px;font-size:.72rem;font-weight:700;">${esc(shortLbl(s))}</span>`).join('');
      h += `</div>`;
    }

    // Matrix table (scrollable)
    h += `<div class="po-map-wrap" style="margin:0;">
      <table class="po-map-table">
        <thead><tr>
          <th class="co-hdr">CO \\ SDG</th>`;
    sdgs.forEach(s => {
      h += `<th title="${esc(s)}">${esc(shortLbl(s))}</th>`;
    });
    h += `<th>Total</th></tr></thead><tbody>`;

    cos.forEach(co => {
      const row = matrix[co] || {};
      h += `<tr><td class="co-label">${esc(co)}</td>`;
      sdgs.forEach(s => {
        const v = row[s] || 0;
        const cls = v===3?'score-3':v===2?'score-2':v===1?'score-1':'score-0';
        h += `<td class="${cls}">${v||'–'}</td>`;
      });
      h += `<td style="font-weight:700;background:#f0f4f8;">${d.co_totals[co]||0}</td></tr>`;
    });

    // SDG totals row
    h += `<tr><td class="co-label" style="font-style:italic;">Total</td>`;
    sdgs.forEach(s => {
      const t = d.sdg_totals[s] || 0;
      const cls = t > 0 ? 'score-2' : 'score-0';
      h += `<td class="${cls}" style="font-size:.72rem;">${t||'–'}</td>`;
    });
    h += `<td></td></tr>`;

    h += `</tbody></table></div></div>`;
    return h;
  }

  // Legacy single-SDG fallback
  const target = d.targetSdg || '—';
  const cs = d.contributions || [];
  let h = `<div style="padding:14px 16px;">`;
  h += `<div style="font-size:.78rem;color:var(--muted);margin-bottom:10px;">Target SDG: <strong>${esc(target)}</strong></div>`;
  h += `<table class="po-map-table"><thead><tr><th class="co-hdr">CO</th><th style="text-align:left;">Statement</th><th>Score</th><th>Share %</th></tr></thead><tbody>`;
  cs.forEach(c => {
    const cls = c.score >= 2 ? 'score-3' : c.score >= 1 ? 'score-2' : 'score-0';
    const stmt = (c.statement || '').length > 55 ? c.statement.slice(0, 52) + '…' : (c.statement || '');
    h += `<tr><td class="co-label">${esc(c.co)}</td><td style="text-align:left;font-size:.77rem;">${esc(stmt)}</td><td class="${cls}">${c.score}</td><td>${c.pct.toFixed(1)}%</td></tr>`;
  });
  h += `</tbody></table>`;
  h += `<div style="font-size:.77rem;color:var(--muted);margin-top:8px;">Total score: ${d.total || 0}</div></div>`;
  return h;
}

function _aioHtmlSdgPo(d) {
  const comp   = typeof d.composite === 'number' ? d.composite : 0;
  const interp = comp >= 85 ? 'Excellent' : comp >= 70 ? 'Strong' : comp >= 50 ? 'Moderate' : 'Weak';
  const results = d.results || [];

  // Sort: contributing SDGs first (desc), then zero ones
  const sorted = [...results].sort((a, b) => b.contribution - a.contribution);
  const active = sorted.filter(r => r.contribution > 0);
  const zero   = sorted.filter(r => r.contribution === 0);

  let h = `<div style="padding:14px 16px;">`;

  // Composite SDG Index badge
  h += `<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:10px 14px;
             background:rgba(16,185,129,.08);border-radius:8px;border:1px solid rgba(16,185,129,.2);">
    <div>
      <div style="font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Composite SDG Index</div>
      <div style="font-size:1.45rem;font-weight:900;color:#059669;">${comp.toFixed(2)}%</div>
    </div>
    <div style="font-size:.82rem;color:var(--muted);">${esc(interp)}</div>
    <div style="margin-left:auto;font-size:.75rem;color:var(--muted);">${active.length} / 17 SDGs covered</div>
  </div>`;

  h += `<table class="po-map-table">
    <thead><tr>
      <th class="co-hdr">SDG</th>
      <th>Contribution %</th>
      <th>Interpretation</th>
    </tr></thead><tbody>`;

  // Active SDGs first
  active.forEach(r => {
    const i   = r.interpretation || '';
    const cls = i === 'Excellent' ? 'score-3' : i === 'Strong' ? 'score-2' : i === 'Moderate' ? 'score-1' : 'score-1';
    h += `<tr><td class="co-label" style="font-size:.77rem;">${esc(r.sdg)}</td>
              <td style="font-weight:600;">${r.contribution.toFixed(2)}%</td>
              <td class="${cls}">${esc(i)}</td></tr>`;
  });

  // Zero-contribution SDGs (muted)
  if (zero.length) {
    h += `<tr><td colspan="3" style="font-size:.72rem;color:var(--muted);padding:6px 10px;text-align:center;background:#f8fafc;font-style:italic;">
      ${zero.length} SDG${zero.length>1?'s':''} with no contribution (0%)
    </td></tr>`;
    zero.forEach(r => {
      h += `<tr style="opacity:.45;"><td class="co-label" style="font-size:.75rem;">${esc(r.sdg)}</td>
                <td>0.00%</td><td class="score-0">—</td></tr>`;
    });
  }

  h += `</tbody></table></div>`;
  return h;
}

function _aioHtmlCoAtt(d) {
  const t = d.thresholds || {t1:70, t2:60, t3:50};
  let h = `<div style="padding:14px 16px;">`;
  h += `<div style="font-size:.73rem;color:var(--muted);margin-bottom:10px;">Level 3 ≥ ${t.t1}% &nbsp;&middot;&nbsp; Level 2 ≥ ${t.t2}% &nbsp;&middot;&nbsp; Level 1 ≥ ${t.t3}%</div>`;
  h += `<div style="font-size:.82rem;font-weight:700;margin-bottom:6px;">CO Attainment</div>`;
  h += `<table class="po-map-table"><thead><tr><th class="co-hdr">CO</th><th>Attainment %</th><th>Level</th></tr></thead><tbody>`;
  (d.coResults || []).forEach(c => {
    const cls = c.level===3?'score-3':c.level===2?'score-2':c.level===1?'score-1':'score-0';
    h += `<tr><td class="co-label">${esc(c.co)}</td><td>${c.pct.toFixed(1)}%</td><td class="${cls}">${c.level}</td></tr>`;
  });
  h += `</tbody></table>`;
  const pos = d.poResults || [];
  if (pos.length) {
    h += `<div style="font-size:.82rem;font-weight:700;margin:12px 0 6px;">PO Attainment</div>`;
    h += `<table class="po-map-table"><thead><tr>`;
    pos.forEach(p => { h += `<th>${esc(p.po)}</th>`; });
    h += `</tr></thead><tbody><tr>`;
    pos.forEach(p => {
      const v = p.attainment || 0;
      const cls = v>=2.5?'score-3':v>=1.5?'score-2':v>=0.5?'score-1':'score-0';
      h += `<td class="${cls}">${v.toFixed(2)}</td>`;
    });
    h += `</tr></tbody></table>`;
  }
  h += `</div>`;
  return h;
}

function _aioHtmlPoAtt(d) {
  const pos = d.po_attainment || [];
  const sum = d.summary || {};
  let h = `<div style="padding:14px 16px;">`;
  h += `<div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;font-size:.78rem;">
    <span><strong>Mean:</strong> ${sum.mean_pct || 0}%</span>
    <span><strong>Met target:</strong> ${sum.pos_meeting_target || 0}/${pos.length}</span>
    <span style="color:var(--muted);">Target: ≥${sum.target_threshold || 60}%</span></div>`;
  h += `<table class="po-map-table"><thead><tr><th class="co-hdr">PO</th><th style="text-align:left;">Name</th><th>Att %</th><th>Level</th><th>Target</th></tr></thead><tbody>`;
  pos.forEach(p => {
    const lc = p.level===3?'score-3':p.level===2?'score-2':p.level===1?'score-1':'score-0';
    const tc = p.target_met ? 'score-3' : 'score-0';
    h += `<tr><td class="co-label">${esc(p.po)}</td><td style="text-align:left;font-size:.77rem;">${esc(p.name)}</td><td>${p.pct.toFixed(1)}%</td><td class="${lc}">${p.level}</td><td class="${tc}">${p.target_met ? 'Met' : 'Below'}</td></tr>`;
  });
  h += `</tbody></table>`;
  const atr = pos.filter(p => !p.target_met);
  if (atr.length) {
    h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:8px;">Action Taken Report</div>`;
    atr.forEach(p => {
      h += `<div style="font-size:.77rem;margin-bottom:6px;padding:6px 10px;background:rgba(239,68,68,.05);border-radius:6px;border-left:3px solid #ef4444;">
        <strong>${esc(p.po)}</strong> <span style="color:var(--muted);">(${esc(p.name)})</span>: ${esc(p.atr || '')}
      </div>`;
    });
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

function _aioApplyToolConfig(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = '↺ Apply & Regenerate'; } };

  if (_aioCurrentRichTool === 'sdgco') {
    const checked = _ALL_SDGS.filter(s => {
      const el = document.getElementById(`aio-sdgchk-${s.replace(/ /g,'_')}`);
      return el && el.checked;
    });
    if (!checked.length) { showErr('aio-tool-err', 'Select at least one SDG.'); restore(); return; }
    _aioSdgCoSelected = checked.length === _ALL_SDGS.length ? null : checked;

  } else if (_aioCurrentRichTool === 'coatt') {
    const t1 = parseFloat(document.getElementById('aio-coatt-t1').value);
    const t2 = parseFloat(document.getElementById('aio-coatt-t2').value);
    const t3 = parseFloat(document.getElementById('aio-coatt-t3').value);
    if ([t1,t2,t3].some(v => isNaN(v)||v<0||v>100)) { showErr('aio-tool-err', 'Thresholds must be 0–100.'); restore(); return; }
    if (!(t1 > t2 && t2 > t3)) { showErr('aio-tool-err', 'Level 3 > Level 2 > Level 1 required.'); restore(); return; }
    _aioCoAttThresholds = { t1, t2, t3 };

  } else if (_aioCurrentRichTool === 'poatt') {
    const thr = parseFloat(document.getElementById('aio-poatt-threshold').value);
    if (isNaN(thr) || thr < 0 || thr > 100) { showErr('aio-tool-err', 'Threshold must be 0–100.'); restore(); return; }
    _aioPoAttTarget = thr;
  }

  restore();
  document.getElementById('aio-tool-details').removeAttribute('open');
  document.getElementById('aio-tool-arrow').textContent = '▶';
  aioRegen();
}

}

        cos, course: S.selected || '',
        pomap_rows: pomapRows,
        co_results: coResults,
        target_threshold: _aioPoAttTarget,
      }),
    });
    const d = await r.json();
    if (d.error) { _stopFakeProgress('aio-run-progress'); _aioStepErr(d.error); return; }
    _stopFakeProgress('aio-run-progress', () => _aioOnDone('poatt', _buildPoAttPreview(d), d));
  } catch(e) {
    _stopFakeProgress('aio-run-progress');
    _aioStepErr('Failed: ' + e.message);
  }
}

function _buildPoAttPreview(d) {
  const pos = d.po_attainment || [];
  const sum = d.summary || {};
  let txt = `PO Attainment  (NBA Method)\n\n`;
  txt += `${'PO'.padEnd(6)}  ${'Name'.padEnd(32)}  ${'Att%'.padEnd(7)}  Lvl  Target\n${'─'.repeat(60)}\n`;
  pos.forEach(p => {
    txt += `${p.po.padEnd(6)}  ${p.name.slice(0,32).padEnd(32)}  ${p.pct.toFixed(1).padEnd(7)}  ${p.level}    ${p.target_met ? 'Met' : 'Below'}\n`;
  });
  txt += `\nMean: ${sum.mean_pct || 0}%   Met: ${sum.pos_meeting_target || 0}/${pos.length}`;
  const atrRows = pos.filter(p => !p.target_met);
  if (atrRows.length) {
    txt += '\n\nAction Taken Report:\n';
    atrRows.forEach(p => { txt += `  ${p.po}: ${p.atr}\n`; });
  }
  return txt;
}

// ── Reusable branded confirm modal + busy overlay (replaces native confirm/alert) ──
function uiConfirm(opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const prev = document.activeElement;
    const scrim = document.createElement('div');
    scrim.className = 'ui-overlay';
    scrim.setAttribute('role', 'dialog');
    scrim.setAttribute('aria-modal', 'true');
    scrim.setAttribute('aria-labelledby', 'ui-modal-title');
    const noteHtml = opts.note
      ? `<div class="ui-modal-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>${esc(opts.note)}</span></div>`
      : '';
    scrim.innerHTML = `
      <div class="ui-modal" role="document">
        <div class="ui-modal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        </div>
        <h3 class="ui-modal-title" id="ui-modal-title">${esc(opts.title || 'Are you sure?')}</h3>
        <p class="ui-modal-body">${esc(opts.body || '')}</p>
        ${noteHtml}
        <div class="ui-modal-actions">
          <button class="btn btn-ghost"   data-act="cancel">${esc(opts.cancelText || 'Cancel')}</button>
          <button class="btn btn-primary" data-act="ok">${esc(opts.confirmText || 'Confirm')}</button>
        </div>
      </div>`;
    document.body.appendChild(scrim);
    requestAnimationFrame(() => scrim.classList.add('show'));

    const okBtn = scrim.querySelector('[data-act="ok"]');
    const cancelBtn = scrim.querySelector('[data-act="cancel"]');
    let done = false;
    function close(result) {
      if (done) return;
      done = true;
      document.removeEventListener('keydown', onKey, true);
      scrim.classList.remove('show');
      setTimeout(() => { scrim.remove(); try { prev && prev.focus(); } catch (e) {} }, 200);
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(false); }
      else if (e.key === 'Enter') { e.preventDefault(); close(true); }
      else if (e.key === 'Tab') {        // simple focus trap between the two buttons
        const f = [cancelBtn, okBtn];
        const i = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
      }
    }
    okBtn.addEventListener('click', () => close(true));
    cancelBtn.addEventListener('click', () => close(false));
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) close(false); });
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => okBtn.focus(), 60);
  });
}

const uiBusy = {
  _el: null, _timer: null, _i: 0,
  show(opts) {
    opts = opts || {};
    const steps = (opts.steps && opts.steps.length) ? opts.steps : ['Working…'];
    this.hide();
    const scrim = document.createElement('div');
    scrim.className = 'ui-overlay';
    scrim.setAttribute('role', 'alertdialog');
    scrim.setAttribute('aria-busy', 'true');
    scrim.innerHTML = `
      <div class="ui-busy-card">
        <div class="spinner dark" aria-hidden="true"></div>
        <p class="ui-busy-title">${esc(opts.title || 'Working…')}</p>
        <p class="ui-busy-status" aria-live="polite">${esc(steps[0])}</p>
        <div class="uni-progress" style="margin:0;">
          <div class="uni-progress-track"><div class="uni-progress-fill is-indeterminate"></div></div>
        </div>
        <p class="ui-busy-hint">${esc(opts.hint || 'This can take up to a minute. Please keep this tab open.')}</p>
      </div>`;
    document.body.appendChild(scrim);
    requestAnimationFrame(() => scrim.classList.add('show'));
    this._el = scrim;
    this._i  = 0;
    const statusEl = scrim.querySelector('.ui-busy-status');
    if (steps.length > 1) {
      this._timer = setInterval(() => {
        this._i = Math.min(steps.length - 1, this._i + 1);
        statusEl.style.opacity = '0';
        setTimeout(() => { statusEl.textContent = steps[this._i]; statusEl.style.opacity = '1'; }, 220);
        if (this._i >= steps.length - 1) { clearInterval(this._timer); this._timer = null; }
      }, opts.stepMs || 7000);
    }
  },
  hide() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    const el = this._el; this._el = null;
    if (el) { el.classList.remove('show'); setTimeout(() => el.remove(), 200); }
  },
};

async function _m1ApplyTip(idx) {
  const a = _m1ImproveActions[idx];
  if (!a) return;
  const tgtLabel = a.target === 'cos' ? 'Course Outcomes' : 'Question Bank';

  const ok = await uiConfirm({
    title:       `Apply the "${a.metric}" fix?`,
    body:        `This regenerates your ${tgtLabel} with AI and rebuilds the whole report — analytics, QQI and accreditation update too.`,
    note:        'Uses about 4 tokens. You can undo this afterwards.',
    confirmText: 'Apply & rebuild',
    cancelText:  'Cancel',
  });
  if (!ok) return;

  const list = document.getElementById('m1-improve-list');
  list.querySelectorAll('button').forEach(b => b.disabled = true);
  uiBusy.show({
    title: 'Improving your report',
    steps: [
      `Regenerating ${tgtLabel} with AI…`,
      'Recomputing analytics and QQI…',
      'Rebuilding the report…',
      'Almost there…',
    ],
    stepMs: 9000,
  });

  try {
    const r = await fetch('/m1_apply_tip', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: a.target, tip: a.tip, metric: a.metric }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Apply failed');
    await _previewModule1Report(null);   // re-fetch, re-render, reload actions + undo bar
    showToast(`Applied. Report rebuilt from the updated ${tgtLabel}.`, 'success');
  } catch (e) {
    showToast(e.message, 'error');
    list.querySelectorAll('button').forEach(b => b.disabled = false);
  } finally {
    uiBusy.hide();
    refreshTokenBadge();
  }
}

async function _m1Rephrase() {

function _m1ApplyRephrase() {

  // Restore selection and replace

  sel.removeAllRanges();
  sel.addRange(_m1SavedRange);
  const range = sel.getRangeAt(0);

  range.insertNode(document.createTextNode(_m1RephraseVal));

async function _m1AskAI() {

async function _m1ApplyToReport() {
  if (!_m1AiAnswerText || !_m1AiSelectedText) return;

  const applyBtn = document.getElementById('m1-apply-btn');
  if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = 'Rewriting…'; }
  document.getElementById('m1-ai-status').textContent = 'Rewriting section…';

  try {
    const r = await fetch('/m1_report_apply_suggestion', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ original: _m1AiSelectedText, advice: _m1AiAnswerText }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    const div = document.getElementById('m1-report-preview-div');
    _m1UndoData = div.innerHTML;   // snapshot for undo

    // Restore selection and replace with rewritten content
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(_m1AiAnswerRange);
    const range = sel.getRangeAt(0);
    range.deleteContents();

    // Insert rewritten text, preserving line breaks as <br>
    const frag = document.createDocumentFragment();
    d.rewritten.split('\n').forEach((line, i) => {
      if (i > 0) frag.appendChild(document.createElement('br'));
      frag.appendChild(document.createTextNode(line));
    });
    range.insertNode(frag);
    sel.removeAllRanges();

    _m1AiAnswerRange  = null;
    _m1AiSelectedText = '';
    document.getElementById('m1-undo-bar').style.display = '';
    document.getElementById('m1-ai-status').textContent = 'Done. Review the changes, then download.';
    document.getElementById('m1-ai-answer').innerHTML =
      '<div style="color:#15803d;font-size:.8rem;padding:6px 0;text-align:center;">✓ Section rewritten successfully.</div>';
  } catch (e) {
    document.getElementById('m1-ai-status').textContent = 'Error: ' + e.message;
    if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = '✏ Apply to Selected Section'; }
  }
}

function _moduleRenderImprove(mod, suggestions) {

  const isOpen  = !panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed', isOpen);
  if (toggle) toggle.textContent = isOpen ? '▶' : '◄';
}

async function _m4Rephrase() {
  const btn      = document.getElementById('m4-rephrase-btn');
  const statusEl = document.getElementById('m4-ai-status');
  const outputEl = document.getElementById('m4-rephrase-output');

  const sel  = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text || text.length < 5) {
    statusEl.textContent = 'Select some text in the report first.';
    return;
  }
  const div   = document.getElementById('m4-report-preview-div');
  const inDiv = sel.rangeCount > 0 && div.contains(sel.getRangeAt(0).startContainer);
  if (!inDiv) { statusEl.textContent = 'Select text inside the report.'; return; }
  _m4SavedRange = sel.getRangeAt(0).cloneRange();

  btn.disabled = true;
  statusEl.innerHTML = '<span class="ai-spin">↻</span> Rephrasing…';
  outputEl.innerHTML = '';
  try {
    const r = await fetch('/m1_report_apply_suggestion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ original: text, advice: 'Improve clarity, precision, and academic tone for an NBA/NAAC assessment report.' }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    _m4RephraseVal = d.rewritten;
    statusEl.textContent = 'Click Apply to replace the selection.';
    outputEl.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:.8rem;line-height:1.5;margin-top:6px;background:rgba(5,150,105,.04);">
        ${esc(_m4RephraseVal)}
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn btn-primary" style="font-size:.75rem;padding:4px 12px;background:#059669;border-color:#059669;" onclick="_m4ApplyRephrase()">Apply</button>
        <button class="btn btn-ghost"   style="font-size:.75rem;padding:4px 12px;" onclick="_m4RephraseVal=null;document.getElementById('m4-rephrase-output').innerHTML='';document.getElementById('m4-ai-status').textContent='Discarded.';">Discard</button>
      </div>`;
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    refreshTokenBadge();
  }
}

function _m4ApplyRephrase() {
  if (!_m4SavedRange || !_m4RephraseVal) return;
  const div = document.getElementById('m4-report-preview-div');
  _m4UndoData = div.innerHTML;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(_m4SavedRange);
  if (!document.execCommand('insertText', false, _m4RephraseVal)) {
    _m4SavedRange.deleteContents();
    _m4SavedRange.insertNode(document.createTextNode(_m4RephraseVal));
  }
  _m4RephraseVal = null;
  document.getElementById('m4-rephrase-output').innerHTML = '';
  document.getElementById('m4-ai-status').textContent = 'Applied. Use Undo to revert.';
  document.getElementById('m4-undo-bar').style.display = '';
}

function _m4UndoRephrase() {
  if (_m4UndoData === null) return;
  document.getElementById('m4-report-preview-div').innerHTML = _m4UndoData;
  _m4UndoData = null;
  document.getElementById('m4-undo-bar').style.display = 'none';
  document.getElementById('m4-ai-status').textContent = 'Undo complete.';
}

async function _m4AskAI() {
  const question = (document.getElementById('m4-ai-question').value || '').trim();
  const statusEl = document.getElementById('m4-ai-status');
  const answerEl = document.getElementById('m4-ai-answer');
  const btn      = document.getElementById('m4-ask-btn');
  if (!question) { statusEl.textContent = 'Type a question first.'; return; }

  const sel   = window.getSelection();
  const div   = document.getElementById('m4-report-preview-div');
  const inDiv = sel && sel.rangeCount > 0 && div.contains(sel.getRangeAt(0).startContainer);
  const ctx   = inDiv ? sel.toString().trim() : '';

  btn.disabled = true;
  statusEl.innerHTML = '<span class="ai-spin">↻</span> Thinking…';
  answerEl.innerHTML = '';
  try {
    const r = await fetch('/m1_report_ai_suggest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, context: ctx }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    statusEl.textContent = 'Answer:';
    answerEl.innerHTML = `<div style="border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:.8rem;line-height:1.55;margin-top:6px;white-space:pre-wrap;">${esc(d.answer)}</div>`;
  } catch(e) {
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    refreshTokenBadge();
  }
}

async function downloadM4Report() {
  const btn    = document.getElementById('btn-dl-m4-report');
  const errDiv = document.getElementById('m4-preview-err');
  errDiv.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Downloading…';
  const fmt = S.m4PreviewFmt || 'docx';
  const _m4EstMs = fmt === 'txt' ? 4000 : 45000;
  const _m4Labels = fmt === 'txt' ? ['Preparing text…', 'Almost ready…']
                                   : ['Building charts…', 'Generating document…', 'Formatting…', 'Packaging…', 'Almost ready…'];
  _startFakeProgress('dl-m4-progress', _m4EstMs, _m4Labels);

  try {
    let r;
    if (fmt === 'txt') {
      const div = document.getElementById('m4-report-preview-div');
      r = await fetch('/download_paper_from_text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: div.innerText, fmt, label: 'Report', filename: 'Module4' }),
      });
    } else {
      r = await fetch('/generate_module4_report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fmt,
          course:     S.selected || '',
          pomap_rows: _aio.results['pomap'] || [],
          coatt:      _aio.results['coatt'] || {},
          poatt:      _aio.results['poatt'] || {},
          sdgco:      _aio.results['sdgco'] || {},
          sdgpo:      _aio.results['sdgpo'] || {},
        }),
      });
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || 'Download failed');
    }
    const blob   = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const a      = document.createElement('a');
    a.href = objUrl;
    a.download = `Module4_Report.${fmt}`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(objUrl); a.remove(); }, 2000);
  } catch(e) {
    showErr('m4-preview-err', e.message);
  } finally {
    _stopFakeProgress('dl-m4-progress');
    btn.disabled = false;
    btn.textContent = '⬇ Download Report';
  }
}

async function _aioDownload(toolId, fmt) {
  const code = S.selected || '';
  let url, bodyData;

  switch (toolId) {
    case 'cos':
      url      = '/export_coatt_cos';
      bodyData = { fmt, cos: _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement })), code };
      break;
    case 'qbank':
      url = '/export_qbank'; bodyData = { fmt }; break;
    case 'pomap':
      url = '/export_po_mapping'; bodyData = { fmt, rows: _aio.results['pomap'] }; break;
    case 'lessonplan':
      url = '/export_lp'; bodyData = { fmt }; break;
    case 'teachingdiary':
      url = '/export_td'; bodyData = { fmt }; break;
    case 'sdgco': {
      const res = _aio.results[toolId] || {};
      if (res.matrix) {
        url = '/export_sdg_co_all';
        bodyData = { fmt, data: { ...res, course: S.selected || '', courseTitle: '' } };
      } else {
        url = '/export_sdg_co';
        bodyData = { fmt, data: res };
      }
      break;
    }
    case 'sdgpo':
      url = '/export_sdg_po'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    case 'coatt':
      url = '/export_co_attainment'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    case 'poatt':
      url = '/export_po_attainment'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    default: return;
  }

  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bodyData),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      alert(d.error || 'Download failed');
      return;
    }
    const blob = await r.blob();
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `${code}_${toolId}.${fmt}`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {
    alert('Download failed: ' + e.message);
  }
}
