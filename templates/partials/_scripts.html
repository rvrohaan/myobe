function _activePoKeys(rows) {
  const STD = {'PO1':0,'PO2':1,'PO3':2,'PO4':3,'PO5':4,'PO6':5,
               'PO7':6,'PO8':7,'PO9':8,'PO10':9,'PO11':10,'PO12':11};
  const _sort = keys => [...keys].sort((a, b) => {
    const oa = STD[a] ?? 999, ob = STD[b] ?? 999;
    return oa !== ob ? oa - ob : a.localeCompare(b);
  });

  if (S.poConfiguredKeys && S.poConfiguredKeys.length) {
    // User explicitly chose these POs — show ALL of them (zeros included) in their chosen order
    return _sort(S.poConfiguredKeys);
  }

  // Default (initial auto-gen): show only POs with at least one non-zero score
  const seen = new Set(), keys = [];
  rows.forEach(r => Object.keys(r.scores).forEach(k => { if (!seen.has(k)) { seen.add(k); keys.push(k); } }));
  const active = _sort(keys).filter(k => rows.some(r => (r.scores[k] || 0) > 0));
  return active.length ? active : _sort(keys);
}

function renderPoInlineResult(showTicks) {
  const rows = S.poMapRows;
  if (!rows || !rows.length) return;

  const pos = _activePoKeys(rows);

  const hdrCells = pos.map(k => `<th>${k}</th>`).join('');
  const dataRows = rows.map(r => {
    const cells = pos.map(k => {
      const v = r.scores[k] || 0;
      const cls = v === 3 ? 'score-3' : v === 2 ? 'score-2' : v === 1 ? 'score-1' : 'score-0';
      const label = showTicks ? (v ? '✓' : '–') : (v || '–');
      return `<td class="${cls}">${label}</td>`;
    }).join('');
    return `<tr><td class="co-label">${esc(r.co)}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('po-inline-map').innerHTML =
    `<table class="po-map-table">
       <thead><tr><th class="co-hdr">CO \\ PO</th>${hdrCells}</tr></thead>
       <tbody>${dataRows}</tbody>
     </table>`;

  const sumEl = document.getElementById('po-inline-summary');
  if (showTicks) {
    let mapped = 0;
    rows.forEach(r => Object.values(r.scores).forEach(v => { if (v) mapped++; }));
    sumEl.innerHTML = `<strong>Mapped:</strong> ${mapped} CO–PO pair${mapped !== 1 ? 's' : ''} &nbsp;·&nbsp; <span style="color:var(--muted);font-size:.8rem;">Adjust POs below and regenerate to see levels</span>`;
  } else {
    let m3=0, m2=0, m1=0, m0=0;
    rows.forEach(r => Object.values(r.scores).forEach(v => {
      if (v===3) m3++; else if (v===2) m2++; else if (v===1) m1++; else m0++;
    }));
    const parts = [];
    if (m3) parts.push(`<strong>Major (3):</strong> ${m3}`);
    if (m2) parts.push(`<strong>Moderate (2):</strong> ${m2}`);
    if (m1) parts.push(`<strong>Minor (1):</strong> ${m1}`);
    parts.push(`None (0): ${m0}`);
    sumEl.innerHTML = parts.join(' &nbsp;·&nbsp; ');
  }
  sumEl.classList.remove('hidden');
}

function startLpGenerate() {
  if (!S.lpSelected) {
    showErr('lp-config-err', 'No course selected.'); return;
  }
  if (S.lpCoTab === 'upload' && !S.lpUploadedCos) {
    showErr('lp-config-err', 'Please upload a CO file, or switch to "Auto-generate from syllabus".'); return;
  }
  const numCos   = document.getElementById('lp-num-cos').value;
  const faculty  = document.getElementById('lp-faculty').value.trim() || 'Dr. Faculty';
  const acYear   = document.getElementById('lp-acyear').value.trim() || '2026–2027';
  const semester = document.getElementById('lp-semester').value.trim() || 'III Semester';
  const reg      = document.getElementById('lp-regulation').value.trim() || 'R26';
  const program  = document.getElementById('lp-program').value.trim() || 'B.Tech – CSE';
  const ctype    = document.getElementById('lp-course-type').value;
  const credits  = document.getElementById('lp-credits').value.trim() || '4';
  const ltp      = document.getElementById('lp-ltp').value.trim() || '3-0-2';
  const dept     = document.getElementById('lp-dept').value.trim() || 'Department of Computer Science and Engineering';

  document.getElementById('lp-config-err').classList.add('hidden');
  showSection('lp-generating'); setStepBar(4);
  _startFakeProgress('lp-gen-progress', 35000, [
    'Analysing syllabus…', 'Generating Course Outcomes…', 'Building session plan…',
    'Mapping CO–PO–SDG…', 'Compiling all sections…', 'Finalising lesson plan…'
  ]);

  const params = new URLSearchParams({
    code: S.lpSelected,
    num_cos: numCos,
    use_uploaded_cos: S.lpCoTab === 'upload' ? 'true' : 'false',
    faculty_name: faculty,
    academic_year: acYear,
    semester: semester,
    regulation: reg,
    program: program,
    course_type: ctype,
    credits: credits,
    ltp: ltp,
    department: dept,
  });

  const es = new EventSource(`/generate_lp?${params}`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.error) {
      es.close();
      _stopFakeProgress('lp-gen-progress');
      showSection('lp-config'); setStepBar(3);
      showErr('lp-config-err', d.error);
      return;
    }
    if (d.progress) {
      document.getElementById('lp-gen-status').textContent = d.progress;
    }
    if (d.done) {
      es.close();
      refreshTokenBadge();
      renderLpPreview(d.data);
      saveHistory('lessonplan');
      _stopFakeProgress('lp-gen-progress', () => { showSection('lp-result'); setStepBar(5); });
    }
  };
  es.onerror = () => {
    es.close();
    _stopFakeProgress('lp-gen-progress');
    showSection('lp-config'); setStepBar(3);
    showErr('lp-config-err', 'Connection error. Please try again.');
  };
}

  el.style.background = 'rgba(99,102,241,.1)';

  const itemType = el.dataset.itemType;
  const num      = +el.dataset.itemNum;
  const bloom    = el.dataset.bloom    || '';
  const coRef    = el.dataset.coRef    || '';
  const sdg      = el.dataset.sdg      || '';
  const method   = el.dataset.method   || '';
  const textNode = el.querySelector('.lp-item-text');
  const text     = textNode ? textNode.textContent.trim() : el.textContent.trim();

  _lpAiItem = { item_type: itemType, num, text, bloom, co_ref: coRef, sdg, method, node: textNode };
}

async function _runLpAiReview() {
  if (_lpAiAnalysing) return;
  if (!_lpAiItem) {
    _lpSetAiStatus('Click a CO or session row first, then press Analyse.');
    return;
  }
  _lpAiAnalysing = true;
  const btn = document.getElementById('lp-ai-analyse-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Analysing…'; }
  _lpSetAiStatus('<span class="ai-spin">↻</span> Analysing…');
  document.getElementById('lp-ai-suggestions-list').innerHTML = '';

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 22000);

  try {
    const r = await fetch('/lp_ai_review', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        item_type: _lpAiItem.item_type,
        text:      _lpAiItem.text,
        bloom:     _lpAiItem.bloom,
        co_ref:    _lpAiItem.co_ref,
        sdg:       _lpAiItem.sdg,
        method:    _lpAiItem.method,
      }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();
    if (r.status === 504 || data.error === 'timeout') {
      _lpSetAiStatusRetry('Request timed out — check your connection.');
    } else if (r.status === 503 || data.error === 'connection') {
      _lpSetAiStatusRetry('Could not reach the server.');
    } else if (data.error && !data.suggestions?.length) {
      _lpSetAiStatusRetry('Error: ' + data.error);
    } else {
      _lpSetAiStatus('');
      _renderLpAiSuggestions(data.suggestions || []);
    }
  } catch (e) {
    clearTimeout(timeoutId);
    _lpSetAiStatusRetry(e.name === 'AbortError' ? 'Timed out after 20 s.' : 'Network error.');
  } finally {
    _lpAiAnalysing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Analyse'; }
  }
}

async function _runLpAiRephrase() {
  if (!_lpAiItem) {
    _lpShowRephrase(null, 'Click a CO or session row first, then press Rephrase.');
    return;
  }
  const btn = document.getElementById('lp-ai-rephrase-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Rephrasing…'; }
  document.getElementById('lp-ai-rephrase-output').innerHTML =
    '<div class="ai-status-msg"><span class="ai-spin">↻</span> Rephrasing…</div>';

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 22000);

  try {
    const r = await fetch('/lp_ai_rephrase', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        item_type: _lpAiItem.item_type,
        text:      _lpAiItem.text,
        bloom:     _lpAiItem.bloom,
        co_ref:    _lpAiItem.co_ref,
      }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();
    if (r.status === 504) _lpShowRephrase(null, 'Request timed out.');
    else if (r.status === 503) _lpShowRephrase(null, 'Could not reach the server.');
    else if (data.error) _lpShowRephrase(null, 'Error: ' + data.error);
    else _lpShowRephrase(data.rephrased, null);
  } catch (e) {
    clearTimeout(timeoutId);
    _lpShowRephrase(null, e.name === 'AbortError' ? 'Timed out.' : 'Network error.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Rephrase'; }
  }
}

function _lpShowRephrase(text, error) {
  const out = document.getElementById('lp-ai-rephrase-output');
  if (!out) return;
  if (error) {
    out.innerHTML = `<div class="ai-status-msg" style="color:#ef4444">${esc(error)}</div>`;
    return;
  }
  // Directly apply to DOM node and persist to server
  if (_lpAiItem && _lpAiItem.node && text) {
    _lpAiUndoText = _lpAiItem.text;
    _lpAiUndoNode = _lpAiItem.node;
    _lpAiItem.node.textContent = text;
    _lpAiItem.text = text;
    _lpPersistEdit();
    const undoBar = document.getElementById('lp-ai-undo-bar');
    if (undoBar) undoBar.style.display = 'block';
    out.innerHTML = '<div class="ai-status-msg" style="color:#15803d">✓ Applied.</div>';
    return;
  }
  out.innerHTML =
    '<div style="font-size:.75rem;color:#6b7280;margin-bottom:4px;">Rephrased — click to select &amp; copy:</div>' +
    `<textarea class="ai-rephrase-box" rows="4" readonly onclick="this.select()">${esc(text)}</textarea>`;
}

function _renderLpAiSuggestions(suggestions) {
  _lpSetAiStatus('');
  const list = document.getElementById('lp-ai-suggestions-list');
  if (!list) return;

  const LABELS = {
    clarity:         '✏️ Clarity',
    blooms_alignment:'📊 Bloom\'s Level',
    obe_compliance:  '🎓 OBE Compliance',
    co_alignment:    '🎯 CO Alignment',
    sdg_relevance:   '🌍 SDG Relevance',
    method_fit:      '🧑‍🏫 Method Fit',
  };

  if (!suggestions.length) {
    list.innerHTML = '<div class="ai-status-msg">No issues found.</div>';
    return;
  }

  list.innerHTML = suggestions.map(s => {
    const safeType = esc(s.type || '');
    const safeMsg  = esc(s.message || '');
    return `<div class="ai-card ${s.level || 'ok'}" data-clickable
                 data-type="${safeType}" data-msg="${safeMsg}"
                 onclick="_applyLpAiSuggestion(this)">
      <div class="ai-card-label">${LABELS[s.type] || esc(s.type)}</div>
      <div class="ai-card-body">${safeMsg}</div>
      <div class="ai-apply-hint">Click to apply this fix</div>
    </div>`;
  }).join('');
}

async function _applyLpAiSuggestion(cardEl) {
  const message = cardEl.dataset.msg;
  if (!_lpAiItem) {
    _lpSetAiStatus('No item selected — click a CO or session row first.');
    return;
  }
  const hintEl = cardEl.querySelector('.ai-apply-hint');
  hintEl.innerHTML = '<span class="ai-spin" style="margin-right:4px;">↻</span>Applying…';
  cardEl.classList.add('applying');

  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 22000);

  try {
    const r = await fetch('/lp_ai_apply', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        item_type:          _lpAiItem.item_type,
        text:               _lpAiItem.text,
        bloom:              _lpAiItem.bloom,
        co_ref:             _lpAiItem.co_ref,
        suggestion_message: message,
      }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await r.json();
    if (data.error) { hintEl.textContent = '✗ ' + data.error; return; }

    if (_lpAiItem.node) {
      _lpAiUndoText = _lpAiItem.text;
      _lpAiUndoNode = _lpAiItem.node;
      _lpAiItem.node.textContent = data.improved;
      _lpAiItem.text = data.improved;
      _lpPersistEdit();
      const undoBar = document.getElementById('lp-ai-undo-bar');
      if (undoBar) undoBar.style.display = 'block';
      hintEl.textContent = '✓ Applied';
    } else {
      const out = document.getElementById('lp-ai-rephrase-output');
      if (out) out.innerHTML =
        '<div style="font-size:.75rem;color:#6b7280;margin-bottom:4px;">Improved (copy manually):</div>' +
        `<textarea class="ai-rephrase-box" rows="4" readonly onclick="this.select()">${esc(data.improved)}</textarea>`;
      hintEl.textContent = '↑ See above';
    }
  } catch (e) {
    clearTimeout(timeoutId);
    hintEl.textContent = e.name === 'AbortError' ? '✗ Timed out' : '✗ Network error';
  } finally {
    cardEl.classList.remove('applying');
  }
}

function _undoLpAiApply() {
  if (!_lpAiUndoNode || _lpAiUndoText === null) return;
  _lpAiUndoNode.textContent = _lpAiUndoText;
  if (_lpAiItem) {
    _lpAiItem.text = _lpAiUndoText;
    _lpPersistEdit();
  }
  _lpAiUndoText = null;
  _lpAiUndoNode = null;
  document.getElementById('lp-ai-undo-bar').style.display = 'none';
  document.querySelectorAll('#lp-ai-suggestions-list .ai-apply-hint').forEach(el => {
    el.textContent = 'Click to apply this fix';
  });
}

function _lpPersistEdit() {
  if (!_lpAiItem) return;
  fetch('/lp_patch_item', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ item_type: _lpAiItem.item_type, num: _lpAiItem.num, new_text: _lpAiItem.text }),
  }).catch(() => {});   // best-effort: don't disrupt the UI on network error
}

function _lpSetAiStatus(html) {
  const el = document.getElementById('lp-ai-status');
  if (el) el.innerHTML = html;
}

function _lpSetAiStatusRetry(msg) {
  const el = document.getElementById('lp-ai-status');
  if (el) el.innerHTML =
    `<span style="color:#ef4444">${esc(msg)}</span>` +
    `<br><button class="btn btn-ghost" style="margin-top:6px;font-size:.75rem;padding:3px 10px;"` +
    ` onclick="_runLpAiReview()">↻ Retry</button>`;
}

function startTdGenerate() {
  if (!S.tdSelected) { showErr('td-config-err', 'No course selected.'); return; }
  if (S.tdCoTab === 'upload' && !S.tdUploadedCos) {
    showErr('td-config-err', 'Please upload a CO file, or switch to "Auto-generate from syllabus".'); return;
  }
  const numCos      = document.getElementById('td-num-cos').value;
  const faculty     = document.getElementById('td-faculty').value.trim()      || 'Dr. Faculty';
  const acYear      = document.getElementById('td-acyear').value.trim()       || '2026–2027';
  const semester    = document.getElementById('td-semester').value.trim()     || 'III Semester';
  const section     = document.getElementById('td-section').value.trim()      || 'A';
  const reg         = document.getElementById('td-regulation').value.trim()   || 'R26';
  const program     = document.getElementById('td-program').value.trim()      || 'B.Tech – CSE';
  const ctype       = document.getElementById('td-course-type').value;
  const credits     = document.getElementById('td-credits').value.trim()      || '4';
  const ltp         = document.getElementById('td-ltp').value.trim()          || '3-0-2';
  const totalHours  = document.getElementById('td-total-hours').value.trim()  || '45';
  const dept        = document.getElementById('td-dept').value.trim()         || 'Department of Computer Science and Engineering';
  const coordinator = document.getElementById('td-coordinator').value.trim();
  const hod         = document.getElementById('td-hod').value.trim();

  document.getElementById('td-config-err').classList.add('hidden');
  showSection('td-generating'); setStepBar(4);
  _startFakeProgress('td-gen-progress', 50000, [
    'Analysing syllabus…', 'Generating Course Outcomes…', 'Building session delivery plan…',
    'Creating tutorial diary…', 'Compiling CO attainment data…', 'Finalising teaching diary…'
  ]);

  const params = new URLSearchParams({
    code: S.tdSelected, num_cos: numCos,
    faculty_name: faculty, academic_year: acYear, semester, section,
    regulation: reg, program, course_type: ctype, credits, ltp,
    total_hours: totalHours, department: dept, coordinator, hod,
    use_uploaded_cos: S.tdCoTab === 'upload' && S.tdUploadedCos ? 'true' : 'false',
  });

  const es = new EventSource('/generate_td?' + params.toString());
  _addSSETimeout(es, 160000, () => {
    _stopFakeProgress('td-gen-progress');
    showSection('td-config'); setStepBar(3);
    showErr('td-config-err', 'Request timed out — check your connection and try again.');
  });

  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.error) {
      es.close();
      _stopFakeProgress('td-gen-progress');
      showSection('td-config'); setStepBar(3);
      showErr('td-config-err', d.error);
      return;
    }
    if (d.progress) {
      document.getElementById('td-gen-status').textContent = d.progress;
    }
    if (d.done) {
      es.close();
      refreshTokenBadge();
      renderTdPreview(d.data);
      saveHistory('teachingdiary');
      _stopFakeProgress('td-gen-progress', () => { showSection('td-result'); setStepBar(5); });
    }
  };
  es.onerror = () => {
    es.close();
    _stopFakeProgress('td-gen-progress');
    showSection('td-config'); setStepBar(3);
    showErr('td-config-err', 'Connection error. Please try again.');
  };
}

function _rebuildSdgPoWts() {
  _sdgPoWts = {};

    _sdgPoWts[si] = {};

      _sdgPoWts[si][pi] = (_sdgPoWeightsAll[sdg] || {})[po.name] || 0;
    });
  });

function _runSdgPoGeneration() {
  const btn    = document.getElementById('btn-course-next');
  const errEl  = document.getElementById('upload-err');
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'Analysing…';

    if (d.error) { errEl.textContent = d.error; errEl.classList.remove('hidden'); return; }
    refreshTokenBadge();
    _sdgPoPos  = d.pos;
    // Normalise all SDG labels to the canonical _ALL_SDGS names so that
    // dropdown filtering and weightsAll lookups always match.
    _sdgPoWeightsAll = {};
    Object.entries(d.weights_all || {}).forEach(([k, v]) => {
      _sdgPoWeightsAll[_canonicalizeSdg(k)] = v;
    });
    _sdgPoSdgs = (d.sdgs_selected || []).map(_canonicalizeSdg);
    _rebuildSdgPoWts();
    _computeAndShowSdgPo();
  })
  .catch(e => {

// ── Compute + render ──────────────────────────────────────────────────────────

function _computeAndShowSdgPo() {
  const sdgInterp = v =>
    v >= 85 ? 'Excellent SDG Integration' :
    v >= 70 ? 'Strong SDG Contribution'   :
    v >= 50 ? 'Moderate Contribution'     : 'Weak SDG Integration';

  const results = _sdgPoSdgs.map((sdgLabel, si) => {
    const wts = _sdgPoWts[si] || {};
    let num = 0, den = 0;
    _sdgPoPos.forEach((po, pi) => {
      const w = wts[pi] !== undefined ? wts[pi] : 0;
      num += po.attainment * w; den += w;
    });
    const contribution = den > 0 ? Math.round(num / den * 100) / 100 : 0;
    return { sdg: sdgLabel, contribution, interpretation: sdgInterp(contribution) };
  });

  const composite = results.length > 0
    ? Math.round(results.reduce((s,r) => s + r.contribution, 0) / results.length * 100) / 100 : 0;

  _sdgPoResultData = { pos: _sdgPoPos, sdgs: _sdgPoSdgs, weights: JSON.parse(JSON.stringify(_sdgPoWts)), results, composite };

  document.getElementById('sdgpo-result-sub').textContent =
    `${_sdgPoPos.length} POs · ${_sdgPoSdgs.length} SDGs · Course: ${S.selected || ''}`;

  const colorFor = v => v >= 85 ? '#16a34a' : v >= 70 ? '#2563eb' : v >= 50 ? '#d97706' : '#dc2626';
  let tbl = `<table class="po-map" style="width:100%;">
    <thead><tr>
      <th style="text-align:left;padding:8px 12px;">SDG</th>
      <th style="text-align:center;padding:8px 12px;">Contribution (%)</th>
      <th style="text-align:left;padding:8px 12px;">Interpretation</th>
    </tr></thead><tbody>`;
  results.forEach(r => {
    tbl += `<tr>
      <td style="padding:8px 12px;font-weight:600;">${esc(r.sdg)}</td>
      <td style="padding:8px 12px;text-align:center;font-weight:800;color:${colorFor(r.contribution)};">${r.contribution.toFixed(2)}%</td>
      <td style="padding:8px 12px;font-size:.83rem;">${esc(r.interpretation)}</td></tr>`;
  });
  document.getElementById('sdgpo-results-wrap').innerHTML = tbl + '</tbody></table>';
  document.getElementById('sdgpo-composite-val').textContent   = `${composite.toFixed(2)}%`;
  document.getElementById('sdgpo-composite-interp').textContent = `(${sdgInterp(composite)})`;

  _renderSdgPoResultSdgChips();
  saveHistory('sdgpo');
  showSection('sdgpo-result'); setStepBar(3);
}

const _ALL_SDGS = [
  'SDG 1 — No Poverty',
  'SDG 2 — Zero Hunger',
  'SDG 3 — Good Health and Well-being',
  'SDG 4 — Quality Education',
  'SDG 5 — Gender Equality',
  'SDG 6 — Clean Water and Sanitation',
  'SDG 7 — Affordable and Clean Energy',
  'SDG 8 — Decent Work and Economic Growth',
  'SDG 9 — Industry, Innovation and Infrastructure',
  'SDG 10 — Reduced Inequalities',
  'SDG 11 — Sustainable Cities and Communities',
  'SDG 12 — Responsible Consumption and Production',
  'SDG 13 — Climate Action',
  'SDG 14 — Life Below Water',
  'SDG 15 — Life on Land',
  'SDG 16 — Peace, Justice and Strong Institutions',
  'SDG 17 — Partnerships for the Goals',
];

// Normalize any SDG label (short or variant) to a canonical _ALL_SDGS entry
function _canonicalizeSdg(label) {
  const m = String(label).match(/SDG\s*(\d+)/i);
  if (!m) return label;
  const n = parseInt(m[1], 10);
  return _ALL_SDGS[n - 1] || label;
}

function _renderSdgPoResultSdgChips() {
  const el = document.getElementById('sdgpo-result-sdg-chips');
  if (!el) return;
  el.innerHTML = _sdgPoSdgs.map((sdg, i) => `
    <span style="display:inline-flex;align-items:center;gap:5px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:600;">
      ${esc(sdg)}
      <button onclick="_sdgPoResultRemoveSdg(${i})" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:.85rem;padding:0;line-height:1;margin-left:2px;">×</button>
    </span>`).join('');
  // Populate the "Add SDG" dropdown with remaining SDGs
  const sel = document.getElementById('sdgpo-result-sdg-add');
  if (!sel) return;
  const remaining = _ALL_SDGS.filter(s => !_sdgPoSdgs.includes(s));
  sel.innerHTML = '<option value="">+ Add SDG</option>' +
    remaining.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

function _sdgPoResultRemoveSdg(idx) {
  if (_sdgPoSdgs.length <= 1) return;
  _sdgPoSdgs.splice(idx, 1);
  _rebuildSdgPoWts();
  _computeAndShowSdgPo();
}

function sdgPoResultAddSdg(sel) {
  const sdg = sel.value;
  if (!sdg || _sdgPoSdgs.includes(sdg)) { sel.value = ''; return; }

  // If AI already analysed this SDG, add instantly
  if (sdg in _sdgPoWeightsAll) {
    _sdgPoSdgs.push(sdg);
    _rebuildSdgPoWts();
    _computeAndShowSdgPo();
    sel.value = '';
    return;
  }

  // Otherwise fetch weights from AI on-demand (no token deducted)
  sel.disabled = true;
  const errEl     = document.getElementById('sdgpo-result-err');
  const loadEl    = document.getElementById('sdgpo-sdg-loading');
  const loadLabel = document.getElementById('sdgpo-sdg-loading-label');
  const wrapEl    = document.getElementById('sdgpo-results-wrap');
  errEl.classList.add('hidden');
  if (loadEl)    { loadEl.style.display = 'flex'; loadEl.classList.remove('hidden'); }
  if (loadLabel) loadLabel.textContent = `Analysing ${sdg}…`;
  if (wrapEl)    wrapEl.style.opacity = '0.35';

  const _done = () => {
    sel.disabled = false; sel.value = '';
    if (loadEl) loadEl.classList.add('hidden');
    if (wrapEl) wrapEl.style.opacity = '';
  };

  fetch('/generate_po_sdg_weights', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({course: S.selected, sdg}),
  })
  .then(r => r.json())
  .then(d => {
    _done();
    if (d.error) { errEl.textContent = d.error; errEl.classList.remove('hidden'); return; }
    _sdgPoWeightsAll[sdg] = d.weights;
    _sdgPoSdgs.push(sdg);
    _rebuildSdgPoWts();
    _computeAndShowSdgPo();
  })
  .catch(e => {
    _done();
    errEl.textContent = 'Failed to fetch SDG weights: ' + e.message;
    errEl.classList.remove('hidden');
  });
}

function recalculateSdgPo() {

function _handleSdgCoFileUpload(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['txt','docx','doc','pdf'].includes(ext)) {
    showErr('sdgco-cos-err', `Unsupported type ".${ext}". Use TXT, DOCX, or PDF.`); return;

  document.getElementById('sdgco-cos-err').classList.add('hidden');
  document.getElementById('sdgco-cos-review').classList.add('hidden');
  document.getElementById('btn-sdgco-proceed').disabled = true;
  document.getElementById('sdgco-co-upload-zone').style.pointerEvents = 'none';
  const fd = new FormData();
  fd.append('file', file);
  _xhrUpload('/upload_co_qbank', fd, {
    progressId: 'sdgco-co-upload-loading', uploadLabel: 'Uploading CO file…',
    processMs: 4000, processLabels: ['Parsing CO file…', 'Reading outcomes…', 'Almost done…'],
    onSuccess: d => { document.getElementById('sdgco-co-upload-zone').style.pointerEvents = ''; _sdgCoParsedCos = d.cos; _renderSdgCoCosReview(d.cos); },
    onError:   m => { document.getElementById('sdgco-co-upload-zone').style.pointerEvents = ''; showErr('sdgco-cos-err', m); },
  });

function generateCosForSdgCo() {
  if (!S.selected) {
    _sdgCoPath = 'generate';
    _sdgCoSetGenerateSteps();
    showSection('upload'); setStepBar(1);
    return;
  }
  const numCos   = +(document.getElementById('cos-slider')?.value || 5);
  const genBtn   = document.getElementById('btn-sdgco-gen-cos');
  const progress = document.getElementById('sdgco-cos-progress');
  const streamEl = document.getElementById('sdgco-cos-stream');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = 'Generating…'; }
  _startFakeProgress('sdgco-cos-progress', 20000, ['Analysing syllabus…', 'Mapping to Bloom\'s…', 'Crafting COs…', 'Finalising…']);
  streamEl.classList.remove('hidden'); streamEl.innerHTML = '';
  document.getElementById('sdgco-cos-review').classList.add('hidden');
  document.getElementById('btn-sdgco-proceed').disabled = true;

  const _resetGenBtn = () => { if (genBtn) { genBtn.disabled = false; genBtn.textContent = 'Generate COs'; } };

  let rawResult = '';
  const es = new EventSource(`/generate?code=${encodeURIComponent(S.selected)}&num_cos=${numCos}`);
  _addSSETimeout(es, 100_000, () => {
    streamEl.innerHTML += `\n<span style="color:#f87171">Timed out — try again.</span>`;
    _stopFakeProgress('sdgco-cos-progress');
    _resetGenBtn();
  });
  es.onmessage = function(e) {
    const d = JSON.parse(e.data);
    if (d.error) {
      es.close();
      streamEl.innerHTML += `\n<span style="color:#f87171">Error: ${esc(d.error)}</span>`;
      _stopFakeProgress('sdgco-cos-progress');
      _resetGenBtn();
      return;
    }
    if (d.chunk) {
      rawResult += d.chunk;
      streamEl.innerHTML = highlight(rawResult);
      streamEl.scrollTop = streamEl.scrollHeight;
    }
    if (d.done) {
      es.close();
      refreshTokenBadge();
      _stopFakeProgress('sdgco-cos-progress');
      streamEl.innerHTML += `\n<span class="log-ok">✓ COs generated</span>`;
      _sdgCoParsedCos = parseCosFromRaw(rawResult);
      _renderSdgCoCosReview(_sdgCoParsedCos);
      if (genBtn) { genBtn.disabled = false; genBtn.textContent = '↻ Re-generate All'; }
    }
  };
  es.onerror = function() {
    es.close();
    streamEl.innerHTML += `\n<span style="color:#f87171">Connection lost — try again.</span>`;
    _stopFakeProgress('sdgco-cos-progress');
    _resetGenBtn();
  };
}

function generateSdgCoContributions() {

function _doGenerateSdgCoContributions() {

function _renderSdgCoResults(d) {
  document.getElementById('sdgco-result-sdg').value = d.targetSdg || '';

  const tbody = document.getElementById('sdgco-result-tbody');
  tbody.innerHTML = (d.contributions || []).map((c, i) => `
    <tr>
      <td style="padding:8px 12px;font-weight:700;white-space:nowrap;">${esc(c.co)}</td>
      <td style="padding:8px 12px;font-size:.82rem;color:var(--muted);">${esc(c.statement || '')}</td>
      <td style="padding:6px 8px;text-align:center;">
        <input type="number" id="sdgco-score-${i}" min="0" max="3" step="0.5"
               value="${+(c.score||0).toFixed(2)}" oninput="_recomputePcts()"
               style="width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;
                      background:var(--card);font-size:.82rem;text-align:center;color:var(--text);">
      </td>
      <td id="sdgco-pct-${i}" style="padding:8px 12px;text-align:center;font-weight:700;color:var(--primary);">
        ${(c.pct||0).toFixed(2)}%
      </td>
    </tr>`).join('');

  const totalScore = (d.contributions||[]).reduce((s,c) => s + (c.score||0), 0);
  document.getElementById('sdgco-total-score').textContent = totalScore.toFixed(2);
  _sdgCoUpdateInterpretation();
}

function _recomputePcts() {
  // Local-only recalc: reads current score inputs, updates pct cells live.
  if (!_sdgCoResultData) return;
  const rows = _sdgCoResultData.contributions || [];
  const scores = rows.map((c, i) => {
    const el = document.getElementById(`sdgco-score-${i}`);
    return { ...c, score: el ? (parseFloat(el.value) || 0) : (c.score || 0) };
  });
  const totalScore = scores.reduce((s, c) => s + c.score, 0);
  scores.forEach((c, i) => {
    c.pct = totalScore > 0 ? Math.round(c.score / totalScore * 10000) / 100 : 0;
    const pctEl = document.getElementById(`sdgco-pct-${i}`);
    if (pctEl) pctEl.textContent = c.pct.toFixed(2) + '%';
  });
  const totEl = document.getElementById('sdgco-total-score');
  if (totEl) totEl.textContent = totalScore.toFixed(2);
  _sdgCoResultData.contributions = scores;
  _sdgCoUpdateInterpretation();
}

function recalculateSdgCo() {
  if (!_sdgCoResultData) return;
  const sdgInput  = document.getElementById('sdgco-result-sdg');
  const targetSdg = sdgInput ? sdgInput.value.trim() : '';
  if (!targetSdg) {
    const errEl = document.getElementById('sdgco-result-err');
    errEl.textContent = 'Enter a Target SDG before recalculating.';
    errEl.classList.remove('hidden'); return;
  }
  const cos   = (_sdgCoResultData.contributions || []).map(c => ({ name: c.co, statement: c.statement || '' }));
  const btn   = document.getElementById('btn-sdgco-recalc');
  const errEl = document.getElementById('sdgco-result-err');
  errEl.classList.add('hidden');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  fetch('/generate_sdg_co_contributions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cos, target_sdg: targetSdg, course: S.selected || '' }),
  })
  .then(r => r.json())
  .then(d => {
    if (btn) { btn.disabled = false; btn.textContent = 'Recalculate for SDG'; }
    if (d.error) { errEl.textContent = d.error; errEl.classList.remove('hidden'); return; }
    _sdgCoResultData = d;
    _renderSdgCoResults(d);
    refreshTokenBadge();
  })
  .catch(e => {
    if (btn) { btn.disabled = false; btn.textContent = 'Recalculate for SDG'; }
    errEl.textContent = 'Recalculate failed: ' + e.message;
    errEl.classList.remove('hidden');
  });
}

function _sdgCoUpdateInterpretation() {
  if (!_sdgCoResultData) return;
  const targetSdg = document.getElementById('sdgco-result-sdg').value.trim() || 'Target SDG';
  const sorted = [...(_sdgCoResultData.contributions||[])].sort((a,b) => b.pct - a.pct);
  const top = sorted[0] || {};
  const interpLines = sorted.map((sv,i) =>
    `<strong>${esc(sv.co)}</strong> contributes <strong>${(sv.pct||0).toFixed(2)}%</strong>` +
    `${i === 0 ? ' — <em>strongest driver</em>' : ''}.`
  ).join('<br>');
  document.getElementById('sdgco-interp-text').innerHTML =
    `For <strong>${esc(targetSdg)}</strong>, the CO-level contribution breakdown is:<br>${interpLines}<br><br>` +
    `<strong>${esc(top.co||'')}</strong> is the primary contributor to ${esc(targetSdg)} through its course outcome alignment.`;
}

function sdgCoAddPo() {
  const n = _sdgCoPos.length;
  _sdgCoPos.push(`PO${n+1}`);

}

function _sdgCoRemovePo(idx) {
  if (_sdgCoPos.length <= 1) return;
  _sdgCoPos.splice(idx, 1);
  _sdgCoCos.forEach((_,ci) => {
    const nr = {};
    let ni = 0;
    for (let pi = 0; pi < _sdgCoPos.length + 1; pi++) {
      if (pi !== idx) { nr[ni] = (_sdgCoPoWts[ci]||{})[pi]||0; ni++; }
    }
    _sdgCoPoWts[ci] = nr;
  });
  const np = {};
  let ni = 0;
  for (let pi = 0; pi < _sdgCoPos.length + 1; pi++) {
    if (pi !== idx) { np[ni] = _sdgCoPoSdgWts[pi]||1; ni++; }
  }
  _sdgCoPoSdgWts = np;
  _renderSdgCoWeightsForm();
}

function _renderSdgCoCoPOTable() {
  const tbl = document.getElementById('sdgco-copo-table');

function computeSdgCo() {
  const errEl = document.getElementById('sdgco-input-err');
  errEl.classList.add('hidden');
  if (_sdgCoCos.length === 0) { errEl.textContent = 'Add at least one CO.'; errEl.classList.remove('hidden'); return; }
  if (_sdgCoPos.length === 0) { errEl.textContent = 'Add at least one PO.'; errEl.classList.remove('hidden'); return; }

  const targetSdg = (document.getElementById('sdgco-target-sdg')||{}).value || 'Target SDG';

  // PO-SDG weights array and max
  const poSdgW = _sdgCoPos.map((_,pi) => _sdgCoPoSdgWts[pi] !== undefined ? _sdgCoPoSdgWts[pi] : 0);
  const maxPoSdg = Math.max(...poSdgW, 1);

  // CO-SDG score:
  // score_i = att_i × Σ_j(CO-PO_w(i,j) × PO-SDG_w(j)) / (Σ_j(CO-PO_w(i,j)) × maxPoSdg)
  const coSdgScores = _sdgCoCos.map((co, ci) => {
    const row = _sdgCoPoWts[ci] || {};
    let num = 0, sumCoPo = 0;
    _sdgCoPos.forEach((_, pi) => {
      const cpw = row[pi] !== undefined ? row[pi] : 0;
      num     += cpw * poSdgW[pi];
      sumCoPo += cpw;
    });
    const score = sumCoPo > 0 ? co.attainment * num / (sumCoPo * maxPoSdg) : 0;
    return { co: co.name, score: Math.round(score * 100) / 100 };
  });

  const n = _sdgCoCos.length;
  const contributions = coSdgScores.map(cs => ({
    co:           cs.co,
    score:        cs.score,
    contribution: Math.round(cs.score / n * 100) / 100,
  }));

  const total = Math.round(contributions.reduce((s,sv) => s + sv.contribution, 0) * 100) / 100;
  const withPct = contributions.map(sv => ({
    ...sv,
    pct: total > 0 ? Math.round(sv.contribution / total * 10000) / 100 : 0,
  }));

  const top = withPct.reduce((best, sv) => sv.pct > best.pct ? sv : best, withPct[0]);

  _sdgCoResultData = {
    cos: _sdgCoCos, pos: _sdgCoPos, targetSdg,
    coPoWeights: JSON.parse(JSON.stringify(_sdgCoPoWts)),
    poSdgWeights: JSON.parse(JSON.stringify(_sdgCoPoSdgWts)),
    coSdgScores, contributions: withPct, total,
  };

  document.getElementById('sdgco-result-sub').textContent =
    `${n} COs → ${_sdgCoPos.length} POs → ${targetSdg} · Total contribution: ${total.toFixed(2)}`;

  // CO-SDG scores table
  let st = `<table class="po-map" style="width:100%;">
    <thead><tr>
      <th style="text-align:left;padding:8px 12px;">CO</th>
      <th style="text-align:center;padding:8px 12px;">CO–${esc(targetSdg)} Score</th>
    </tr></thead><tbody>`;
  coSdgScores.forEach(cs => {
    st += `<tr>
      <td style="padding:8px 12px;font-weight:600;">${esc(cs.co)}</td>
      <td style="padding:8px 12px;text-align:center;font-weight:700;">${cs.score.toFixed(2)}</td>
    </tr>`;
  });
  document.getElementById('sdgco-scores-wrap').innerHTML = st + '</tbody></table>';

  // Contribution breakdown table
  let sh = `<table class="po-map" style="width:100%;">
    <thead><tr>
      <th style="text-align:left;padding:8px 12px;">CO</th>
      <th style="text-align:center;padding:8px 12px;">Contribution Score</th>
      <th style="text-align:center;padding:8px 12px;">Percentage Share</th>
    </tr></thead><tbody>`;
  withPct.forEach(sv => {
    sh += `<tr>
      <td style="padding:8px 12px;font-weight:600;">${esc(sv.co)}</td>
      <td style="padding:8px 12px;text-align:center;font-weight:700;">${sv.contribution.toFixed(2)}</td>
      <td style="padding:8px 12px;text-align:center;color:var(--primary);font-weight:700;">${sv.pct.toFixed(2)}%</td>
    </tr>`;
  });
  sh += `<tr style="border-top:2px solid var(--border);font-weight:800;">
    <td style="padding:8px 12px;">Total</td>
    <td style="padding:8px 12px;text-align:center;">${total.toFixed(2)}</td>
    <td style="padding:8px 12px;text-align:center;">100%</td>
  </tr>`;
  document.getElementById('sdgco-contrib-wrap').innerHTML = sh + '</tbody></table>';

  // Interpretation
  const sorted = [...withPct].sort((a,b) => b.pct - a.pct);
  const interpLines = sorted.map((sv,i) =>
    `<strong>${esc(sv.co)}</strong> contributes <strong>${sv.pct.toFixed(2)}%</strong>` +
    `${i === 0 ? ' — <em>strongest driver</em>' : ''}.`
  ).join('<br>');
  document.getElementById('sdgco-interp-text').innerHTML =
    `For <strong>${esc(targetSdg)}</strong>, the CO-level contribution breakdown is:<br>${interpLines}<br><br>` +
    `<strong>${esc(top.co)}</strong> is the primary contributor to ${esc(targetSdg)} through its programme outcome mappings.`;

  showSection('sdgco-result');
  setStepBar(_sdgCoResultStepN());
}

function pickSdgCoFmt(fmt) {

function downloadSdgCo() {
  if (!_sdgCoResultData) return;
  // Sync editable fields before export
  const sdgInput = document.getElementById('sdgco-result-sdg');
  if (sdgInput) _sdgCoResultData.targetSdg = sdgInput.value.trim() || _sdgCoResultData.targetSdg;
  _recomputePcts();   // apply any unsaved manual score edits before export

  const btn = document.getElementById('btn-sdgco-download');
  const errEl = document.getElementById('sdgco-result-err');
  errEl.classList.add('hidden');
  if (btn) { btn.disabled = true; btn.innerHTML = '…'; }
  fetch('/export_sdg_co', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ data: _sdgCoResultData, fmt: _sdgCoFmt }),
  })
  .then(r => r.ok ? r.blob() : r.json().then(d => Promise.reject(d.error || 'Export failed')))
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `SDG_CO_Contributions.${_sdgCoFmt}`; a.click();
    URL.revokeObjectURL(url);
  })
  .catch(e => { errEl.textContent = typeof e === 'string' ? e : String(e); errEl.classList.remove('hidden'); })
  .finally(() => { if (btn) { btn.disabled = false; btn.innerHTML = '⬇ Download'; } });
}

// CO file upload zone wiring
(function() {
  const zone  = document.getElementById('coatt-co-upload-zone');
  const input = document.getElementById('coatt-co-file-input');
  if (!zone || !input) return;
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) _handleCoAttCoUpload(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => { if (input.files[0]) _handleCoAttCoUpload(input.files[0]); });
})();

function _handleCoAttCoUpload(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['txt','docx','doc','pdf'].includes(ext)) {
    showErr('coatt-cos-err', `Unsupported type ".${ext}". Use TXT, DOCX, or PDF.`); return;
  }
  document.getElementById('coatt-cos-err').classList.add('hidden');
  document.getElementById('coatt-cos-review').classList.add('hidden');
  document.getElementById('btn-coatt-proceed').disabled = true;
  document.getElementById('coatt-co-upload-zone').style.pointerEvents = 'none';
  const fd = new FormData();
  fd.append('file', file);
  _xhrUpload('/upload_co_qbank', fd, {
    progressId: 'coatt-co-upload-loading', uploadLabel: 'Uploading CO file…',
    processMs: 4000, processLabels: ['Parsing CO file…', 'Reading outcomes…', 'Almost done…'],
    onSuccess: d => { document.getElementById('coatt-co-upload-zone').style.pointerEvents = ''; _coAttParsedCos = d.cos; _renderCoAttCosReview(d.cos); },
    onError:   m => { document.getElementById('coatt-co-upload-zone').style.pointerEvents = ''; showErr('coatt-cos-err', m); },
  });
}

function generateCosForCoAtt() {
  if (!S.selected) return;
  const numCos   = +(document.getElementById('cos-slider')?.value || 5);
  const genBtn   = document.getElementById('btn-coatt-gen-cos');
  const progress = document.getElementById('coatt-cos-progress');
  const streamEl = document.getElementById('coatt-cos-stream');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = 'Generating…'; }
  _startFakeProgress('coatt-cos-progress', 20000, ['Analysing syllabus…', 'Mapping to Bloom\'s…', 'Crafting COs…', 'Finalising…']);
  streamEl.classList.remove('hidden'); streamEl.innerHTML = '';
  document.getElementById('coatt-cos-review').classList.add('hidden');
  document.getElementById('btn-coatt-proceed').disabled = true;

  const _resetGenBtn = () => { if (genBtn) { genBtn.disabled = false; genBtn.textContent = 'Generate COs'; } };
  let rawResult = '';
  const es = new EventSource(`/generate?code=${encodeURIComponent(S.selected)}&num_cos=${numCos}`);
  _addSSETimeout(es, 100_000, () => {
    streamEl.innerHTML += `\n<span style="color:#f87171">Timed out — try again.</span>`;
    _stopFakeProgress('coatt-cos-progress'); _resetGenBtn();
  });
  es.onmessage = function(e) {
    const d = JSON.parse(e.data);
    if (d.error) {
      es.close();
      streamEl.innerHTML += `\n<span style="color:#f87171">Error: ${esc(d.error)}</span>`;
      _stopFakeProgress('coatt-cos-progress'); _resetGenBtn(); return;
    }
    if (d.chunk) { rawResult += d.chunk; streamEl.innerHTML = highlight(rawResult); streamEl.scrollTop = streamEl.scrollHeight; }
    if (d.done) {
      es.close(); refreshTokenBadge();
      _stopFakeProgress('coatt-cos-progress');
      streamEl.innerHTML += `\n<span class="log-ok">✓ COs generated</span>`;
      _coAttParsedCos = parseCosFromRaw(rawResult);
      _renderCoAttCosReview(_coAttParsedCos);
      if (genBtn) { genBtn.disabled = false; genBtn.textContent = '↻ Re-generate All'; }
    }
  };
  es.onerror = function() {
    es.close();
    streamEl.innerHTML += `\n<span style="color:#f87171">Connection lost — try again.</span>`;
    _stopFakeProgress('coatt-cos-progress'); _resetGenBtn();
  };
}

function _renderCoAttCosReview(cos) {
  const el = document.getElementById('coatt-cos-list');
  const showCheck = _coAttPath === 'generate';
  el.innerHTML = cos.map((c, i) => `
    <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 14px;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
      ${showCheck ? `<input type="checkbox" class="coatt-co-check" data-num="${c.num}" style="margin-top:3px;flex-shrink:0;accent-color:var(--primary);width:15px;height:15px;cursor:pointer;" title="Select to re-generate">` : ''}
      <span style="font-size:.83rem;font-weight:700;white-space:nowrap;min-width:36px;color:var(--primary);">CO${c.num}</span>
      <span style="font-size:.83rem;color:var(--text);line-height:1.5;">${esc(c.statement)}</span>
    </div>`).join('');
  document.getElementById('coatt-cos-review').classList.remove('hidden');

function _regenSelected(checkClass, parsedCos, renderFn, proceedId, regenId, errId) {
  const checks = [...document.querySelectorAll(`.${checkClass}:checked`)];
  if (!checks.length) {
    if (checkClass === 'coatt-co-check') generateCosForCoAtt();
    else generateCosForSdgCo();
    return;
  }
  const toReplace   = checks.map(cb => parseInt(cb.dataset.num));
  const existingCos = parsedCos.map((c, i) => ({ name: `CO${c.num || i + 1}`, statement: c.statement || '' }));
  const btn   = document.getElementById(regenId);
  const errEl = document.getElementById(errId);
  errEl.classList.add('hidden');
  if (btn) { btn.disabled = true; btn.textContent = 'Regenerating…'; }
  document.getElementById(proceedId).disabled = true;
  fetch('/regenerate_selected_cos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: S.selected || '', to_replace: toReplace, existing_cos: existingCos }),
  })
  .then(r => r.json())
  .then(d => {
    if (btn) { btn.disabled = false; btn.innerHTML = '↻ Re-generate'; }
    document.getElementById(proceedId).disabled = false;
    if (d.error) { showErr(errId, d.error); return; }
    d.cos.forEach(nc => {
      const idx = parsedCos.findIndex(c => (c.num || 0) === nc.num);
      if (idx >= 0) parsedCos[idx] = { num: nc.num, statement: nc.statement };
    });
    renderFn(parsedCos);
    refreshTokenBadge();
  })
  .catch(e => {
    if (btn) { btn.disabled = false; btn.innerHTML = '↻ Re-generate'; }
    document.getElementById(proceedId).disabled = false;
    showErr(errId, 'Failed: ' + e.message);
  });
}

function regenSelectedCoAtt() {

function regenSelectedSdgCo() {

function generateCoAttainment() {
  if (!_coAttParsedCos.length && _coAttTab === 'auto') {
    generateCosForCoAtt(); return;
  }
  if (!_coAttParsedCos.length) { showErr('coatt-cos-err', 'No COs loaded.'); return; }

  const loading = document.getElementById('coatt-gen-loading');
  const errEl   = document.getElementById('coatt-cos-err');
  errEl.classList.add('hidden');
  btn.disabled = true;
  loading.classList.remove('hidden');

  fetch('/generate_co_attainment_ai', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ cos, course: S.selected || '', t1, t2, t3 }),
  })

  .then(d => {

    loading.classList.add('hidden'); btn.disabled = false;

function _renderCoAttResults() {
  const r = _coAttResult;
  if (!r) return;

  const sub = `${r.studentCount} student(s) · ${r.questionCount} question column(s) · ${r.coResults.length} CO(s)` +
              (r.courseName ? ` · ${r.courseName}` : '') + (r.courseCode ? ` (${r.courseCode})` : '');

  const levelColor = l => l === 3 ? '#10b981' : l === 2 ? '#6366f1' : l === 1 ? '#f59e0b' : '#ef4444';

  // CO table
  let coHtml = `<table class="po-map" style="width:auto;min-width:320px;">
    <thead><tr>
      <th style="text-align:left;padding:8px 14px;font-size:.82rem;">CO</th>
      <th style="padding:8px 14px;font-size:.82rem;text-align:center;">CO %</th>
      <th style="padding:8px 14px;font-size:.82rem;text-align:center;">Attainment Level</th>
    </tr></thead><tbody>`;
  r.coResults.forEach(co => {
    const c = levelColor(co.level);
    coHtml += `<tr>
      <td style="padding:7px 14px;font-size:.83rem;font-weight:600;">${esc(co.co)}</td>
      <td style="padding:7px 14px;text-align:center;font-size:.83rem;">${co.pct.toFixed(2)}%</td>

        <span style="display:inline-block;padding:3px 14px;border-radius:6px;font-weight:700;font-size:.83rem;background:${c}22;color:${c};">${co.level}</span>
      </td></tr>`;
  });
  document.getElementById('coatt-co-wrap').innerHTML = coHtml + '</tbody></table>';

  // PO table
  if (r.poResults.length > 0) {
    let poHtml = `<table class="po-map" style="width:auto;"><thead><tr>`;
    r.poResults.forEach(p => { poHtml += `<th style="padding:8px 12px;font-size:.82rem;text-align:center;">${esc(p.po)}</th>`; });
    poHtml += '</tr></thead><tbody><tr>';
    r.poResults.forEach(p => {
      poHtml += `<td style="padding:7px 12px;text-align:center;font-size:.85rem;font-weight:700;">${p.attainment}</td>`;
    });
    document.getElementById('coatt-po-wrap').innerHTML = poHtml + '</tr></tbody></table>';
  } else {
    document.getElementById('coatt-po-wrap').innerHTML =
      '<p style="font-size:.82rem;color:var(--muted);">No PO sheet found in the uploaded file.</p>';
  }
}

function _aioToolToggle(cb) {

function _aioUpdateStartBtn() {
  const selected = [..._aio.selected];
  const toolTokens = AIO_TOOLS.filter(t => selected.includes(t.id)).reduce((s, t) => s + t.tokens, 0);
  // CO generation is auto-added (1 token) if CO-dependent tools are selected but cos is not
  const autoAddCos = selected.some(id => _AIO_CO_DEPS.has(id)) && !selected.includes('cos');
  const est = toolTokens + (autoAddCos ? 1 : 0);
  document.getElementById('aio-est-tokens').textContent = est;
  document.getElementById('btn-aio-start').disabled = _aio.selected.size === 0;
}

// ── Pipeline start ────────────────────────────────────────────────────────────
function aioStart() {
  if (_aio.selected.size === 0) return;

  // Build ordered queue: cos first if needed, then the rest in AIO_TOOLS order
  const toolOrder = AIO_TOOLS.map(t => t.id);
  const needsCos  = [..._aio.selected].some(id => _AIO_CO_DEPS.has(id));
  const queue     = [];

  // CO always first if it's selected or required
  if (_aio.selected.has('cos') || needsCos) {
    queue.push('cos');
  }
  for (const id of toolOrder) {
    if (id !== 'cos' && _aio.selected.has(id)) queue.push(id);
  }

  _aio.queue     = queue;
  _aio.queueStep = 0;
  _aio.cos       = [];
  _aio.results   = {};
  _aio.previews  = {};

  showSection('aio-run'); setStepBar(4);
  _aioRunStep();
}

// ── Run current pipeline step ─────────────────────────────────────────────────
function _aioRunStep() {
  if (_aio.queueStep >= _aio.queue.length) {
    _aioShowDone();
    return;
  }

  const toolId = _aio.queue[_aio.queueStep];
  const tool   = AIO_TOOLS.find(t => t.id === toolId);

  // Update header
  document.getElementById('aio-run-icon').textContent  = tool.icon;
  document.getElementById('aio-run-title').textContent = `Generating ${tool.label}…`;
  document.getElementById('aio-run-sub').textContent   = `Step ${_aio.queueStep + 1} of ${_aio.queue.length}`;

  // Reset UI state
  document.getElementById('aio-preview-wrap').classList.add('hidden');
  document.getElementById('aio-run-progress').classList.remove('hidden');
  document.getElementById('aio-run-stream').classList.add('hidden');
  document.getElementById('aio-run-stream').innerHTML = '';
  document.getElementById('aio-run-loading').classList.add('hidden');
  document.getElementById('aio-run-err').classList.add('hidden');
  document.getElementById('aio-edit-wrap').classList.add('hidden');
  _aio.expanded = false;
  document.getElementById('btn-aio-expand').textContent = 'Expand';

  _aioUpdatePills();

  // Dispatch to per-tool generator
  switch (toolId) {
    case 'cos':           _aioRunCos();   break;
    case 'qbank':         _aioRunQbank(); break;
    case 'pomap':         _aioRunPomap(); break;
    case 'lessonplan':    _aioRunLp();    break;
    case 'teachingdiary': _aioRunTd();    break;
    case 'sdgco':         _aioRunSdgCo(); break;
    case 'sdgpo':         _aioRunSdgPo(); break;
    case 'coatt':         _aioRunCoAtt(); break;
  }
}

function _aioOnDone(toolId, previewText, resultData) {
  _aio.previews[toolId] = previewText;
  if (resultData !== undefined) _aio.results[toolId] = resultData;

  _aioUpdatePills();

  // Show preview
  document.getElementById('aio-run-progress').classList.add('hidden');
  document.getElementById('aio-run-loading').classList.add('hidden');
  document.getElementById('aio-run-stream').classList.add('hidden');

  const box = document.getElementById('aio-preview-box');
  box.textContent      = previewText;
  box.style.maxHeight  = '200px';
  box.style.display    = '';
  document.getElementById('btn-aio-expand').style.display = '';
  document.getElementById('aio-preview-actions').style.display = '';
  document.getElementById('aio-preview-wrap').classList.remove('hidden');
  document.getElementById('aio-edit-wrap').classList.add('hidden');

  const tool = AIO_TOOLS.find(t => t.id === toolId);
  document.getElementById('aio-run-title').textContent = `${tool.label} — Done`;

  // Show/hide Edit and Regenerate based on tool capability
  document.getElementById('btn-aio-edit').style.display  = tool.canEdit  ? '' : 'none';
  document.getElementById('btn-aio-regen').style.display = tool.canRegen ? '' : 'none';

  const isLast = _aio.queueStep >= _aio.queue.length - 1;
  document.getElementById('btn-aio-next').textContent = isLast ? 'Finish →' : 'Next →';

  refreshTokenBadge();
  // Only count as history generation if user explicitly selected this tool
  if (_aio.selected.has(toolId)) saveHistory(toolId);
}

// ── CO parser helper ──────────────────────────────────────────────────────────
function _parseAioCos(text) {
  const seen  = new Set();
  const cos   = [];
  const lines = text.replace(/\r\n/g, '\n').replace(/\*\*/g, '').split('\n');

  for (let i = 0; i < lines.length; i++) {
    // Strip leading/trailing pipe and surrounding whitespace (handles table rows)
    const raw = lines[i].replace(/^\s*\|?\s*/, '').replace(/\s*\|.*$/, '').trim();

    // Match CO heading: CO1: / CO1. / CO1 - / CO1 – / CO1<space>text
    const m = raw.match(/^CO(\d+)\s*[:\.\-–]?\s*(.+)/i);
    if (!m || !m[2].trim()) continue;

    const num = parseInt(m[1], 10);
    if (seen.has(num)) continue;

    let stmt = m[2].trim();

    // Collect continuation lines until blank, new CO heading, table separator, or metadata
    while (i + 1 < lines.length) {
      const nxt = lines[i + 1].replace(/^\s*\|?\s*/, '').replace(/\s*\|.*$/, '').trim();
      if (!nxt ||
          /^CO\d+\s*[:\.\-–]/i.test(nxt) ||
          /^[-|=\s]+$/.test(nxt) ||
          /^(Unit|Bloom|BT\s*Level|Knowledge|PO|SDG|Mapping|Sl\.?\s*No)/i.test(nxt)) break;
      stmt += ' ' + nxt;
      i++;
    }

    stmt = stmt.replace(/-\s+/g, '-').replace(/\s+/g, ' ').trim();
    if (stmt.length > 15) {
      seen.add(num);
      cos.push({ num, statement: stmt });
    }
  }
  return cos;
}

// ── Prepare session helper (calls /aio_prepare) ───────────────────────────────
async function _aioPrepare() {
  const body = {
    code: S.selected || '',
    cos:  _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement })),
  };
  const r = await fetch('/aio_prepare', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('Session setup failed');
  return r.json();
}

// CO Generation
function _aioRunCos() {
  const streamEl = document.getElementById('aio-run-stream');
  streamEl.classList.remove('hidden');
  _startFakeProgress('aio-run-progress', 25000, [
    'Analysing syllabus…', 'Mapping to Bloom\'s taxonomy…', 'Crafting CO statements…', 'Finalising outcomes…'
  ]);
  let chunks = [];

  const es = new EventSource(`/generate?code=${encodeURIComponent(S.selected || '')}&num_cos=5`);
  const _coTimeout = _addSSETimeout(es, 100000, () => {
    showErr('aio-run-err', 'CO generation timed out. Try regenerating.');
  });

  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.error) {
      es.close(); _coTimeout(); _stopFakeProgress('aio-run-progress');
      showErr('aio-run-err', d.error);
      return;
    }
    if (d.chunk) {
      chunks.push(d.chunk);
      streamEl.textContent = chunks.join('');
      streamEl.scrollTop = streamEl.scrollHeight;
    }
    if (d.done) {
      es.close(); _coTimeout();
      const raw = chunks.join('');
      _aio.cos  = (d.cos && d.cos.length) ? d.cos : _parseAioCos(raw);
      const preview = _aio.cos.length
        ? _aio.cos.map(c => `CO${c.num}: ${c.statement}`).join('\n')
        : raw.trim();
      _stopFakeProgress('aio-run-progress');
      _aioOnDone('cos', preview);
    }
  };
  es.onerror = () => {
    es.close(); _coTimeout(); _stopFakeProgress('aio-run-progress');
    showErr('aio-run-err', 'Connection error generating COs. Try regenerating.');
  };
}

// Question Bank
async function _aioRunQbank() {
  const streamEl = document.getElementById('aio-run-stream');
  streamEl.classList.remove('hidden');
  const statusLines = [];

  // Sync session so QBank can use AIO-generated COs via current_result
  if (_aio.cos.length) {
    try { await _aioPrepare(); } catch(e) {
      showErr('aio-run-err', 'Session setup failed: ' + e.message); return;
    }
  }

  const params = new URLSearchParams({
    code: S.selected || '', n2: 4, n5: 4, n10: 4, n_assign: 2, n_quiz: 5, n_exp: 3,
  });
  // Pass CO numbers so QBank uses the pre-generated COs instead of auto-generating
  if (_aio.cos.length) {
    params.set('selected_cos', _aio.cos.map(c => c.num).join(','));
  }

  const es = new EventSource(`/generate_qbank?${params}`);
  const _qbTimeout = _addSSETimeout(es, 300000, () => {
    showErr('aio-run-err', 'Question Bank generation timed out. Try regenerating.');
  });

  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'error') {
      es.close(); _qbTimeout();
      document.getElementById('aio-run-progress').classList.add('hidden');
      showErr('aio-run-err', d.message);
      return;
    }
    if (d.type === 'status') {
      statusLines.push(d.message);
      streamEl.textContent = statusLines.join('\n');
      streamEl.scrollTop = streamEl.scrollHeight;
    }
    if (d.type === 'done') {
      es.close(); _qbTimeout();
      document.getElementById('aio-run-progress').classList.add('hidden');
      const summary = `Question Bank generated successfully.\n${d.num_units || 0} unit(s) processed.\n\nDownload from the Done screen at the end of the pipeline.`;
      _aioOnDone('qbank', summary);
    }
  };
  es.onerror = () => {
    es.close(); _qbTimeout();
    document.getElementById('aio-run-progress').classList.add('hidden');
    showErr('aio-run-err', 'Connection error generating Question Bank. Try regenerating.');
  };
}

function _buildPomapPreview(rows) {
  if (!rows.length) return 'CO–PO Mapping generated (no rows).';
  const poKeys = Object.keys(rows[0].scores || {});
  let txt = 'CO–PO Mapping  (3 = Strong · 2 = Moderate · 1 = Low · 0 = None)\n\n';
  txt += 'CO      ' + poKeys.map(k => k.padStart(4)).join(' ') + '\n';
  txt += '─'.repeat(8 + poKeys.length * 5) + '\n';
  for (const row of rows) {
    const scores = poKeys.map(k => String(row.scores[k] ?? 0).padStart(4));
    txt += (row.co || '').padEnd(8) + scores.join(' ') + '\n';
  }
  return txt;
}

// PO → SDG Contribution
async function _aioRunSdgPo() {
  const progressEl = document.getElementById('aio-run-progress');
  const loadingEl  = document.getElementById('aio-run-loading');
  progressEl.classList.add('hidden');
  loadingEl.classList.remove('hidden');
  document.getElementById('aio-run-loading-label').textContent = 'Analysing PO → SDG contributions…';

  try {
    const r = await fetch('/generate_sdg_po_auto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ course: S.selected || '' }),
    });
    const d = await r.json();
    loadingEl.classList.add('hidden');
    if (d.error) { showErr('aio-run-err', d.error); return; }

    // Compute contributions (same logic as the SDG-PO mode)
    const pos  = d.pos  || [];
    const sdgs = d.sdgs_selected || [];
    const wAll = d.weights_all   || {};
    const _interp = v => v >= 85 ? 'Excellent' : v >= 70 ? 'Strong' : v >= 50 ? 'Moderate' : 'Weak';

    const results = sdgs.map(sdgLabel => {
      const wts = wAll[sdgLabel] || {};
      let num = 0, den = 0;
      pos.forEach(po => { const w = parseFloat(wts[po.name] || 0); num += po.attainment * w; den += w; });
      const contribution = den > 0 ? Math.round(num / den * 100) / 100 : 0;
      return { sdg: sdgLabel, contribution, interpretation: _interp(contribution) };
    });
    const composite = results.length
      ? Math.round(results.reduce((s, r) => s + r.contribution, 0) / results.length * 100) / 100 : 0;

    const resultData = { pos, sdgs, results, composite };
    _aioOnDone('sdgpo', _buildSdgPoPreview(resultData), resultData);
  } catch(e) {
    loadingEl.classList.add('hidden');
    showErr('aio-run-err', 'Failed: ' + e.message);
  }
}

function _buildSdgPoPreview(d) {
  let txt = `PO → SDG Contribution\nComposite SDG Index: ${d.composite.toFixed(2)}%\n\n`;
  (d.results || []).forEach(r => {
    txt += `${r.sdg.padEnd(48)}  ${r.contribution.toFixed(2)}%  (${r.interpretation})\n`;
  });
  return txt;
}

// CO Attainment
async function _aioRunCoAtt() {
  const progressEl = document.getElementById('aio-run-progress');
  const loadingEl  = document.getElementById('aio-run-loading');
  progressEl.classList.add('hidden');

  if (!_aio.cos.length) {
    showErr('aio-run-err', 'No COs available — ensure Course Outcomes is included in your selection.');
    return;
  }

  loadingEl.classList.remove('hidden');
  document.getElementById('aio-run-loading-label').textContent = 'Estimating CO attainment…';

  const cos = _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement }));
  try {
    const r = await fetch('/generate_co_attainment_ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cos, course: S.selected || '', t1: 70, t2: 60, t3: 50 }),
    });
    const d = await r.json();
    loadingEl.classList.add('hidden');
    if (d.error) { showErr('aio-run-err', d.error); return; }
    _aioOnDone('coatt', _buildCoAttPreview(d), d);
  } catch(e) {
    loadingEl.classList.add('hidden');
    showErr('aio-run-err', 'Failed: ' + e.message);
  }
}

function _buildCoAttPreview(d) {
  let txt = 'CO Attainment  (AI Estimation)\n\n';
  txt += `${'CO'.padEnd(8)}  ${'Attainment%'.padEnd(13)}  Level\n${'─'.repeat(34)}\n`;
  (d.coResults || []).forEach(c => {
    txt += `${c.co.padEnd(8)}  ${c.pct.toFixed(2).padEnd(13)}  ${c.level}\n`;
  });
  if ((d.poResults || []).length) {
    txt += '\nPO Attainment:\n';
    txt += d.poResults.map(p => `${p.po}: ${p.attainment}`).join('  ');
  }
  return txt;
}

// ── Done screen ───────────────────────────────────────────────────────────────
function _aioShowDone() {
  setStepBar(5);
  const completed = _aio.queue.filter(id => _aio.previews[id] !== undefined);

  document.getElementById('aio-done-sub').textContent =
    completed.length
      ? `${completed.length} document(s) generated. Download each one below.`
      : 'No documents were generated.';

  document.getElementById('aio-done-list').innerHTML = completed.map(toolId => {
    const tool = AIO_TOOLS.find(t => t.id === toolId);
    return `
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;flex-wrap:wrap;">
        <span style="font-size:1.5rem;flex-shrink:0;">${tool.icon}</span>
        <div style="flex:1;min-width:120px;">
          <p style="font-weight:700;font-size:.92rem;margin:0 0 2px;">${tool.label}</p>
          <p style="font-size:.77rem;color:var(--muted);margin:0;">Generated successfully</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="ctrl-btn" onclick="_aioDownload('${toolId}','txt')"  style="font-size:.77rem;">TXT</button>
          <button class="ctrl-btn" onclick="_aioDownload('${toolId}','docx')" style="font-size:.77rem;">DOCX</button>
          <button class="ctrl-btn" onclick="_aioDownload('${toolId}','pdf')"  style="font-size:.77rem;">PDF</button>
        </div>
      </div>`;
  }).join('');

  showSection('aio-done');
}

async function _aioDownload(toolId, fmt) {
  const code = S.selected || '';
  let url, bodyData;

  switch (toolId) {
    case 'cos':
      url      = '/export_coatt_cos';
      bodyData = { fmt, cos: _aio.cos.map(c => ({ name: `CO${c.num}`, statement: c.statement })), code };
      break;
    case 'qbank':
      url = '/export_qbank'; bodyData = { fmt }; break;
    case 'pomap':
      url = '/export_po_mapping'; bodyData = { fmt, rows: _aio.results['pomap'] }; break;
    case 'lessonplan':
      url = '/export_lp'; bodyData = { fmt }; break;
    case 'teachingdiary':
      url = '/export_td'; bodyData = { fmt }; break;
    case 'sdgco':
      url = '/export_sdg_co'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    case 'sdgpo':
      url = '/export_sdg_po'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    case 'coatt':
      url = '/export_co_attainment'; bodyData = { fmt, data: _aio.results[toolId] }; break;
    default: return;
  }

  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bodyData),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      alert(d.error || 'Download failed');
      return;
    }
    const blob = await r.blob();
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `${code}_${toolId}.${fmt}`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {
    alert('Download failed: ' + e.message);
  }
}
